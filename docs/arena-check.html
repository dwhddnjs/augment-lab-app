<!doctype html>

<head>

<title>아레나 검수 — 증강 201 · 프리즘 23</title>
<style>
  :root {
    --bg: #0d1311; --surface: #131b18; --raised: #1a2420; --border: #25322d;
    --text: #e8f0ec; --text2: #9bb0a8; --text3: #6c7f78;
    --mint: #1ED7A0; --silver: #b9c4cc; --gold: #e8c45f; --prism: #c98bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,19,17,.92);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .stats { color: var(--text2); font-size: 13px; }
  .stats b { color: var(--text); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  input[type=search] { background: var(--raised); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 8px 12px; font-size: 14px; min-width: 220px; outline: none; }
  input[type=search]:focus { border-color: var(--mint); }
  .chip { background: var(--raised); border: 1px solid var(--border); color: var(--text2);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; }
  .chip.active { background: var(--mint); color: #06231b; border-color: var(--mint); font-weight: 600; }
  main { padding: 20px 24px 60px; }
  .group-title { margin: 24px 0 12px; font-size: 15px; color: var(--text2); display: flex; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .icon { width: 56px; height: 56px; border-radius: 9px; flex: 0 0 56px; background: var(--raised);
    object-fit: contain; }
  .icon.err { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text3); }
  .meta { min-width: 0; flex: 1; }
  .ko { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 13px; color: var(--text); line-height: 1.45; margin-top: 8px; white-space: pre-wrap; }
  .badges { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .rb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
  .rb.silver { background: rgba(185,196,204,.15); color: var(--silver); }
  .rb.gold { background: rgba(232,196,95,.15); color: var(--gold); }
  .rb.prismatic { background: rgba(201,139,255,.15); color: var(--prism); }
  .lvl { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(30,215,160,.14); color: var(--mint); letter-spacing: -.5px; }
  .lvl.nolvl { background: rgba(108,127,120,.18); color: var(--text3); letter-spacing: 0; }
  .price { font-size: 12px; color: var(--gold); font-weight: 700; }
  .empty { color: var(--text3); padding: 40px; text-align: center; }
  .iconpath { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, monospace; }
</style>

<script>
const AUG = [{"id":"warmup-routine","ko":"준비 운동","en":"Warmup Routine","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/warmuproutine_small.png","descKo":"준비 운동 소환사 주문을 얻습니다.\n\n내면의 춤꾼에게 정신을 집중해 피해량이 초당 2% 증가하며 최대 20% 증가합니다.","descEn":"Gain the Warmup Routine Summoner Spell.\n\nChannel your inner dancer to increase your damage by 2% per second, up to 20% max."},{"id":"vanish","ko":"소멸","en":"Vanish","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/vanish_small.png","descKo":"소멸 소환사 주문을 얻습니다.\n\n소멸 사용 시 투명 상태가 됩니다.","descEn":"Gain the Vanish Summoner Spell.\n\nVanish turns you Invisible."},{"id":"cerberus","ko":"케르베로스","en":"Cerberus","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/cerberus_small.png","descKo":"칼날비와 집중 공격 핵심 룬을 얻습니다.","descEn":"Gain the Hail of Blades and Press the Attack Keystone Runes."},{"id":"typhoon","ko":"태풍","en":"Typhoon","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/typhoon_small.png","descKo":"기본 공격 시 추가 대상에게 화살을 발사해 감소된 피해를 입히고 적중 시 효과를 적용합니다.","descEn":"Your Attacks fire a bolt at an additional target dealing reduced damage and applying On-Hit effects."},{"id":"self-destruct","ko":"자폭","en":"Self Destruct","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/selfdestruct_small.png","descKo":"13초마다 자동 사용으로 자신에게 폭탄을 부착합니다. 폭탄은 폭발 시 주변 적에게 막대한 고정 피해를 입히고 공중으로 띄워 올립니다.","descEn":"Every 13 seconds Autocast, attach a bomb to yourself, it explodes, dealing massive true damage and Knocking Up nearby enemies."},{"id":"serve-beyond-death","ko":"기사회생","en":"Serve Beyond Death","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/servebeyonddeath_small.png","descKo":"라운드마다 처음으로 사망할 때 체력을 완전히 회복하고, 회복된 체력이 점차 줄어듭니다.\n\n체력이 줄어드는 동안 적 챔피언 처치에 관여하면 체력 감소가 중단됩니다.","descEn":"The first time you would die each round, instead return to full Health, decaying over time.\n\nTaking down an enemy champion while your Health is decaying stops the decay."},{"id":"undying-guard","ko":"불멸의 경계","en":"Undying Guard","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/dawnbringersresolve_small.png","descKo":"전쟁 단련으로 부활 시 자헨이 주위 적들에게 각 유닛의 현재 체력에 비례한 피해를 입히고 모든 대상을 뒤로 밀어내며 일정 거리 밖에 있는 적 챔피언에게 피해를 받지 않는 상태가 됩니다. 또한 이동 속도가 잠시 동안 크게 증가합니다.","descEn":"Upon reviving with Cultivation of War, Zaahen deals damage to nearby enemies based on their current Health and knocks all targets back, becoming impervious to damage dealt by champions outside of the circle created and gains a brief burst of movement speed."},{"id":"quantum-computing","ko":"양자 연산","en":"Quantum Computing","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/quantumcomputing_small.png","descKo":"주기적으로 주변에 강력한 베기를 자동 사용하여 물리 피해를 입힙니다.\n\n바깥쪽 칼날에 맞은 적은 둔화되고 추가 피해를 받으며, 자신은 체력을 회복합니다.","descEn":"Periodically Autocast a massive slash around you, dealing physical damage.\n\nEnemies hit by the outer edge are Slowed, take additional damage, and heal you."},{"id":"demons-dance","ko":"악마의 춤","en":"Demon's Dance","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/demonsdance_small.png","descKo":"기민한 발놀림 및 착취의 손아귀 핵심 룬을 얻습니다.","descEn":"Gain the Fleet Footwork and Grasp of the Undying Keystone Runes."},{"id":"defensive-maneuvers","ko":"방어 기동","en":"Defensive Maneuvers","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/defensivemaneuvers_small.png","descKo":"방어 기동 소환사 주문을 얻습니다.\n\n방어 기동을 사용하면 아군 팀에게 방어막 및 회복 소환사 주문을 사용합니다.","descEn":"Gain the Defensive Maneuvers Summoner Spell.\n\nDefensive Maneuvers Casts both Summoner Barrier and Heal on your team."},{"id":"transmute-chaos","ko":"전환: 혼돈","en":"Transmute: Chaos","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/transmutechaos_small.png","descKo":"무작위 %i:Augment%증강 2개를 획득합니다.","descEn":"Gain 2 random %i:Augment%Augments."},{"id":"chauffeur","ko":"운전기사","en":"Chauffeur","rarity":"prismatic","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/chauffeur_small.png","descKo":"아군에게 밀착하며 스스로 이동할 수 없습니다.\n\n아군에게 나의 추가 이동 속도를 부여하고 스킬 가속, 공격 속도가 증가합니다.","descEn":"You are attached to your ally and can't move on your own.\n\nYour bonus Move Speed is also granted to your ally, and you gain Ability Haste and Attack Speed."},{"id":"marksmage","ko":"마법 명사수","en":"Marksmage","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/marksmage_small.png","descKo":"기본 공격 시 주문력의 75%만큼 추가 물리 피해를 입힙니다.","descEn":"Your Attacks deal additional physical damage equal to 75% Ability Power."},{"id":"light-warden","ko":"빛의 파수꾼","en":"Light Warden","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/lightwarden_small.png","descKo":"몇 초마다 공격을 막는 빛을 자동 사용하여 빛을 통과하는 아군과 자신에게 보호막을 부여합니다. 이후 빛이 돌아오며 같은 효과를 반복합니다.","descEn":"Every few seconds, Autocast a warding light, Shielding yourself and allies it passes through before returning, repeating the effect."},{"id":"quest-mad-hatter","ko":"퀘스트: 미치광이 모자장수","en":"Quest: Mad Hatter","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/mad_hatter_small.png","descKo":"조건: 전투 종료 시 모자 10개를 착용해야 합니다.\n\n보상: 모자 1개당 적응형 능력치, 방어력, 마법 저항력, 강인함, 이동 속도를 얻습니다.","descEn":"Requirement: Wear 10 hats at the end of combat.\n\nReward: Gain Adaptive Force, Armor, Magic Resist, Tenacity, and Movement Speed per hat."},{"id":"blade-waltz","ko":"검무","en":"Blade Waltz","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/bladewaltz_small.png","descKo":"검무 소환사 주문을 얻습니다.\n\n검무를 사용하면 적에게 돌진해 6회 공격하는 동안 대상으로 지정되지 않습니다.","descEn":"Gain the Blade Waltz Summoner Spell.\n\nBlade Waltz makes you untargetable while you dash at and damage enemies 6 times."},{"id":"willing-sacrifice","ko":"희생의 의지","en":"Willing Sacrifice","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/willingsacrifice_small.png","descKo":"아군 챔피언의 체력이 30% 아래로 떨어지면, 자신의 체력 일부를 보호막으로 바꿔 해당 아군에게 부여합니다.","descEn":"When an allied champion drops below 30% Health, trade some of your health to Shield them."},{"id":"firefox","ko":"불여우","en":"Firefox","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/firfox_small.png","descKo":"자동 사용\n이동 속도가 증가하고 주위를 빙빙 도는 불꽃 3개를 생성합니다. 불꽃은 시야에 들어오는 가장 가까운 적을 대상으로 지정해 마법 피해를 입힙니다.","descEn":"Autocast\nGain Movement Speed and conjure three flames that orbit you, targetting the closest visible enemy in range and dealing magic damage."},{"id":"summoner-revolution","ko":"소환사 혁명","en":"Summoner Revolution","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/summonerrevolution_small.png","descKo":"소환사 주문 충전 횟수가 1회 추가됩니다.\n\n점멸이 라운드마다 초기화됩니다.","descEn":"Your Summoner Spells gain 1 additional charge(s).\n\nFlash resets every round."},{"id":"ice-cold","ko":"차가운 냉기","en":"Ice Cold","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/icecold_small.png","descKo":"둔화 효과가 이동 속도를 추가로 0 감소시킵니다.","descEn":"Your Slowing effects reduce Move Speed by an extra 0."},{"id":"spin-to-win","ko":"승리를 위한 회전","en":"Spin To Win","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/spintowin_small.png","descKo":"회전 스킬의 피해량이 15%, 스킬 가속이 15 증가합니다!","descEn":"Your spin Abilities gain 15 Ability Haste and deal 15% more damage!"},{"id":"bannerof-command","ko":"지휘관의 깃발","en":"Banner of Command","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/bannerofcommand_small.png","descKo":"지휘관의 깃발 소환사 주문을 얻습니다.\n\n지휘관의 깃발이 잠시 동안 아군을 강화합니다.","descEn":"Gain the Banner of Command Summoner Spell.\n\nBanner of Command empowers your ally for a brief duration."},{"id":"tank-it-or-leave-it","ko":"확률적 방어","en":"Tank It Or Leave It","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/tankitorleaveit_small.png","descKo":"공격당할 때 치명타 확률(최대 50%)에 따라 치명 방어가 발동해 받는 피해가 감소할 수 있습니다.\n\n%i:scaleCrit% 치명타 확률이 25% 증가합니다.","descEn":"You can Critically Defend using your Crit Chance (max 50% chance), giving you a chance to reduce damage.\n\nGain %i:scaleCrit% 25% Crit Chance."},{"id":"witchful-thinking","ko":"사악한 정신","en":"Witchful Thinking","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/witchfulthinking_small.png","descKo":"%i:scaleAP% 주문력이 60 증가합니다.","descEn":"Gain %i:scaleAP% 60 Ability Power."},{"id":"quest-urfs-champion","ko":"퀘스트: 우르프의 챔피언","en":"Quest: Urf's Champion","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/quest_urfschampion_small.png","descKo":"조건: 처치에 10회 관여해야 합니다.\n\n보상: 황금 뒤집개","descEn":"Requirement: Score 10 takedowns.\n\nReward: Golden Spatula"},{"id":"vengeance","ko":"복수","en":"Vengeance","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/vengeance_small.png","descKo":"파트너가 쓰러지면 남은 라운드 동안 피해량과 모든 피해 흡혈(옴니뱀)이 크게 증가합니다.","descEn":"After your partner dies, gain massively increased damage and Omnivamp for the rest of the round."},{"id":"erosion","ko":"부식","en":"Erosion","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/erosion_small.png","descKo":"적에게 피해를 입히면 4초 동안 방어력 및 마법 저항력 감소 중첩을 얻습니다.","descEn":"Damaging enemies adds a stacking Armor and Magic Resist shred for 4s."},{"id":"stats","ko":"능력치!","en":"Stats!","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/stats_small.png","descKo":"%i:StatAnvil% 능력치 모루를 2개 획득합니다.","descEn":"Gain 2 %i:StatAnvil% Stat Anvils!"},{"id":"masterof-duality","ko":"결투의 대가","en":"Master of Duality","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/masterofduality_small.png","descKo":"라운드가 끝날 때까지, 기본 공격 시 주문력(적중 시)을, 스킬 사용 시 공격력을 얻습니다.","descEn":"Your Attacks grant you Ability Power On-Hit and your Abilities grant you Attack Damage, until the end of the round."},{"id":"lightem-up","ko":"불을 밝혀","en":"Light 'em Up!","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/lightemup_small.png","descKo":"4번째 기본 공격마다 추가로 마법 피해(적중 시)를 입힙니다.","descEn":"Every 4th Attack deals additional magic damage On-Hit."},{"id":"searing-dawn","ko":"타오르는 새벽","en":"Searing Dawn","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/searingdawn_small.png","descKo":"스킬이 적에게 표식을 남깁니다. 적은 아군의 다음 기본 공격 또는 스킬로부터 마법 피해를 추가로 입습니다.","descEn":"Your Abilities mark enemies, causing them to take additional magic damage from your ally's next Attack or Ability."},{"id":"slap-around","ko":"우당탕탕","en":"Slap Around","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/slaparound_small.png","descKo":"적을 이동 불가 상태로 만들거나 이동 스킬을 사용할 수 없게 하면 해당 라운드에 15의 %i:miniAdaptiveForce% 적응형 능력치를 얻습니다.","descEn":"Each time you Immobilize or Ground an enemy, gain %i:miniAdaptiveForce% 15 Adaptive Force for the round."},{"id":"magic-missile","ko":"마법 미사일","en":"Magic Missile","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/magicmissile_small.png","descKo":"스킬로 피해를 입히면 마법 탄환 3발을 발사해 각각 최대 체력에 비례하는 고정 피해를 입힙니다.","descEn":"Dealing damage with an Ability fires 3 magic missiles, each dealing percent max Health true damage."},{"id":"spellwake","ko":"주문 각성","en":"Spellwake","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/spellwake_small.png","descKo":"스킬이 적에게 적중하면 현재 위치에서 적중당한 대상의 위치까지 마법 피해를 입히는 파동을 방출합니다.","descEn":"Hitting enemies with Abilities creates a blast that deals magic damage from you to the location you hit them."},{"id":"center-of-the-universe","ko":"우주의 중심","en":"Center of the Universe","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/centeroftheuniverse_small.png","descKo":"별이 주위를 맴돌며 통과하는 적에게 마법 피해를 입힙니다.","descEn":"Stars orbit you, dealing magic damage to enemies they pass through."},{"id":"phenomenal-evil","ko":"극악무도","en":"Phenomenal Evil","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/phenomenalevil_small.png","descKo":"적을 스킬로 맞히면 영구적으로 1의 주문력을 얻습니다.\n\n4라운드 이후 이 증강을 선택할 경우 40의 주문력을 얻습니다.","descEn":"Permanently gain 1 Ability Power when you hit an enemy with an Ability.\n\nIf taken after round 4, gain 40 Ability Power."},{"id":"big-brain","ko":"전술적 대비","en":"Big Brain","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/bigbrain_small.png","descKo":"각 라운드 시작 시 %i:scaleAP% 주문력 1당 1의 피해를 흡수하는 보호막을 얻습니다.","descEn":"At the start of each round, gain 1 Shield for every %i:scaleAP% 1 Ability Power."},{"id":"vulnerability","ko":"취약","en":"Vulnerability","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/vulnerability_small.png","descKo":"아이템 및 지속 피해 효과에 치명타가 적용될 수 있습니다.\n\n%i:scaleCrit% 치명타 확률이 25% 증가합니다.","descEn":"Your Item and damage over time effects can Critically Strike.\n\nGain %i:scaleCrit% 25% Crit chance."},{"id":"cannon-fodder","ko":"포탄","en":"Cannon Fodder","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/cannonfodder_small.png","descKo":"대포에서 발사되어 전투를 시작합니다.","descEn":"You enter combat launching from a cannon."},{"id":"ultimate-roulette","ko":"궁극의 룰렛","en":"Ultimate Roulette","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/ultimaterevolution_small.png","descKo":"도주를 무작위 궁극기로 교체합니다.\n\n궁극기 사용 후 새로운 무작위 궁극기로 교체합니다.","descEn":"Replace Flee with a random Ultimate.\n\nAfter casting the Ultimate, replace it with new random Ultimate."},{"id":"clown-college","ko":"광대 대학","en":"Clown College","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/clowncollege_small.png","descKo":"속임수 소환사 주문을 얻습니다.\n\n속임수: 근처로 순간이동해 투명 상태가 됩니다. 투명 상태에서 다음 기본 공격 시 물리 피해를 추가로 입힙니다.\n\n사망 시, 폭발하는 상자를 생성하여 엄청난 마법 피해를 입히고 주변 적을 공포에 빠뜨립니다.","descEn":"Gain Deceive Summoner Spell.\n\nDeceive: You teleport and become Invisible. Your next Attack while Invisible deals an additional physical damage.\n\nWhen you die, spawn an exploding box that deals a large amount of magic damage and Fear nearby enemies."},{"id":"numb-to-pain","ko":"무통각증","en":"Numb to Pain","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/numbtopain_small.png","descKo":"받는 피해의 25%를 6초에 걸쳐 받습니다. (원거리 챔피언의 경우 10%)","descEn":"25% of damage you take instead happens over 6 seconds (10% for ranged champions)."},{"id":"augmented-power","ko":"증강된 힘","en":"Augmented Power","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/augmented_power_small.png","descKo":"내 증강 및 아이템의 피해량이 증가합니다.","descEn":"Increase the damage done by your augments and items by ."},{"id":"mad-scientist","ko":"미친 과학자","en":"Mad Scientist","rarity":"prismatic","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/madscientist_small.png","descKo":"라운드마다 크기가 커져 적응형 능력치 및 체력이 증가하거나 크기가 작아져 스킬 가속 및 이동 속도가 증가합니다.","descEn":"Each Round you'll either grow large (Adaptive Force and Health) or tiny (Ability Haste and Move Speed)."},{"id":"mountain-soul","ko":"대지의 영혼","en":"Mountain Soul","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/mountainsoul_small.png","descKo":"전투에서 벗어나면 잠시 동안 보호막을 획득하는 대지의 영혼을 얻습니다.","descEn":"You gain the Mountain Soul, gaining a Shield after being out of combat for a short time."},{"id":"ultimate-revolution","ko":"궁극기 대변혁","en":"Ultimate Revolution","rarity":"prismatic","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/ultimaterevolution_small.png","descKo":"라운드마다 한 번 궁극기를 사용한 다음 초기화합니다.","descEn":"Once per round, refresh your Ultimate after casting it."},{"id":"trickster-demon","ko":"기만하는 악마","en":"Trickster Demon","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/tricksterdemon_small.png","descKo":"은신에서 벗어나면 폭발을 일으켜 의 마법 피해를 입힙니다. 분신과 함정도 사망 시 폭발합니다.","descEn":"When you exit stealth explode for Magic Damage, your clones and traps will do the same on death."},{"id":"dematerialize","ko":"해체분석","en":"Dematerialize","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/dematerialize_small.png","descKo":"각 라운드에서 챔피언당 한 번씩 처치 관여 시 %i:miniAdaptiveForce% 적응형 능력치가 10 증가합니다.\n\n4라운드 이후 이 증강을 획득하면, %i:miniAdaptiveForce% 적응형 능력치가 30 증가합니다.","descEn":"Gain %i:miniAdaptiveForce% 10 Adaptive Force on takedown, once per champion per round.\n\nGaining this augment after round 4, gain %i:miniAdaptiveForce% 30 Adaptive Force."},{"id":"slow-and-steady","ko":"천천히, 꾸준히","en":"Slow and Steady","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/slowandsteady_small.png","descKo":"공격 속도는 0.65보다 높아질 수 없습니다. 모든 추가 공격 속도가 공격력으로 전환됩니다.","descEn":"Your Attack Speed can not go above 0.65. All Bonus Attack Speed is converted to Attack Damage."},{"id":"frost-wraith","ko":"서리 망령","en":"Frost Wraith","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/frostwraith_small.png","descKo":"자동 사용 6.5초마다 주변 적을 1.25초 동안 속박합니다.","descEn":"Autocast Root nearby enemies for 1.25 seconds every 6.5 seconds."}, ismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/quest_woogletswitchcap_small.png","descKo":"즉시: 쓸데없이 큰 지팡이를 획득합니다.\n\n조건: 라바돈의 죽음모자와 존야의 모래시계를 보유해야 합니다.\n\n보상: 우글렛의 마녀 모자를 획득합니다.","descEn":"Immediate: Gain Needlessly Large Rod.\n\nRequirement: Possess Rabadon's Deathcap and Zhonya's Hourglass.\n\nReward: Gain Wooglet's Witchcap."},{"id":"earthwake","ko":"대지의 각성","en":"Earthwake","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/earthwake_small.png","descKo":"돌진, 점멸, 순간이동 스킬이 1초 후에 폭발하는 흔적을 남깁니다.","descEn":"Your dash, blink, or teleport Abilities leave behind a trail that detonates after 1 second."},{"id":"bread-and-butter","ko":"빵과 버터","en":"Bread And Butter","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/breadandbutter_small.png","descKo":"스킬 가속을 100 얻습니다.","descEn":"Your gains 100 Ability Haste."},{"id":"the-brutalizer","ko":"야수화","en":"The Brutalizer","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/thebrutalizer_small.png","descKo":"공격력이 20 , 스킬 가속이 10, 물리 관통력이 10 증가합니다.","descEn":"Gain 20 Attack Damage, 10 Ability Haste, and 10 Lethality."},{"id":"sonic-boom","ko":"음속 폭발","en":"Sonic Boom","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/sonicboom_small.png","descKo":"아군에게 이로운 효과, 회복, 보호막을 부여하면 아군 주변 적들에게 피해를 입히고 둔화시킵니다.","descEn":"Buffing, Healing, or Shielding your ally deals damage and Slows enemies surrounding them."},{"id":"twice-thrice","ko":"두 배 세 배","en":"Twice Thrice","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/twicethrice_small.png","descKo":"3번째 기본 공격을 가할 때마다 적중 시 효과가 한 번 더 발동합니다.","descEn":"Every 3 attacks, your On-Hit effects trigger a second time."},{"id":"symbiotic-mutation","ko":"공생 돌연변이","en":"Symbiotic Mutation","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/symbioticmutation_small.png","descKo":"라운드마다 아군의 증강 중 하나로 변이합니다.\n\n내가 뽑을 수 있는 증강으로만 변이합니다.","descEn":"Every round this mutates into one of your ally's augments.\n\nOnly mutates into augments you could roll."},{"id":"celestial-body","ko":"천상의 신체","en":"Celestial Body","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/celestialbody_small.png","descKo":"1000의 체력을 얻지만, 피해량이 10% 감소합니다.","descEn":"Gain 1000 Health, but you deal 10% less damage."},{"id":"bravestofthe-brave","ko":"용자 중의 용자","en":"Bravest of the Brave","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/bravestofthebrave_small.png","descKo":"다음 증강 제안이 1단계 상승합니다. 증강이 이미 프리즘 단계일 경우, 추가로 750골드를 획득합니다.","descEn":"Increase future augment offerings by 1 tier. If the augments were already Prismatic tier, gain a bonus 750 gold."},{"id":"bread-and-jam","ko":"빵과 잼","en":"Bread And Jam","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/breadandjam_small.png","descKo":"스킬 가속을 100 얻습니다.","descEn":"Your gains 100 Ability Haste."},{"id":"with-haste","ko":"속행","en":"With Haste","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/withhaste_small.png","descKo":"스킬 가속의 120%에 해당하는 이동 속도를 얻습니다.","descEn":"Gain Move Speed equal to 120% of your Ability Haste."},{"id":"fallen-aegis","ko":"부패한 방패","en":"Fallen Aegis","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/fallenaegis_small.png","descKo":"8초 동안 칠흑의 방패를 가지고 전투를 시작합니다.\n\n칠흑의 방패는 마법 피해를 흡수하고 이동 불가 효과를 방어합니다.","descEn":"Start combat with a Black Shield for 8s.\n\nBlack Shield blocks Magic Damage and Immobilizing effects."},{"id":"holy-fire","ko":"신성한 불길","en":"Holy Fire","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/holyfire_small.png","descKo":"체력을 회복하거나 보호막을 씌울 t each round imprisoned. While imprisoned, you have massive damage reduction and accumulate size, and power over time.\n\nWhen you escape, Knock Back enemies and gaining Shield."},{"id":"outlaws-grit","ko":"무법자의 투지","en":"Outlaw's Grit","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/outlawsgrit_small.png","descKo":"돌진, 점멸, 순간이동 스킬을 사용한 후 방어력 및 마법 저항력을 얻습니다.","descEn":"After using a Dash, Blink, or Teleport Ability you gain Armor and Magic Resist."},{"id":"dont-blink","ko":"속전속결","en":"Don't Blink","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/dontblink_small.png","descKo":"대상보다 이동 속도가 10 높을 때마다 추가 피해량이 1% 증가합니다.","descEn":"Gain 1% bonus damage per 10 Move Speed you have more than the target."},{"id":"shadow-runner","ko":"그림자 질주","en":"Shadow Runner","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/shadowrunner_small.png","descKo":"돌진, 도약, 점멸, 순간이동 스킬을 사용하거나 투명 상태에서 벗어난 후 2초 동안 이동 속도가 200 증가합니다.","descEn":"After using a dash, leap, blink, or teleport Ability or exiting Stealth, gain 200 Move Speed for 2 seconds."},{"id":"grievous-venom","ko":"고통스러운 맹독","en":"Grievous Venom","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/grevious_venmon_small.png","descKo":"적 챔피언에게 피해를 입히면 받는 보호막 효과를 감소시키고, 고통스러운 상처를 적용하며, 받는 체력 회복 효과도 감소시킵니다.","descEn":"Dealing damage to an enemy champion reduces any shields they gain, and applies Grievous Wounds, reducing any healing they receive."},{"id":"infernal-conduit","ko":"지옥의 전도체","en":"Infernal Conduit","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/infernalconduit_small.png","descKo":"스킬 사용 시 무한히 중첩되는 화상 효과를 적용해 지속적으로 마법 피해를 입힙니다.\n\n화상 효과가 기본 스킬의 재사용 대기시간을 감소시킵니다.","descEn":"Your Abilities apply an infinitely stacking Burn, dealing magic damage over time.\n\nYour Burn effects reduce your basic ts/ux/cherry/augments/icons/soulsiphon_small.png","descKo":"치명타로 입힌 피해량의 10%만큼 체력을 회복합니다.\n\n%i:scaleCrit% 치명타 확률이 25% 증가합니다.","descEn":"Heal for 10% of damage done by Critical Strikes.\n\nGain %i:scaleCrit% 25% Crit chance."},{"id":"gamba-anvil","ko":"감바 모루","en":"Gamba Anvil","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/thiefsgloves_small.png","descKo":"+%i:goldCoins%1000골드를 획득하고 모든 모루의 가격이 감소합니다.\n\n프리즘 모루: -%i:goldCoins%1500골드\n전설급 모루: -%i:goldCoins%750골드\n능력치 모루: -%i:goldCoins%250골드\n\n모루로 획득한 아이템을 되팔 때 받는 비용이 -%i:goldCoins%500골드 감소합니다.","descEn":"Gain +%i:goldCoins%1000 gold and reduce the price of all anvils.\n\nPrismatic Anvils: -%i:goldCoins%1500 gold\nLegendary Anvils: -%i:goldCoins%750 gold\nStat Anvils: -%i:goldCoins%250 gold\n\nItems acquired from anvils resell for -%i:goldCoins%500 gold less."},{"id":"divine-intervention","ko":"신성한 중재","en":"Divine Intervention","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/slowactingpainkillers_small.png","descKo":"전투 시작 직후, 보호의 별을 소환합니다. 별이 착지하면 자신과 주변 아군이 몇 초 동안 무적 상태가 됩니다.\n\n이후 25초마다 자동 사용합니다.","descEn":"Shortly after combat starts, call a protective star. Upon its landing, you and nearby allies become Invulnerable for a few seconds.\n\nThen Autocast this every 25 seconds."},{"id":"threadthe-needle","ko":"바늘에 실 끼우기","en":"Thread the Needle","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/threadtheneedle_small.png","descKo":"%i:scaleAPen% 방어구 관통력 및 %i:scaleMPen% 마법 관통력 15%를 얻습니다.","descEn":"Gain 15% %i:scaleAPen% Armor Penetration and %i:scaleMPen% Magic Penetration."},{"id":"bread-and-cheese","ko":"빵과 치즈","en":"Bread And Cheese","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/breadandcheese_small.png","descKo":"스킬 가속을 100 얻습니다.","descEn":"Your gains 100 Ability Haste."},{"id":"impassable","ko":"넘을 수 없는 벽","en":"Impassable","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/impassable_small.png","descKo":"여진과 빙결 강화 핵심 룬을 얻습니다.","descEn":"Gain the Aftershock and Glacial Augment Keystone Runes."},{"id":"pandoras-box","ko":"판도라의 상자","en":"Pandora's Box","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/pandoras_box_small.png","descKo":"모든 증강을 무작위 프리즘%i:Augment% 증강으로 전환합니다.","descEn":"Transmute all of your augments into random Prismatic%i:Augment% Augments."},{"id":"extendo-arm","ko":"늘어나는 팔","en":"Extendo-Arm","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/extendoarm_small.png","descKo":"자동 사용으로 12초마다 주변 적에게 블리츠크랭크 로켓 손을 발사합니다.","descEn":"Autocast fire a Blitzcrank hook every 12 seconds at a nearby enemy champion."},{"id":"slow-cooker","ko":"찜솥","en":"Slow Cooker","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/slowcooker_small.png","descKo":"매초 최대 체력에 비례해 주변 적에게 무한히 중첩되는 화상 효과를 적용합니다.","descEn":"Every second, apply an infinitely stacking Burn to nearby enemy champions, scaling with your max Health."},{"id":"die-another-day","ko":"불사의 날","en":"Die Another Day","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/dieanotherday_small.png","descKo":"불사의 날 소환사 주문을 얻습니다.\n\n불사의 날을 사용하면 4초 동안 어떤 유닛도 죽지 않는 영역을 생성합니다.","descEn":"Gain the Die Another Day Summoner Spell.\n\nDie Another Day creates a zone where no unit can die for 4 seconds."},{"id":"augment404","ko":"404: 증강을 찾을 수 없습니다","en":"404 Augment Not Found","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/augment404_small.png","descKo":"이걸 어떻게 찾아낸 건가요?!\n\n모자 3개를 획득합니다.","descEn":"How did you find this?!?!?\n\nGain 3 hats."},{"id":"dual-wield","ko":"양손잡이","en":"Dual Wield","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/dualwield_small.png","descKo":"기본 공격 시 40%의 피해를 입히고 적중 시 효과를 40%만큼 적용하는 투사체를 발사합니다.\n\n총 공격 속도가 15% 증가합니다.","descEn":"When you Attack, fire a bolt that deals 40% damage and applies your On-Hit effects at 40% effectiveness.\n\nGain 15% total Attack Speed."},{"id":"augment405","ko":"증강 405","en":"Augment 405","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/augment405_small.png","descKo":"착용 중인 모자 하나당 피해량이 5% 증가합니다.","descEn":"Gain 5% damage per hat you're wearing."},{"id":"spirit-link","ko":"정신 결속","en":"Spirit Link","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/spiritlink_small.png","descKo":"아군과 정신이 결속됩니다. 아군이 받는 피해의 40%를 대신 받고, 아군이 받는 회복의 40%를 함께 얻습니다.","descEn":"Link spirits with your ally. Redirect 40% of the damage they take to you, and gain 40% of the healing they receive."},{"id":"deathtouch","ko":"죽음의 손길","en":"Deathtouch","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/deathtouch_small.png","descKo":"적 챔피언에게 기본 공격을 가하면 영구히 저주받은 힘을 얻으며 저주받은 힘에 따라 마법 피해를 추가로 입힙니다.","descEn":"Attacking enemy champions grants permanent Cursed Power and deal additional magic damage based on your Cursed Power."},{"id":"quest-angelof-retribution","ko":"퀘스트: 응징의 천사","en":"Quest: Angel of Retribution","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/quest_angelofretribution_small.png","descKo":"조건: 2500만큼 아군의 체력을 회복시키거나 피해량을 막아야 합니다.\n\n보상: 100%의 공격 속도를 얻습니다. 또한 기본 공격 시 체력 회복과 보호막 효과의 350%에 해당하는 추가 마법 피해를 입힙니다.","descEn":"Requirement: Heal or prevent 2500 damage to allies.\n\nReward: Gain 100% Attack Speed, and your Attacks deal additional magic damage equal to 350% Heal/Shield Power."},{"id":"contract-killer","ko":"청부 살인마","en":"Contract Killer","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/contractkiller_small.png","descKo":"라운드마다 적 챔피언에게 표식을 남깁니다.\n\n이 챔피언에게 입히는 피해가 15% 증가하고, 처치 시 +%i:goldCoins%150골드를 얻습니다.","descEn":"Each round, mark an opposing champion.\n\nThat champion takes 15% extra damage and grants an +%i:goldCoins%150 gold when killed."},{"id":"goredrink","ko":"선혈포식","en":"Goredrink","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/goredrink_small.png","descKo":"모든 피해 흡혈 15%를 얻습니다.","descEn":"Gain 15% Omnivamp."},{"id":"despoil","ko":"침탈","en":"Despoil","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/desecrator_small.png","descKo":"주변에 적이 있을 때 돌진하거나 순간이동하면 저주받은 힘을 얻습니다. 저주받은 힘에 비례해 이동 속도가 증가합니다.","descEn":"Dashing or Teleporting grants you Cursed Power if there is an enemy nearby. Gain Move Speed scaling with your Cursed Power."},{"id":"well-be-right-back","ko":"금방 돌아올게","en":"We'll Be Right Back","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/wellberightback_small.png","descKo":"시간 정지 소환사 주문을 얻습니다.\n\n시간 정지: 주변 모든 챔피언이 경직 상태에 빠집니다. 자신에게 적용되는 경직 효과는 지속시간이 짧으며, 지속시간 동안 잃은 체력에 따라 체력을 회복합니다.","descEn":"Gain Time Stop Summoner Spell.\n\nTime Stop: ALL nearby champions are put in Stasis. The Stasis is shorter on you, and during it you Heal based on missing Health."},{"id":"quest-rite-of-the-forge-god","ko":"퀘스트: 대장장이 신의 의식","en":"Quest: Rite Of The Forge God","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/quest_rite_of_the_forge_god_small.png","descKo":"조건: 아이템 모루를 2개 구매해야 합니다.\n\n보상: 모든 아이템이 걸작 아이템으로 변하여 해당 아이템의 능력치가 40% 증가합니다.","descEn":"Requirement: Purchase 2 Item Anvils.\n\nReward: All of your items become Masterwork, increasing their stats by 40%."},{"id":"first-aid-kit","ko":"응급처치 키트","en":"First-Aid Kit","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/firstaidkit_small.png","descKo":"체력 회복 및 보호막 효과가 20% 증가합니다.","descEn":"Gain 20% Heal and Shield Power."},{"id":"ok-boomerang","ko":"부메랑 투척","en":"OK Boomerang","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/okboomerang_small.png","descKo":"자동 사용 7초마다 근처 적에게 부메랑을 던집니다.","descEn":"Autocast throw a boomerang at a nearby enemy every 7s."},{"id":"hybrid","ko":"하이브리드","en":"Hybrid","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/hybrid_small.png","descKo":"기본 공격으로 피해를 입히면 다음 스킬 피해량이 10% 증가합니다.\n\n스킬로 피해를 입히면 다음 기본 공격 피해량이 10% 증가합니다.","descEn":"When you deal damage with an Attack, your next Ability deals 10% increased damage.\n\nWhen you deal damage with an Ability, your next Attack deals 10% increased damage."},{"id":"hive-mind","ko":"군체 의식","en":"Hive Mind","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/hive_mind_small.png","descKo":"매 라운드를 벌 0마리와 함께 시작합니다. 꽃을 수확하면 추가로 벌을 얻습니다. 적 챔피언에게 피해를 입히면 벌을 보냅니다. 벌은 대상에 다다르면 2초 동안 의 마법 피해를 입히고 다시 돌아옵니다.","descEn":"Start each round with 0 Bee, gain additonal Bees by harvesting flowers. Damaging an enemy champion sends a Bee dealing magic damage over 2 seconds on arrival, before returning to you."},{"id":"quest-three-sacred-treasures","ko":"퀘스트: 삼종신기","en":"Quest: Three Sacred Treasures","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/threesacredtreasures_small.png","descKo":"조건: 무한의 대검, 당혹, 마법공학 총검을 보유해야 합니다.\n\n보상: 유나라의 기본 공격이 혼합 피해를 입히는 빛줄기로 대체됩니다.","descEn":"Requirement: Possess Infinity Edge, Perplexity, and Hextech Gunblade.\n\nReward: Yunara's Attacks are replaced with lasers that deal mixed damage."},{"id":"juice-box","ko":"주스 팩","en":"Juice Box","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/juicebox_small.png","descKo":"라운드마다 모든 아군이 1개의 주스를 얻습니다.","descEn":"Each round, everyone on your team gains 1 Juice."},{"id":"scopiest-weapons","ko":"최상급 조준경 부착","en":"Scopiest Weapons","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/scopiestweapons_small.png","descKo":"공격 사거리가 증가합니다.","descEn":"Gain Attack Range."},{"id":"slime-time","ko":"점액 천지","en":"Slime Time","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/slimetime_small.png","descKo":"몇 초마다 자동 사용으로 몸에서 점액을 터뜨려 주변 적에게 마법 피해를 입힙니다.\n\n챔피언에게 적중 시, 밟으면 체력이 회복되는 방울을 분비합니다.","descEn":"Every few seconds Autocast a burst slime from your body, dealing magic damage to nearby enemies.\n\nIf you hit a champion, secrete a blob that heals you when walked over."},{"id":"dreadbringer","ko":"공포를 부르는 자","en":"Dreadbringer","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/plaguebearer_small.png","descKo":"오라를 획득해 안에 있는 적 챔피언 하나당 영구적인 저주받은 힘을 지속적으로 얻습니다. 저주받은 힘에 따라 최대 체력을 얻습니다.","descEn":"Gain an aura that continuously harvests permanent Cursed Power per enemy champion inside. Gain max Health based on your Cursed Power."},{"id":"stackosaurus-rex","ko":"다단 중첩","en":"Stackosaurus Rex","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/stackosaurusrex_small.png","descKo":"스킬, 증강 또는 아이템 중첩을 영구적으로 획득할 때마다 75% 더 획득합니다!","descEn":"When you gain permanent Stacks of an Ability, Augment, or Item gain 75% more!"},{"id":"esc-apade","ko":"마법사 (물리)","en":"escAPADe","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/escapade_small.png","descKo":"주문력을 추가 공격력으로 전환합니다. 공격력이 15% 증가합니다.","descEn":"Convert Ability Power to Bonus Attack Damage. Gain 15% Attack Damage."},{"id":"fey-magic","ko":"요정 마법","en":"Fey Magic","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/feymagic_small.png","descKo":"궁극기로 적에게 피해를 입히면 몇 초 동안 변이시킵니다.","descEn":"Damaging with your Ultimate Polymorphs enemies for a few seconds."},{"id":"firebrand","ko":"화 "When you Attack, fire 5 bolts that each deal physical damage and applies your On-Hit."},{"id":"tormentor","ko":"고문자","en":"Tormentor","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/tormentor_small.png","descKo":"적 챔피언을 이동 불가 상태로 만들거나 이동 스킬을 사용할 수 없게 하면 무한히 중첩되는 화상 효과를 적용해 지속적으로 피해를 입힙니다.","descEn":"Immobilizing or Grounding enemy champions applies a Burn that deals damage over time, stacking infinitely."},{"id":"minionmancer","ko":"소환술사","en":"Minionmancer","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/minionmancer_small.png","descKo":"소환물의 크기, 체력, 피해량이 35% 증가합니다.","descEn":"Your summons gain 35% increased size, health, and damage."},{"id":"tank-engine","ko":"탱크 엔진","en":"Tank Engine","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/tank_engine_small.png","descKo":"처치 관여마다 크기가 커지고 일정 비율의 추가 체력을 얻습니다.","descEn":"Gain increased size and percent bonus Health per takedown."},{"id":"ethereal-weapon","ko":"환영 무기","en":"Ethereal Weapon","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/etherealweapon_small.png","descKo":"스킬 사용 시 적중 시 효과를 적용합니다.","descEn":"Your Abilities apply On-Hit effects."},{"id":"omni-soul","ko":"전능의 영혼","en":"Omni Soul","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/omnisoul_small.png","descKo":"무작위 드래곤 영혼 2개를 획득합니다.","descEn":"Gain 2 random Dragon Souls."},{"id":"dawnbringers-resolve","ko":"빛의 인도자 결의","en":"Dawnbringer's Resolve","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/dawnbringersresolve_small.png","descKo":"체력이 60% 아래로 떨어지면 3초 동안 만큼 체력을 회복합니다.","descEn":"Upon dropping below 60% Health, heal for over 3 seconds."},{"id":"silver-spoon","ko":"은수저","en":"Silver Spoon","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/silver_spoon_small.png","descKo":"보유한 %i:Augment% 실버 증강 하나당 입히는 피해가 증가합니다.","descEn":"Deal increased damage per %i:Augment% Silver Augment you have."},{"id":"hold-very-still","ko":"미동 없이","en":"Hold Very Still","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/holdverystill_small.png","descKo":"유격 전투 효과를 얻습니다.\n\n가만히 있으면 다시 이동할 때까지 투명 상태가 됩니다. 투명 상태에서 벗어나면 다음 기본 공격 시 추가 마법 피해를 입힙니다.","descEn":"Gain Guerrilla Warfare.\n\nNot moving causes you to turn Invisibile until you move. Exiting this Invisibility, causes your next attack to deal bonus magic damage."},{"id":"from-beginning-to-end","ko":"시작부터 끝까지","en":"From Beginning to End","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/frombeginningtoend_small.png","descKo":"선제공격과 어둠의 수확 핵심 룬을 얻습니다.","descEn":"Gain the First Strike and Dark Harvest Keystone Runes."},{"id":"panic-room","ko":"대피소","en":"Panic Room","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/panic_room_small.png","descKo":"전투당 1회 사망할 때, 대신 영혼 상태가 되고 체력이 20%가 되며 아레나의 무작위 지점으로 이동합니다.","descEn":"Once per combat, when you would die, instead turn into a wisp, set yourself to 20% Health, and travel to a random spot in the arena."},{"id":"parasitic-mutation","ko":"기생 돌연변이","en":"Parasitic Mutation","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/parasiticmutation_small.png","descKo":"라운드마다 상대의 증강 중 하나로 변이합니다.\n\n내가 뽑을 수 있는 증강으로만 변이합니다.","descEn":"Every round this mutates into one of your opponent's augments.\n\nOnly mutates into augments you could roll."},{"id":"cant-touch-this","ko":"난공불락","en":"Can't Touch This","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/canttouchthis_small.png","descKo":"궁극기를 사용하면 잠시 동안 무적 상태가 됩니다.","descEn":"Casting your Ultimate makes you Invulnerable for a short duration."},{"id":"its-critical","ko":"치명적인 공격","en":"It's Critical","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/itscritical_small.png","descKo":"%i:scaleCrit% 치명타 확률이 50% 증가합니다.","descEn":"Gain %i:scaleCrit% 50% Crit chance."},{"id":"blood-brother","ko":"피를 나눈 형제","en":"Blood Brother","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/bloodbrother_small.png","descKo":"다리우스의 기본 지속 효과 과다출혈을 얻습니다.\n\n기본 공격과 공격 스킬이 대상에게 과다출혈을 일으켜 5초에 걸쳐 의 물리 피해를 입힙니다. 이 효과는 최대 5번 중첩됩니다.\n\n대상에게 과다출혈이 5회 중첩되면 드레이븐의 공격력이 증가합니다.","descEn":"Gain Darius's Passive Hemorrhage.\n\nAttacks and damaging Abilities cause the target to Hemorrhage, dealing physical damage over 5 seconds, stacking up to 5 times.\n\nDraven gains Attack Damage at 5 Hemorrhage stacks."},{"id":"ultimate-unstoppable","ko":"궁극의 저지 불가","en":"Ultimate Unstoppable","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/ultimateunstoppable_small.png","descKo":"궁극기 사용 시 2초 동안 군중 제어 효과에 면역이 됩니다. (재사용 대기시간 8초)","descEn":"After using your Ultimate, you become immune to crowd control for 2 seconds. (8 second Cooldown)."},{"id":"recursion","ko":"되풀이","en":"Recursion","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/recursion_small.png","descKo":"스킬 가속이 40 증가합니다.","descEn":"Gain 40 Ability Haste."},{"id":"stats-on-stats-on-stats","ko":"능력치 더하기 능력치 더하기 능력치!","en":"Stats on Stats on Stats!","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/statsonstatsonstats_small.png","descKo":"%i:StatAnvil% 능력치 모루를 4개 획득합니다.","descEn":"Gain 4 %i:StatAnvil% Stat Anvils!"},{"id":"deft","ko":"능수능란","en":"Deft","rarity":"silver","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/deft_small.png","descKo":"%i:scaleAS% 60%의 공격 속도를 얻습니다.","descEn":"Gain %i:scaleAS% 60% Attack Speed."},{"id":"goliath","ko":"거인","en":"Goliath","rarit e over 3 seconds."},{"id":"energetic","ko":"에너지 충만","en":"Energetic","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/energetic_small.png","descKo":"200% 더 빠르게 충전 상태가 됩니다. 충전 상태가 발동되면 마법 미사일을 발사해 이동한 거리에 따라 최대 최대 체력의 0.3%에 해당하는 고정 피해를 입힙니다.","descEn":"Gain Energized 200% quicker. Triggering Energized fires a Magic Missile, dealing up to 0.3% max Health true damage based on distance traveled."},{"id":"mystic-punch","ko":"신비한 주먹","en":"Mystic Punch","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/mysticpunch_small.png","descKo":"적중 시 스킬의 재사용 대기시간이 1.25초 %i:scaleCooldown% 감소합니다.","descEn":"On-Hit reduce the cooldown of your abilities by 1.25 seconds %i:scaleCooldown%."},{"id":"homeguard","ko":"민병대","en":"Homeguard","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/homeguard_small.png","descKo":"이동 속도가 70% 증가합니다. 피해를 입은 후 3초 동안은 효과가 멈춥니다.","descEn":"Gain 70% Move Speed, disabled for 3 seconds after taking damage."},{"id":"null-augment","ko":"증강 없음","en":"Null Augment","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/canttouchthis_small.png","descKo":"없음","descEn":"Null"},{"id":"hat-trick","ko":"해트트릭","en":"Hat Trick","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/hattrick_small.png","descKo":"즉시 모자 3개를 얻으며, 카파 주스의 가격이 350 감소합니다.\n\n체력이 30% 아래로 떨어지면 이동 속도와 보호막을 얻지만, 모자를 하나 잃습니다.","descEn":"Instantly gain 3 hats, and reduce the price of Cappa Juice by 350.\n\nWhen your health drops below 30% gain Move Speed and a shield, but lose one hat."},{"id":"heavy-hitter","ko":"강타자","en":"Heavy Hitter","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/heavyhitter_small.png","descKo":"기본 공격 시 최대 체력의 3.5%에 해당하는 추가 물리 피해를 입힙니다.","descEn":"Your Attacks deal additional physical damage equal to 3.5% of y ities."},{"id":"mirror-image","ko":"거울 환영","en":"Mirror Image","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/mirrorimage_small.png","descKo":"체력이 30% 아래로 떨어지면 잠시 투명 상태가 되고 자신의 분신 4명을 생성합니다.","descEn":"When you drop below 30% Health, briefly become Invisible and create 4 clones of yourself."},{"id":"magical-girl","ko":"마법 소녀","en":"Magical Girl","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/magic_girl_small.png","descKo":"라운드마다 떨어지는 별을 획득하면 강력한 마법 소녀로 변신합니다.\n\n마법 소녀가 되면, 자신과 적 주위에 별이 쏟아져 내려 마법 피해를 입힙니다.","descEn":"Each round a star falls, picking it up transforms you into a powerful Magical Girl.\n\nAs a Magical Girl, stars rain down around you and your enemies, dealing magic damage."},{"id":"desecrator","ko":"신성 모독자","en":"Desecrator","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/desecrator_small.png","descKo":"적 챔피언을 이동 불가 상태로 만들면 영구히 저주받은 힘을 얻습니다. 저주받은 힘에 따라 방어력과 마법 저항력을 얻습니다.","descEn":"Immobilizing enemy champions grants you permanent Cursed Power. Gain Armor and Magic Resistance based on your Cursed Power."},{"id":"all-for-you","ko":"너만을 위해","en":"All For You","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/allforyou_small.png","descKo":"아군에게 사용하는 체력 회복 및 보호막 효과가 증가합니다.","descEn":"Your Heals and Shields are stronger when used on an ally."},{"id":"keystone-conjurer","ko":"핵심 룬 요술사","en":"Keystone Conjurer","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/keystoneconjurer_small.png","descKo":"콩콩이 소환과 신비로운 유성 핵심 룬을 얻습니다.","descEn":"Gain the Summon Aery and Arcane Comet Keystone Runes."},{"id":"laser-eyes","ko":"눈알 광선","en":"Laser Eyes","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/lasereyes_small.png","descKo":"시야 방향으로 마법 피해를 지속적으로 입히는 광선을 발사합니다.","descEn":"There is ","descEn":"On dropping below 60% or 30% Health, nearby enemies are Knocked Back."},{"id":"skilled-sniper","ko":"노련한 저격수","en":"Skilled Sniper","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/skilledsniper_small.png","descKo":"멀리 떨어진 적에게 궁극기 이외의 스킬을 적중시키면 해당 스킬의 재사용 대기시간이 대폭 감소합니다.","descEn":"Hitting an enemy with a non-Ultimate Ability at far range drastically reduces its Cooldown."},{"id":"parasitic-relationship","ko":"기생 관계","en":"Parasitic Relationship","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/parasiticrelationship_small.png","descKo":"아군이 입힌 피해의 15%만큼 체력을 회복합니다.","descEn":"Heal for 15% of the damage dealt by your ally."},{"id":"restart","ko":"재시작","en":"Restart","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/restart_small.png","descKo":"기본 스킬이 12초마다 자동으로 초기화됩니다.","descEn":"Your non-Ultimate Abilities Automatically refresh every 12 seconds."},{"id":"draw-your-sword","ko":"검을 뽑아라","en":"Draw Your Sword","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/drawyoursword_small.png","descKo":"이제 근접 챔피언으로 간주됩니다.\n\n잃은 공격 사거리에 비례해 공격력, 체력, 공격 속도, 생명력 흡수 효과, 이동 속도를 얻습니다.","descEn":"You are now melee.\n\nGain Attack Damage, Health, Attack Speed, Lifesteal, and Move Speed based on how much Attack Range you lost."},{"id":"restless-restoration","ko":"끊임없는 회복","en":"Restless Restoration","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/restlessrestoration_small.png","descKo":"이동 시 지속적으로 체력을 회복합니다.","descEn":"You constantly heal while moving."},{"id":"dive-bomber","ko":"폭격기","en":"Dive Bomber","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/divebomber_small.png","descKo":"라운드마다 처음으로 사망하는 아군이 폭발해 막대한 고정 피해를 입힙니다.","descEn":"Your team's first death each round explodes, dealing massive damage atic","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/summonersroulette_small.png","descKo":"소환사 주문을 무작위 주문으로 교체합니다.\n\n소환사 주문 사용 시 6초의 재사용 대기시간이 적용된 무작위 주문으로 교체합니다.","descEn":"Replace your Summoner Spells with random ones.\n\nWhen you use a Summoner Spell, replace it with another random one on a 6 second Cooldown."},{"id":"go-hsacrifice-for-silver","ko":"희생: 실버","en":"Sacrifice: For Silver","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/gohsacrificefor_small.png","descKo":"2라운드 후 추가 실버 증강을 얻습니다.","descEn":"After 2 rounds, gain a bonus Silver Augment."},{"id":"shrink-ray","ko":"감쇠 광선","en":"Shrink Ray","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/shrinkray_small.png","descKo":"기본 공격 시 대상의 입히는 피해량과 크기를 10% 감소시킵니다. (적중 시)","descEn":"Your Attacks reduce the target's damage and size by 10% On-Hit."},{"id":"castle","ko":"위치 변경","en":"Castle","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/castle_small.png","descKo":"위치 변경 소환사 주문을 얻습니다.\n\n위치 변경: 아군과 위치를 바꾸고 이동 속도 및 보호막을 얻습니다.","descEn":"Gain the Castle Summoner Spell.\n\nCastle: Swap places with your ally, gaining Move Speed and a Shield."},{"id":"quest-steel-your-heart","ko":"퀘스트: 강철 같은 심장","en":"Quest: Steel Your Heart","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/quest_steelyourheart_small.png","descKo":"조건: 효과가 400중첩 이상 적용된 강철심장을 보유해야 합니다.\n\n보상: 강철심장 중첩이 3배가 됩니다. 체력 재생이 강철심장 중첩의 12.5%만큼 증가합니다.","descEn":"Requirement: Possess Heartsteel with 400+ stacks.\n\nReward: Multiply your Heartsteel stacks by 3. Increase your Health Regeneration by 12.5% of your Heartsteel stacks."},{"id":"executioner","ko":"처형자","en":"Executioner","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/executioner_small.png","descKo":"체력이 40% 아래로 떨어진 적에게 입히는 피해량이 10% 증가합니다. 처치 관여 시 기본 스킬이 초기화됩니다.","descEn":"Deal 10% more damage to enemies below 40% health. Reset your basic abilities on takedown."},{"id":"courageofthe-colossus","ko":"거석상의 용기","en":"Courage of the Colossus","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/courageofthecolossus_small.png","descKo":"적 챔피언을 이동 불가 상태로 만들거나 이동 스킬을 사용할 수 없게 하면 의 보호막을 얻습니다.","descEn":"Gain Shield after Immobilizing or Grounding an enemy champion."},{"id":"fruits-of-your-labor","ko":"노력의 결실","en":"Fruits of Your Labor","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/fruitarian_small.png","descKo":"힘의 꽃 효과가 20% 증가하고 아군과 효과를 공유합니다.","descEn":"Power Flowers are 20% more effective on you and are shared with your ally."},{"id":"infernal-soul","ko":"지옥불 영혼","en":"Infernal Soul","rarity":"silver","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/infernalsoul_small.png","descKo":"스킬 또는 기본 공격으로 적을 공격할 때마다 추가 피해를 입히는 화염의 드래곤 영혼을 얻습니다.","descEn":"You gain the Infernal Dragon Soul, dealing bonus damage when you hit enemies with Abilities or Attacks."},{"id":"combo-master","ko":"연계의 대가","en":"Combo Master","rarity":"gold","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/combomaster_small.png","descKo":"감전과 난입 핵심 룬을 얻습니다.","descEn":"Gain the Electrocute and Phase Rush Keystone Runes."},{"id":"dark-blessing","ko":"어둠의 축복","en":"Dark Blessing","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/darkblessing_small.png","descKo":"아군의 체력을 회복시키거나 보호막을 씌우면 영구히 저주받은 힘을 얻습니다. 저주받은 힘에 따라 스킬 가속을 얻습니다.","descEn":"Healing or Shielding an ally grants you permanent Cursed Power. Gain Ability Haste based on your Cursed Power."},{"id":"mindto-matter","ko":"정신 변환","en":"Mind to Matter","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/mindtomatter_small.png","descKo":"최대 체력이 마나의 절반만큼 증가합니다.","descEn":"Increase max Health by half of your Mana."},{"id":"its-killing-time","ko":"처형 시간","en":"It's Killing Time","rarity":"gold","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/itskillingtime_small.png","descKo":"궁극기 사용 후 모든 적 챔피언에게 죽음의 표식을 남깁니다.\n\n표식이 있는 동안 적에게 입힌 피해를 비축합니다. 표식의 효과가 끝날 때 폭발해 비축된 피해를 입힙니다.","descEn":"After casting your Ultimate, mark all enemy champions for death.\n\nWhile marked, store damage dealt to them, and detonate the damage when the mark ends."},{"id":"wisdomof-ages","ko":"세월의 지혜","en":"Wisdom of Ages","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/wisdomofages_small.png","descKo":"지금 1레벨이 증가하고 두 라운드마다 추가로 1레벨이 증가합니다.\n\n레벨 제한이 사라집니다.\n\n4라운드 이후 이 증강을 선택할 경우, 2레벨이 추가로 증가합니다.","descEn":"Gain 1 level now, and 1 bonus level every other round.\n\nYour level cap is removed.\n\nIf taken after round 4, gain 2 additional levels."},{"id":"go-hsacrifice-for-prismatic","ko":"희생: 프리즘","en":"Sacrifice: For Prismatic","rarity":"prismatic","maxLevel":1,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/gohsacrificefor_small.png","descKo":"현재 체력의 50%를 희생합니다.\n\n7라운드 후 추가 프리즘 증강을 얻고 체력을 회복합니다.","descEn":"Sacrifice 50% of your current health.\n\nAfter 7 rounds, gain a bonus Prismatic Augment and restore your health."},{"id":"now-you-see-me","ko":"불의의 습격","en":"Now You See Me","rarity":"silver","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/nowyouseeme_small.png","descKo":"불의의 습격 소환사 주문을 얻습니다.\n\n불의의 습격을 사용하면 마지막 이동 스킬의 시작 지점으로 순간이동합니다.","descEn":"Gain the Now You See Me Summoner Spell.\n\nNow You See Me teleports you back to the starting position of your last Movement Ability."},{"id":"perseverance","ko":"인내심","en":"Perseverance","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/perseverance_small.png","descKo":"체력 재생 효과가 크게 증가하고 체력이 낮으면 추가로 증가합니다.","descEn":"Gain hugely increased Health Regen, further increased at low Health."},{"id":"jeweled-gauntlet","ko":"보석 건틀릿","en":"Jeweled Gauntlet","rarity":"prismatic","maxLevel":3,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/jeweledgauntlet_small.png","descKo":"스킬에 치명타가 적용될 수 있습니다.\n\n%i:scaleCrit% 치명타 확률이 % 증가합니다.","descEn":"Your Abilities can Critically Strike.\n\nGain %i:scaleCrit% % Crit Chance."},{"id":"and-my-axe","ko":"도끼 받아라!","en":"And My Axe!","rarity":"gold","maxLevel":2,"iconPath":"/lol-game-data/assets/assets/ux/cherry/augments/icons/andmyaxe_small.png","descKo":"자동 사용:\n주기적으로 가장 가까운 적에게 도끼를 던져 물리 피해를 입히고, 둔화를 적용하며, 방어력과 마법 저항력을 감소시킵니다. 도끼를 회수하면 재사용 대기시간이 감소합니다.","descEn":"Autocast:\nPeriodically throws an axe at the nearest opponent, dealing physical damage, slowing, and shredding their armor and magic resist. Picking up the axe reduces its Cooldown."}];

const CDRAGON = 'https://raw.communitydragon.org/latest';
// 앱의 augmentImageUrl(iconPath,'large')
function augUrl(p) {
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/game' + s.replace(/_small(\.\w+)$/i, '_large$1');
}
function augUrlSmall(p) {
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/plugins/rcp-be-lol-game-data/global/default' + s;
}
// 앱의 cdragonItemIconUrl(iconPath)
function itemUrl(p) {
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/plugins/rcp-be-lol-game-data/global/default' + s;
}
const RNAME = { silver: '실버', gold: '골드', prismatic: '프리즘' };
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let view = 'all', query = '';

function matchQ(a) {
  if (!query) return true;
  const q = query.toLowerCase();
  return ((a.ko || '') + ' ' + (a.en || '') + ' ' + (a.id || '') + ' ' + (a.descKo || '')).toLowerCase().includes(q);
}

function augCard(a, isItem) {
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.className = 'icon';
  img.loading = 'lazy';
  img.src = isItem ? itemUrl(a.iconPath) : augUrl(a.iconPath);
  img.alt = a.ko;
  img.onerror = () => {
    if (!isItem && !img.dataset.fb) { img.dataset.fb = '1'; img.src = augUrlSmall(a.iconPath); return; }
    img.replaceWith(Object.assign(document.createElement('div'),
      { className: 'icon err', textContent: 'no img' }));
  };
  const meta = document.createElement('div');
  meta.className = 'meta';
  let badge = '';
  if (a.rarity) {
    badge = '<span class="rb ' + a.rarity + '">' + RNAME[a.rarity] + '</span>';
    badge += a.maxLevel > 1
      ? '<span class="lvl">' + '★'.repeat(a.maxLevel) + ' 최대 ' + a.maxLevel + '레벨</span>'
      : '<span class="lvl nolvl">레벨업 불가</span>';
  } else if (a.price != null) {
    badge = '<span class="price">' + a.price + 'G</span>';
  }
  meta.innerHTML = '<div class="ko">' + esc(a.ko) + '</div>' +
    '<div class="en">' + esc(a.en || '') + '</div>' +
    '<div class="badges">' + badge + '</div>' +
    '<div class="desc">' + esc(a.descKo) + '</div>' +
    '<div class="iconpath">' + esc(a.iconPath.replace(/.*\//, '')) + '</div>';
  card.appendChild(img);
  card.appendChild(meta);
  return card;
}

function section(title, list, isItem) {
  const h = document.createElement('div');
  h.className = 'group-title';
  h.textContent = title + ' · ' + list.length + '개';
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const a of list) grid.appendChild(augCard(a, isItem));
  return [h, grid];
}

function render() {
  const out = document.getElementById('out');
  out.innerHTML = '';
  const order = { silver: 0, gold: 1, prismatic: 2 };
  const showAug = view === 'all' || ['silver', 'gold', 'prismatic'].includes(view);
  const showItems = view === 'all' || view === 'items';
  const showSpecial = view === 'all' || view === 'special';
  let any = false;

  if (showAug) {
    const groups = {};
    for (const a of AUG.filter(matchQ)) {
      if (['silver', 'gold', 'prismatic'].includes(view) && a.rarity !== view) continue;
      (groups[a.rarity] ??= []).push(a);
    }
    for (const k of Object.keys(groups).sort((x, y) => order[x] - order[y])) {
      const list = groups[k].sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
      section(RNAME[k] + ' 증강', list, false).forEach((n) => out.appendChild(n));
      any = true;
    }
  }
  if (showItems) {
    const list = PRISM.filter(matchQ).sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
    if (list.length) { section('프리즘 아이템', list, true).forEach((n) => out.appendChild(n)); any = true; }
  }
  if (showSpecial) {
    const list = SPECIAL.filter(matchQ).sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
    if (list.length) { section('특수 증강 (재련·시즌 변형)', list, false).forEach((n) => out.appendChild(n)); any = true; }
  }
  if (!any) out.innerHTML = '<div class="empty">결과 없음</div>';
}

document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
document.querySelectorAll('.chip[data-v]').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-v]').forEach((x) => x.classList.remove('active'));
  c.classList.add('active'); view = c.dataset.v; render();
}));
render();
</script>
</body>
</html>
