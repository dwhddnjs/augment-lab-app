<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>증강 검수 — 222개</title>
<style>
  :root {
    --bg: #0d1311; --surface: #131b18; --raised: #1a2420; --border: #25322d;
    --text: #e8f0ec; --text2: #9bb0a8; --text3: #6c7f78;
    --mint: #1ED7A0; --silver: #b9c4cc; --gold: #e8c45f; --prism: #c98bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,19,17,.92);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .stats { color: var(--text2); font-size: 13px; }
  .stats b { color: var(--text); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  input[type=search] { background: var(--raised); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 8px 12px; font-size: 14px; min-width: 220px; outline: none; }
  input[type=search]:focus { border-color: var(--mint); }
  .chip { background: var(--raised); border: 1px solid var(--border); color: var(--text2);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; }
  .chip.active { background: var(--mint); color: #06231b; border-color: var(--mint); font-weight: 600; }
  .chip.toggle.active { background: #4a2f2f; color: #ffd9d9; border-color: #7a4a4a; }
  main { padding: 20px 24px 60px; }
  .group-title { margin: 24px 0 12px; font-size: 15px; color: var(--text2); display: flex; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .card.shared { border-color: #6a4a2a; }
  .icon { width: 56px; height: 56px; border-radius: 9px; flex: 0 0 56px; background: var(--raised);
    object-fit: contain; }
  .icon.err { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text3); }
  .meta { min-width: 0; flex: 1; }
  .ko { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 13px; color: var(--text); line-height: 1.45; margin-top: 8px; white-space: pre-wrap; }
  .descEn { font-size: 12px; color: var(--text2); line-height: 1.4; margin-top: 5px; white-space: pre-wrap; }
  .badges { display: flex; gap: 6px; margin-top: 8px; }
  .rb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
  .rb.silver { background: rgba(185,196,204,.15); color: var(--silver); }
  .rb.gold { background: rgba(232,196,95,.15); color: var(--gold); }
  .rb.prismatic { background: rgba(201,139,255,.15); color: var(--prism); }
  .sb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(232,150,80,.15); color: #e89650; }
  .empty { color: var(--text3); padding: 40px; text-align: center; }
  .iconpath { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>증강 데이터·아이콘 검수</h1>
  <div class="stats">
    총 <b>222</b>개 ·
    <span style="color:var(--silver)">실버 62</span> ·
    <span style="color:var(--gold)">골드 82</span> ·
    <span style="color:var(--prism)">프리즘 78</span> ·
    아이콘 공유 <b style="color:#e89650">42</b>개
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="한글·영문 이름 검색…" autocomplete="off" />
    <span class="chip active" data-r="all">전체</span>
    <span class="chip" data-r="silver">실버</span>
    <span class="chip" data-r="gold">골드</span>
    <span class="chip" data-r="prismatic">프리즘</span>
    <span class="chip toggle" id="sharedOnly">공유 아이콘만</span>
  </div>
</header>
<main id="out"></main>

<script>
const DATA = [{"id":"adapt","ko":"적응형 능력치","en":"ADAPt","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/ADAPt_small.png","descKo":"추가 공격력을 주문력으로 전환합니다. 주문력이 15% 증가합니다.","descEn":"Convert Bonus Attack Damage to Ability Power. Gain 15% Ability Power.","shared":false},{"id":"adamant","ko":"단호함","en":"Adamant","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Adamant_small.png","descKo":"적을 이동 불가 상태로 만들거나 이동 스킬을 봉인하면 10초 동안 방어력과 마법 저항력을 10 얻습니다. 최대 10회(총 100)까지 중첩되며 다시 발동 시 지속시간이 갱신됩니다. (시전당 재사용 대기시간 5초)","descEn":"Immobilizing or grounding an enemy champion grants 10 bonus armor and bonus magic resistance for 10 seconds, stacking up to 10 times for a total of 100 bonus resistances, and refreshing on subsequent triggers (5 second cooldown per cast instance).\n\nThis augment is currently disabled.","shared":true},{"id":"blunt-force","ko":"육중한 힘","en":"Blunt Force","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/BluntForce_small.png","descKo":"공격력이 10% 증가합니다.","descEn":"Gain 10% Attack Damage.","shared":false},{"id":"deft","ko":"능수능란","en":"Deft","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Deft_small.png","descKo":"60%의 공격 속도를 얻습니다.","descEn":"Gain 60% Attack Speed.","shared":false},{"id":"dive-bomber","ko":"폭격기","en":"Dive Bomber","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/DiveBomber_small.png","descKo":"라운드마다 처음으로 사망하는 아군이 폭발해 막대한 고정 피해를 입힙니다.","descEn":"Your team's first death each round explodes, dealing massive damage true damage.","shared":false},{"id":"don-t-blink","ko":"속전속결","en":"Don't Blink","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/DontBlink_small.png","descKo":"대상보다 이동 속도가 10 높을 때마다 추가 피해량이 1% 증가합니다.","descEn":"Gain 1% bonus damage per 10 Move Speed you have more than the target.","shared":false},{"id":"erosion","ko":"부식","en":"Erosion","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Erosion_small.png","descKo":"적에게 피해를 입히면 4초 동안 방어력 및 마법 저항력 감소 중첩을 얻습니다.","descEn":"Damaging enemies adds a stacking Armor and Magic Resist shred for 4s.","shared":false},{"id":"escape-plan","ko":"도주 계획","en":"Escape Plan","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/EscapePlan_small.png","descKo":"체력이 최대 체력의 35% 미만이 되면 최대 체력의 65%에 해당하는 보호막과 150% 이동 속도를 얻고 크기가 작아집니다. 이 효과는 5.5초에 걸쳐 사라집니다. (재사용 대기시간 75초)","descEn":"Upon dropping below 35% of your maximum health, gain a shield for 65% of your maximum health, 150% bonus movement speed, and reduced size (75 second cooldown). These effects all decay over 5.5 seconds.","shared":false},{"id":"first-aid-kit","ko":"응급처치 키트","en":"First-Aid Kit","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/FirstAidKit_small.png","descKo":"체력 회복 및 보호막 효과가 20% 증가합니다.","descEn":"Gain 20% Heal and Shield Power.","shared":false},{"id":"flashbang","ko":"점멸탄","en":"Flashbang","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Flashbang_small.png","descKo":"점멸 사용 시 도착 지점에 폭발을 일으켜 주변 적에게 70~240(+ 공격력의 70%)(+ 주문력의 60%)의 마법 피해를 입히고 1.25초 동안 35% 둔화시킵니다. 또한 사망 시 점멸이 초기화됩니다.","descEn":"Using Flash creates an explosion around the blink location that deals 70 to 240 (+ 70% AD) (+ 60% AP) magic damage to nearby enemies and slows them by 35% for 1.25 seconds. Additionally, the cooldown of your Flash resets upon your death.\n\nIf Flash is not equipped, you will be prompted to replace one of your summoner spells with Flash.","shared":false},{"id":"goredrink","ko":"선혈포식","en":"Goredrink","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/GoreDrink_small.png","descKo":"모든 피해 흡혈 15%를 얻습니다.","descEn":"Gain 15% Omnivamp.","shared":false},{"id":"heavy-hitter","ko":"강타자","en":"Heavy Hitter","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/HeavyHitter_small.png","descKo":"기본 공격 시 최대 체력의 3.5%에 해당하는 추가 물리 피해를 입힙니다.","descEn":"Your Attacks deal additional physical damage equal to 3.5% of your max Health.","shared":false},{"id":"homeguard","ko":"민병대","en":"Homeguard","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Homeguard_small.png","descKo":"이동 속도가 70% 증가합니다. 피해를 입은 후 3초 동안은 효과가 멈춥니다.","descEn":"Gain 70% Move Speed, disabled for 3 seconds after taking damage.","shared":false},{"id":"ice-cold","ko":"차가운 냉기","en":"Ice Cold","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/IceCold_small.png","descKo":"둔화 효과가 이동 속도를 추가로 0 감소시킵니다.","descEn":"Your Slowing effects reduce Move Speed by an extra 0.","shared":false},{"id":"infernal-soul","ko":"지옥불 영혼","en":"Infernal Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/InfernalSoul_small.png","descKo":"스킬 또는 기본 공격으로 적을 공격할 때마다 추가 피해를 입히는 화염의 드래곤 영혼을 얻습니다.","descEn":"You gain the Infernal Dragon Soul, dealing bonus damage when you hit enemies with Abilities or Attacks.","shared":true},{"id":"leg-day","ko":"하체 운동의 날","en":"Leg Day","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/LegDay_small.png","descKo":"10의 이동 속도와 15%의 둔화 저항을 얻습니다.","descEn":"Gain 10 Movement Speed and 15% Slow Resist.","shared":false},{"id":"light-em-up","ko":"불을 밝혀","en":"Light 'em Up!","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/LightEmUp_small.png","descKo":"4번째 기본 공격마다 추가로 마법 피해(적중 시)를 입힙니다.","descEn":"Every 4th Attack deals additional magic damage On-Hit.","shared":false},{"id":"mountain-soul","ko":"대지의 영혼","en":"Mountain Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/MountainSoul_small.png","descKo":"전투에서 벗어나면 잠시 동안 보호막을 획득하는 대지의 영혼을 얻습니다.","descEn":"You gain the Mountain Soul, gaining a Shield after being out of combat for a short time.","shared":false},{"id":"mighty-shield","ko":"강력한 방패","en":"Mighty Shield","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/MightyShield_small.png","descKo":"보호막을 얻을 때마다 3초 동안 적응형 능력치를 40~100 얻습니다. (재사용 대기시간 5초)","descEn":"Gain 40 to 100 adaptive force for 3 seconds upon gaining a shield (5 second cooldown).","shared":false},{"id":"mind-to-matter","ko":"정신 변환","en":"Mind to Matter","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/MindToMatter_small.png","descKo":"최대 체력이 마나의 절반만큼 증가합니다.","descEn":"Increase max Health by half of your Mana.","shared":false},{"id":"ocean-soul","ko":"바다의 영혼","en":"Ocean Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/OceanSoul_small.png","descKo":"적에게 피해를 입힌 후 높은 체력 및 마나 재생 효과를 얻는 바다의 영혼을 획득합니다.","descEn":"Gain the Ocean Soul, granting high Health and Mana regen after damaging enemies.","shared":false},{"id":"poltergeist","ko":"폴터가이스트","en":"Poltergeist","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Poltergeist_small.png","descKo":"폴터가이스트 소환사 주문을 얻습니다. 사용 시 보호막과 유체화를 동시에 발동합니다.","descEn":"Replace a summoner spell with Poltergeist.\n\nPoltergeist:","shared":true},{"id":"scoped-weapons","ko":"조준경 부착","en":"Scoped Weapons","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/ScopedWeapons_small.png","descKo":"공격 사거리를 75 얻습니다. (근접 챔피언은 50)","descEn":"Gain 75/50 bonus attack range.","shared":false},{"id":"shadow-runner","ko":"그림자 질주","en":"Shadow Runner","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/ShadowRunner_small.png","descKo":"돌진, 도약, 점멸, 순간이동 스킬을 사용하거나 투명 상태에서 벗어난 후 2초 동안 이동 속도가 200 증가합니다.","descEn":"After using a dash, leap, blink, or teleport Ability or exiting Stealth, gain 200 Move Speed for 2 seconds.","shared":false},{"id":"sonic-boom","ko":"음속 폭발","en":"Sonic Boom","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/SonicBoom_small.png","descKo":"아군에게 이로운 효과, 회복, 보호막을 부여하면 아군 주변 적들에게 피해를 입히고 둔화시킵니다.","descEn":"Buffing, Healing, or Shielding your ally deals damage and Slows enemies surrounding them.","shared":false},{"id":"spin-to-win","ko":"승리를 위한 회전","en":"Spin To Win","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/SpinToWin_small.png","descKo":"회전 스킬의 피해량이 15%, 스킬 가속이 15 증가합니다!","descEn":"Your spin Abilities gain 15 Ability Haste and deal 15% more damage!","shared":false},{"id":"swift-and-safe","ko":"빠르고 안전하게","en":"Swift and Safe","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SwiftandSafe_small.png","descKo":"돌진하거나 점멸한 후 2초 동안 65~290(+ 공격력의 65%)(+ 주문력의 26%)의 피해를 흡수하는 보호막을 얻습니다. (재사용 대기시간 5초)","descEn":"After dashing or blinking, gain a shield that lasts for 2 seconds and absorbs 65 to 290 (+ 65% AD) (+ 26% AP) damage (5 second cooldown).","shared":false},{"id":"tank-it-or-leave-it","ko":"확률적 방어","en":"Tank It Or Leave It","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/TankItOrLeaveIt_small.png","descKo":"공격당할 때 치명타 확률(최대 50%)에 따라 치명 방어가 발동해 받는 피해가 감소할 수 있습니다.\n\n치명타 확률이 25% 증가합니다.","descEn":"You can Critically Defend using your Crit Chance (max 50% chance), giving you a chance to reduce damage.\n\nGain 25% Crit Chance.","shared":false},{"id":"transmute-gold","ko":"전환: 골드","en":"Transmute: Gold","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/TransmuteGold_small.png","descKo":"무작위 골드 증강을 획득합니다.","descEn":"Gain a random Gold Augment.","shared":false},{"id":"typhoon","ko":"태풍","en":"Typhoon","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Typhoon_small.png","descKo":"기본 공격 시 추가 대상에게 화살을 발사해 감소된 피해를 입히고 적중 시 효과를 적용합니다.","descEn":"Your Attacks fire a bolt at an additional target dealing reduced damage and applying On-Hit effects.","shared":false},{"id":"ultimate-unstoppable","ko":"궁극의 저지 불가","en":"Ultimate Unstoppable","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/UltimateUnstoppable_small.png","descKo":"궁극기 사용 시 2초 동안 군중 제어 효과에 면역이 됩니다. (재사용 대기시간 8초)","descEn":"After using your Ultimate, you become immune to crowd control for 2 seconds. (8 second Cooldown).","shared":false},{"id":"upgrade-collector","ko":"징수의 총 업그레이드","en":"Upgrade Collector","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeCollector_small.png","descKo":"징수의 총을 강화합니다. 적 챔피언 처치 시마다 처형 기준치가 0.5%씩 높아져 대상 최대 체력의 12.5%까지 증가하고, 처치 시 추가 골드(25, 총 50)를 얻습니다. 추가로 250골드를 획득합니다.","descEn":"Upgrades The Collector, empowering Death to have its execution threshold increased by 0.5% each time you kill an enemy champion, capped at a threshold of 12.5% of the target's maximum health, and Taxes to generate a further 25 (total 50) from kills. Additionally, gain 250.","shared":false},{"id":"upgrade-immolate","ko":"불사르기 업그레이드","en":"Upgrade Immolate","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeImmolate_small.png","descKo":"바미의 불씨, 공허한 광휘, 태양불꽃 방패, 공허의 불길을 강화합니다. 불사르기가 효과에 적용된 적 챔피언 1명당 초당 12씩 추가로 부여합니다. 추가로 250골드를 획득합니다.","descEn":"Upgrades Bami's Cinder, Hollow Radiance, Sunfire Aegis, and Void Immolation, empowering Immolate to additionally grant you 12 per tick for each enemy champion afflicted by its effect. Additionally, gain 250.","shared":false},{"id":"upgrade-zhonya-s","ko":"존야 업그레이드","en":"Upgrade Zhonya's","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeZH_small.png","descKo":"수호자의 흉갑, 우글렛의 마녀모자, 존야의 모래시계를 강화합니다. 정지 상태에서 이동할 수 있고 그동안 50% 이동 속도를 얻으며, 존야의 모래시계 정지 재사용 대기시간이 45초로 감소합니다. 추가로 250골드를 획득합니다.","descEn":"Upgrades Seeker's Armguard, Wooglet's Witchcap, and Zhonya's Hourglass, empowering Stasis to allow you to move during its active effect, during which time you also gain 50% bonus movement speed. Additionally, Icons/SnowballUpgrade_small.png","descKo":"눈덩이(표식)가 적중하면 2초 동안 눈보라가 내려 주변 적에게 200(+ 추가 공격력의 200%)(+ 주문력의 120%)의 마법 피해를 입히고 50%(+ 주문력 100당 6%) 둔화시킵니다. 또한 눈덩이 재사용 대기시간이 스킬 가속 50만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"Your Mark is empowered to hail a snowstorm at the location where the target was hit for 2 seconds, granting sight of the area and dealing200 (+ 200% bonus AD) (+ 120% AP) magic damageto enemies within over the duration, as well as slowing them by 50% (+ 6% per 100 AP). Additionally, your Mark cooldown is reduced equivalent to 50 ability haste.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.\n\nThis augment is currently disabled.","shared":false},{"id":"soul-siphon","ko":"영혼 흡수","en":"Soul Siphon","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/SoulSiphon_small.png","descKo":"치명타로 입힌 피해량의 10%만큼 체력을 회복합니다.\n\n치명타 확률이 25% 증가합니다.","descEn":"Heal for 10% of damage done by Critical Strikes.\n\nGain 25% Crit chance.","shared":false},{"id":"spiritual-purification","ko":"영혼의 정화","en":"Spiritual Purification","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SpiritualPurification_small.png","descKo":"처치 관여 시 쓰러진 적 주변 500 범위에서 폭발이 일어나 적 현재 체력의 15%에 해당하는 적응형 피해를 입히고, 1.5초 동안 60% 둔화 지대를 남깁니다.","descEn":"Scoring a champion takedown causes the area around the slain champion to explode in a 500 unit radius, dealing adaptive damage to enemies within equal to 15% of their current health and leaving behind a zone for 1.5 seconds that slows enemies within by 60%.","shared":false},{"id":"tank-engine","ko":"탱크 엔진","en":"Tank Engine","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Tank_Engine_Small.png","descKo":"처치 관여마다 크기가 커지고 일정 비율의 추가 체력을 얻습니다.","descEn":"Gain increased size and percent bonus Health per takedown.","shared":false},{"id":"thread-the-needle","ko":"바늘에 실 끼우기","en":"Thread the Needle","rarity":"gold","iconPath":"/lol-ga ared":false},{"id":"vulnerability","ko":"취약","en":"Vulnerability","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Vulnerability_small.png","descKo":"아이템 및 지속 피해 효과에 치명타가 적용될 수 있습니다.\n\n치명타 확률이 25% 증가합니다.","descEn":"Your Item and damage over time effects can Critically Strike.\n\nGain 25% Crit chance.","shared":false},{"id":"with-haste","ko":"속행","en":"With Haste","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/WithHaste_small.png","descKo":"스킬 가속의 120%에 해당하는 이동 속도를 얻습니다.","descEn":"Gain Move Speed equal to 120% of your Ability Haste.","shared":false},{"id":"back-to-basics","ko":"기본으로 돌아가기","en":"Back to Basics","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/BackToBasics_small.png","descKo":"스킬 피해량, 체력 회복량, 보호막 흡수량 및 스킬 가속이 증가하지만 궁극기를 사용할 수 없습니다.","descEn":"Gain increased Ability Damage, Healing, Shielding, and Ability Haste, but you cannot use your Ultimate Ability.","shared":false},{"id":"biggest-snowball-ever","ko":"데굴데굴 눈덩이!","en":"Biggest Snowball Ever","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/BiggestSnowballEver_small.png","descKo":"눈덩이(표식)가 거대해져 미니언을 관통합니다. 적중 시 폭발해 주변 적에게 200~350(+ 추가 공격력의 100%)(+ 주문력의 60%)의 마법 피해를 입히고 0.75초간 공중으로 띄우며 2초간 20% 둔화시킵니다. 또한 눈덩이 재사용 대기시간이 스킬 가속 100만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"Upgrades your Mark into a massive snowball, empowering it with an increased size radius and the ability to pass through non-champions. The snowball additionally explodes upon impact of the target hit to deal 200 to 350 (+ 100% bonus AD) (+ 60% AP) magic damage to all nearby enemies, knock them up for 0.75 seconds, and slow them by 20% for 2 seconds. Additionally, your Mark cooldown is reduced equivalent to 100 ability haste.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark. Non-champions hit by the snowball are stunned for 1.25 seconds.","shared":false},{
