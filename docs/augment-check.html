<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>증강 검수 — 282개</title>
<style>
  :root {
    --bg: #0d1311; --surface: #131b18; --raised: #1a2420; --border: #25322d;
    --text: #e8f0ec; --text2: #9bb0a8; --text3: #6c7f78;
    --mint: #1ED7A0; --silver: #b9c4cc; --gold: #e8c45f; --prism: #c98bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,19,17,.92);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 24px 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .stats { color: var(--text2); font-size: 13px; }
  .stats > span, .stats > b { white-space: nowrap; }
  .stats b { color: var(--text); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .filters { display: grid; gap: 7px; margin-top: 10px; }
  .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .flabel { flex: 0 0 38px; font-size: 11px; color: var(--text3); letter-spacing: .02em; }
  .count { margin-left: auto; font-size: 12px; color: var(--text2); white-space: nowrap; }
  .count b { color: var(--text); }
  .reset { font-size: 12px; color: var(--text3); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .reset:hover { color: var(--text); background: var(--raised); }
  input[type=search] { background: var(--raised); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 7px 12px; font-size: 13.5px; min-width: 240px; flex: 1; max-width: 420px; outline: none; }
  input[type=search]:focus { border-color: var(--mint); }
  .chip { background: var(--raised); border: 1px solid var(--border); color: var(--text2);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; user-select: none;
    line-height: 1.35; transition: background .12s, color .12s, border-color .12s; }
  .chip:hover { border-color: #3a4a44; color: var(--text); }
  .chip.active { background: var(--mint); color: #06231b; border-color: var(--mint); font-weight: 600; }
  .chip.toggle.active { background: #4a2f2f; color: #ffd9d9; border-color: #7a4a4a; }
  main { padding: 20px 24px 60px; }
  .group-title { margin: 24px 0 12px; font-size: 15px; color: var(--text2); display: flex; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .card.shared { border-color: #6a4a2a; }
  .icon { width: 56px; height: 56px; border-radius: 9px; flex: 0 0 56px; background: var(--raised);
    object-fit: contain; }
  .icon.err { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text3); }
  .meta { min-width: 0; flex: 1; }
  .ko { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 13px; color: var(--text); line-height: 1.45; margin-top: 8px; white-space: pre-wrap; }
  .descEn { font-size: 12px; color: var(--text2); line-height: 1.4; margin-top: 5px; white-space: pre-wrap; }
  .badges { display: flex; gap: 6px; margin-top: 8px; }
  .rb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
  .rb.silver { background: rgba(185,196,204,.15); color: var(--silver); }
  .rb.gold { background: rgba(232,196,95,.15); color: var(--gold); }
  .rb.prismatic { background: rgba(201,139,255,.15); color: var(--prism); }
  .sb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(232,150,80,.15); color: #e89650; }
  .nb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(30,215,160,.16); color: var(--mint); }
  .cb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(220,90,90,.16); color: #ff9a9a; }
  .db { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(120,120,120,.18); color: var(--text3); }
  .card.isnew { border-color: rgba(30,215,160,.45); }
  .mb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
  .mb.aram { background: rgba(90,170,255,.16); color: #8fc4ff; }
  .mb.classic { background: rgba(255,180,90,.16); color: #ffc98f; }
  .mb.none { background: rgba(120,120,120,.18); color: var(--text3); }
  details.review { margin: 28px 0 0; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); padding: 12px 16px; }
  details.review summary { cursor: pointer; font-size: 14px; font-weight: 600; }
  details.review table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  details.review td { border-top: 1px solid var(--border); padding: 8px 6px; vertical-align: top; }
  details.review td.n { width: 150px; color: var(--text); font-weight: 600; }
  details.review td.a { color: var(--text2); }
  details.review td.w { color: var(--text3); }
  .empty { color: var(--text3); padding: 40px; text-align: center; }
  .iconpath { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, monospace; }
</style>
</head>

+주문력 45%) 물리 피해. 바깥쪽에 맞은 적은 둔화·추가 피해를 받고 자신은 체력을 회복합니다.","descEn":"With an enemy within 650, wind up 0.75s and slash a 650 radius for 200-350. Edge hits slow, deal extra damage, and heal you.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":true,"shared":false},{"id":"quest-steel-your-heart","ko":"강철 같은 심장","en":"Steel Your Heart","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Quest_SteelYourHeart_small.png","descKo":"조건: 효과가 400중첩 이상 적용된 강철심장을 보유해야 합니다. 보상: 강철심장 중첩이 3배가 됩니다. 체력 재생이 강철심장 중첩의 12.5%만큼 증가합니다.","descEn":"Requirement: Heartsteel with 400+ stacks. Reward: triple your Heartsteel stacks and gain health regen equal to 12.5% of them.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"quest-ultra-hydra","ko":"궁극의 히드라","en":"Ultra Hydra","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UltraHydra_small.png","descKo":"히드라 아이템을 완성하면 티아맷을 획득합니다. 퀘스트: 굶주린 히드라, 불경한 히드라, 거대한 히드라를 획득해야 합니다. 보상: 궁극의 히드라","descEn":"Completing a Hydra item grants a Tiamat. Quest: obtain Ravenous Hydra, Profane Hydra and Titanic Hydra. Reward: Ultra Hydra.","modes":["aram"],"isNew":true,"noCoef":false,"disabled":false,"shared":false},{"id":"quest-urf-s-champion","ko":"우르프의 챔피언","en":"Urf's Champion","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Quest_UrfsChampion_small.png","descKo":"조건: 처치에 10회 관여해야 합니다. 보상: 황금 뒤집개","descEn":"Requirement: Score 10 takedowns. Reward: Golden Spatula","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"quest-wooglet-s-witchcap","ko":"우글렛의 마녀 모자","en":"Wooglet's Witchcap","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Quest_WoogletsWitchcap_small.png","descKo":"즉시: 쓸데없이 큰 지팡이를 획득합니다. 조건: 라바돈의 죽음모자와 존야의 모래시계를 보유해야 합니다. 보상: 우글렛의 마녀 모자를 획득합니다.","descEn":"Immediate: gain Needlessly Large Rod. Requirement: own Rabadon's Deathcap En":"Each time you Immobilize or Ground an enemy, gain 10 Adaptive Force for the round.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"hextech-soul","ko":"마법공학의 영혼","en":"Hextech Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/InfernalSoul_small.png","descKo":"스킬 또는 기본 공격으로 적을 공격할 때마다 추가 피해를 입히는 화염의 드래곤 영혼을 얻습니다.","descEn":"You gain the Infernal Dragon Soul, dealing bonus damage when you hit enemies with Abilities or Attacks.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"infinite-recursion","ko":"무한 반복","en":"Infinite Recursion","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/InfiniteRecursion_small.png","descKo":"스킬 가속을 60 얻고, 처치 관여마다 스킬 가속이 3씩 추가로 증가합니다.","descEn":"Gain 60 ability haste, increased by 3 each time you score a champion takedown.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"crit-n-cast","ko":"치명적 가속","en":"Crit 'n Cast","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/CritnCast_small.png","descKo":"치명타 확률의 40%에 해당하는 스킬 가속을 얻습니다.","descEn":"Gain ability haste equal to 40% of your critical strike chance.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"critical-missile","ko":"치명적 미사일","en":"Critical Missile","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/CriticalMissile_small.png","descKo":"적 챔피언에게 치명타 적중 시 1발(+ 치명타 확률 50%당 1발, 최대 3발)의 미사일을 발사해 각 15~65의 마법 피해를 입힙니다. 3연발은 주 대상 주변 적을 우선합니다. 또한 치명타 확률을 25% 얻습니다.","descEn":"Crits fire 1-3 missiles (+1 per 50% crit) for 15-65 magic damage each, favoring enemies near the target. Gain 25% crit chance.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"devil-on-your-shoulder","ko":"어깨 위의 악마","en":"Devil on Your Shoulder","rarity":"prismatic","iconPath":"/lo :","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"holy-snowball","ko":"신성한 눈덩이","en":"Holy Snowball","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GoldenSnowball_small.png","descKo":"눈덩이(표식)로 돌진하면 도착 시 1.5초 동안 무적이 됩니다. 또한 눈덩이 재사용 대기시간이 스킬 가속 100만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"Dashing with Mark grants 1.5s of invulnerability on arrival, and Mark gains 100 ability haste. Grants Mark if unequipped.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"triggered-inferno","ko":"지옥불 난사 발동","en":"Triggered Inferno","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/MadScientist_small.png","descKo":"적 챔피언에게 피해를 입힐 때마다 스타일이 쌓여 이동 속도가 증가합니다. 스타일이 최고 등급에 도달하면 지옥불 난사를 자동 사용해 주변 적에게 물리 피해를 입힙니다.","descEn":"Damaging champions builds Style, granting move speed per stack. At max Style, auto-cast a barrage that damages nearby enemies.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"juiced","ko":"도취","en":"Juiced","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Juiced_small.png","descKo":"기본 공격 적중 시 최대 마나의 2.5%를 소모해 최대 마나의 4.5%에 해당하는 추가 마법 피해를 입힙니다. 이 피해는 치명타 적용 시 100의 추가 피해를 입힙니다.","descEn":"Attacks on champions spend 2.5% max mana to deal bonus magic damage equal to 4.5% of your max mana. Can crit for 100 more.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"kill-secured","ko":"확보된 킬","en":"Kill Secured","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/KillSecure_small.png","descKo":"최대 체력의 40% 미만인 적 챔피언에게 다가갈 때 이동 속도를 60% 얻습니다.","descEn":"Gain 60% bonus movement speed towards enemy champions below 40% of their maximum health.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"phenomenal-evil","ko":"극악무도","e als max health true damage, heals you, and grants move speed. This effect stacks.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"hellbent","ko":"열의","en":"Hellbent","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Hellbent_small.png","descKo":"적중 시 중첩(6초, 최대 10). 최대 중첩에서 치명적 피해를 받으면 4초 무적 부활 후 최대 체력 35~75%로 부활. 이후 15초간 적응형 25~200, 이동 속도, 흡혈 15~30%. (재사용 120초)","descEn":"Hits stack (6s, max 10). At max, lethal damage triggers a 4s invulnerable revival at 35-75% health, then 15s of bonuses. (120s)","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"high-roller","ko":"도박꾼","en":"High Roller","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/HighRoller_small.png","descKo":"주변 적이 죽을 때 7% 확률로 능력치 모루를 떨어뜨립니다. 모루를 주우면 다음 상점 이용 시(사망 후) 능력치를 획득합니다.","descEn":"Nearby enemies that die have a 7% chance to drop a Stat Bonus anvil. Walk over to grab it; it applies when the shop reopens.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"titan-s-resolve","ko":"거인의 결의","en":"Titan's Resolve","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/IAmTheJuggernaut_small.png","descKo":"피해를 주거나 받을 때마다 중첩을 얻습니다(6초 지속, 지속 피해 제외). 10중첩마다 적응형 공격력/주문력 25~50, 방어력·마법 저항력 4~8, 크기 10%, 강인함 8%를 얻습니다.","descEn":"Dealing or taking damage grants a stack for 6s (no DoT). Per 10 stacks: 25-50 adaptive, 4-8 armor and MR, 10% size, 8% tenacity.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"multishot","ko":"다중 공격","en":"Multishot","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"퀘스트: 선택한 스킬 투사체로 적 챔피언을 적중시키세요(6단계). 보상: 단계마다 투사체가 1개 늘고 부채꼴로 발사됩니다. 같은 시전의 추가 적중은 30% 피해.","descEn":"Quest: hit champions with a chosen missile (6 tiers). Reward: ea ulled into a 1200-unit Dark Realm, sealed off.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"don-t-change-the-channel","ko":"채널 고정","en":"Don't Change the Channel","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/DontChangeTheChannel_small.png","descKo":"스킬을 정신 집중하는 매초 50~200(+ 공격력의 50%)(+ 주문력의 25%)(+ 추가 체력의 10%)의 보호막을 얻습니다. 정신 집중을 멈추면 빠르게 사라집니다.","descEn":"Each second you channel an ability grants a 50-200 (+50% AD) (+25% AP) shield. It decays quickly once you stop channeling.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"bolstered","ko":"보강","en":"Bolstered","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"보호막 효과가 있는 스킬을 강화해 보호막 세기를 0~60 증가시킵니다.","descEn":"Upgrades an ability with a shield, increasing its shield strength by 0-60.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"double-strike","ko":"2연속 방어","en":"Double Strike","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Adamant_small.png","descKo":"강화된 기본 공격 효과가 있는 스킬을 강화합니다. 강화된 공격이 적중 효과(온히트)를 한 번 더 적용합니다.","descEn":"Upgrades an ability with an empowered attack: it applies on-hit effects a second time.","modes":["classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"our-healing","ko":"우리의 치유","en":"Our Healing","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Equillibrium_small.png","descKo":"주변 대상이 체력을 회복할 때마다(자신 제외) 그 회복량의 15%만큼 자신을 회복합니다. 적의 회복 효과로는 두 배(30%) 적용됩니다.","descEn":"Whenever a nearby unit is healed (not yourself), you heal for 15% of that amount, doubled to 30% from enemy heals.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"shark-bait","ko":"상어 미끼","en":"Shark Bait","rarity":"gold","iconPath":"/lol-g .","descEn":"Upgrades an ability: after casting, your next attack gains 300 range, 75% attack speed, and 3% max health bonus magic damage.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"spell-split","ko":"주문 분산","en":"Spell Split","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"투사체가 있는 스킬을 강화합니다. 투사체가 적에게 적중하거나 최대 사거리에 도달하거나 재시전 시 0.25초에 걸쳐 두 개로 갈라져 반대 방향으로 발사됩니다. 같은 시전의 추가 적중은 30% 피해.","descEn":"Upgrades a missile ability: on hit, at max range, or on recast it splits in two, firing opposite ways. Extra hits deal 30% damage.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"nature-is-healing","ko":"자연의 회복","en":"Nature is Healing","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/NatureIsHealing_small.png","descKo":"수풀에 있는 매초 최대 체력의 0.6~2.1%를 회복합니다.","descEn":"Heal yourself for 0.6 to 2.1 of your maximum health for each second that you are within brush.","modes":["aram","classic"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"overextender","ko":"무리한 진입","en":"Overextender","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Overextender_small.png","descKo":"대포 발사기 발사가 강화되어 사거리가 12,000 증가하고 충돌 피해가 50%, 이동 속도가 크게 증가합니다. 또한 귀환이 강화 귀환으로 업그레이드됩니다. (도살자의 다리 전용)","descEn":"Your Cannon Launcher launch is empowered: 12,000 more range, 50% more impact damage, and far greater travel speed.","modes":["aram"],"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"overloaded","ko":"과충전","en":"Overloaded","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"선택한 스킬을 강화합니다. 다른 스킬을 시전할 때마다 해당 스킬의 재사용 대기시간이 초기화됩니다.","descEn":"Upgrades an ability: its cooldown resets whenever you cast a different ability.","modes":["aram","classic"],"isNew": ion within 3 seconds of damaging them renders you invisible for 1.5 seconds, during which you also gain 40% bonus movement speed. Attacking or casting abilites ends the stealth immediately.","appNums":["3","1.5"],"wikiNums":["3","1.5","40"]},{"id":"ok-boomerang","name":"OK Boomerang","app":"Autocast throw a boomerang at a nearby enemy every 7s.","wiki":"Automatically cast an improved version of at the closest nearby enemy champion within 1250 units, dealing 40 to 200 (+ 30% bonus AD) (+ 20% AP) adaptive damage to enemies hit (10 second cooldown).","appNums":["7"],"wikiNums":["1250","40","200","30","20","10"]},{"id":"rabble-rousing","name":"Rejuvenation","app":"Upgrades an ability: casting it heals you 30-100 (+25% bonus AD) (+15% AP), increased up to 50% by the ability's cooldown.","wiki":"Upgrades one of your champion's abilities, empowering the ability's cast to heal you for 30 to 100 (+ 25% bonus AD) (+ 15% AP) (+ 5% bonus health). This is increased by up to 50% based on how long the ability's cooldown is, for a maximum heal of 30*1.5 to 100*1.5 (+ 25*1.5% bonus AD) (+ 15*1.5% AP) (+ 5*1.5% bonus health).","appNums":["30","100","25","15","50"],"wikiNums":["30","100","25","15","5","50","30","1.5","100","1.5","25","1.5","15","1.5","5","1.5"]},{"id":"scopier-weapons","name":"Scopier Weapons","app":"Gain 100 bonus attack range (200 for melee champions).","wiki":"Gain bonus attack range.","appNums":["100","200"],"wikiNums":[]},{"id":"snowball-upgrade","name":"Snowball Upgrade","app":"Mark hails a snowstorm for 2s dealing 200 (+200% bonus AD) (+120% AP) magic damage and slowing 50%. Mark gains 50 haste.","wiki":"Your Mark is empowered to hail a snowstorm at the location where the target was hit for 2 seconds, granting sight of the area and dealingto enemies within over the duration, as well as slowing them by 50% (+ 6% per 100 AP). Additionally, your cooldown is reduced equivalent to 50 ability haste. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark. This augment is currently disabled.","appNums":["2","200","200","120","50","50"],"wikiNums":["2","50","6","100","50"]},{"id":"spiritual-purification","name":"Spiritual Purification","app":"Takedowns explode a 500 radius for adaptive damage equal to 15% of enemies' current health, leaving a 60% slow zone for 1.5s.","wiki":"Scoring a champion takedown causes the area around the slain champion to explode in a 500 unit radius, dealing adaptive damage to enemies within equal to 15% of their current health and leaving behind a zone for 1.5 seconds that slows enemies within by 60%.","appNums":["500","15","60","1.5"],"wikiNums":["500","15","1.5","60"]},{"id":"upgrade-infinity-edge","name":"Upgrade Infinity Edge","app":"Upgrades Infinity Edge with Excoriate. Gain 25% crit chance and 500 gold. Excoriate: bonus crit damage rerolled every 0.25s.","wiki":"Upgrades Infinity Edge, empowering it to gain. Additionally, gain. Excoriate: Gain a random amount of bonus critical strike damage that scales up to 50% of your critical strike chance, with the value of this amount changing every 0.25 seconds.","appNums":["25","500","0.25"],"wikiNums":["50","0.25"]},{"id":"upgrade-sheen","name":"Upgrade Sheen","app":"Upgrades all Spellblade items: the proc deals 4% target max health bonus physical damage and heals you 3.5%. Gain 250 gold.","wiki":"Upgrades all Spellblade items, empowering the passive effect to deal additional bonus physical damage equal to 4% of the target's maximum health and heal you for 3.5% of your maximum health. Additionally, gain.","appNums":["4","3.5","250"],"wikiNums":["4","3.5"]},{"id":"vulnerability","name":"Vulnerability","app":"Your Item and damage over time effects can Critically Strike. Gain 25% Crit chance.","wiki":"Damage dealt by items and damage over time effects can now critically strike for (145% +) damage (5 second cooldown per cast instance). Additionally, gain 25% critical strike chance. If both Jeweled Gauntlet and Vulnerability are equipped, only rolls the critical strike chance of the augment that has the higher critical damage (or either if equal).","appNums":["25"],"wikiNums":["145","5","25"]},{"id":"biggest-snowball-ever","name":"Biggest Snowball Ever","app":"Mark becomes a giant snowball piercing minions and exploding for 200-350, knocking up 0.75s and slowing 20%. Mark gains 100 haste.","wiki":"Upgrades your Mark into a massive snowball, empowering it with an increased size radius and the ability to pass through non-champions. The snowball additionally explodes upon impact of the target hit to deal 200 to 350 (+ 100% bonus AD) (+ 60% AP) magic damage to all nearby enemies, knock them up for 0.75 seconds, and slow them by 20% for 2 seconds. Additionally, your cooldown is reduced equivalent to 100 ability haste. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark. Non-champions hit by the snowball are stunned for 1.25 seconds.","appNums":["200","350","0.75","20","100"],"wikiNums":["200","350","100","60","0.75","20","2","100","1.25"]},{"id":"blade-waltz","name":"Blade Waltz","app":"Gain the Blade Waltz Summoner Spell. Blade Waltz makes you untargetable while you dash at and damage enemies 6 times.","wiki":"Replace a summoner spell with Blade Waltz. Blade Waltz: Blink to the target enemy champion. You then blink to the nearest other enemy champion every 0.25 seconds over the next 1.75 seconds, blinking up to 7 additional times. The last blink targets the primary target. Each time you blink to an enemy, deal 30 to 150 (+ 10% bonus AD) (+ 6% AP) physical damage to them and apply on-hit effects at 50% effectiveness, up to a total of 30*6 to 150*6 (+ 10*6% bonus AD) (+ 6*6% AP) (45 second cooldown). While Blade Waltz is active, you are untargetable and unable to act. This effect will end prematurely if there are no longer any nearby valid targets to blink to. An enemy can be blinked to more than once if there are no other valid targets in range.","appNums":["6"],"wikiNums":["0.25","1.75","7","30","150","10","6","50","30","6","150","6","10","6","6","6","45"]},{"id":"cruelty","name":"Cruelty","app":"Immobilizing or grounding a champion drops a comet on them after 1s for 50-150 (+4% max health) magic damage. (6s per target)","wiki":"Immobilizing or grounding an enemy champion summons a comet above them that lands at their current location after 1 second, dealing 50 to 150 (+ 40% AP) (+ 4% of your maximum health) magic damage to enemies within a 300 radius (6 second cooldown per cast instance). For displacement effects, the comet will be summoned at the displacement's end location.","appNums":["1","50","150","4","6"],"wikiNums":["1","50","150","40","4","300","6"]},{"id":"dual-wield","name":"Dual Wield","app":"Attacks fire a bolt dealing 40% damage and applying on-hit effects at 40%. Gain 10% total attack speed.","wiki":"Your basic attacks launch a bolt at the target that fires after a 0.225-second delay on-attack, deals 40% of the triggering attack's pre-mitigation damage, and applies on-hit effects at 40% effectiveness. Additionally, increase your total attack speed by 10%.","appNums":["40","40","10"],"wikiNums":["0.225","40","40","10"]},{"id":"empyrean-promise","name":"Empyrean Promise","app":"Gain 15% heal and shield power and Empyrean Promise: dash to an ally, shielding both of you 100-250 for 3s. (20s, 2000 range)","wiki":"Replace a summoner spell with ' active. Additionally, gain 15% heal and shield power. Active - Vigilance: After a 0.25-second delay, dash to the current location of the target allied champion and gain a 100 to 250 (+ 100% AP) (+ 10% bonus health) shield for 3 seconds. Upon arrival, grant the ally the same shield (20 second cooldown; 2000 range).","appNums":["15","100","250","3","20","2000"],"wikiNums":["15","0.25","100","250","100","10","3","20","2000"]},{"id":"fan-the-hammer","name":"Fan the Hammer","app":"When you Attack, fire 5 bolts that each deal physical damage and applies your On-Hit.","wiki":"Your next basic attack against an enemy champion in each cardinal direction within additionally on-attack fires 5 missiles at the target that each deal 8 to 51 (+ 14% bonus AD) physical damage, for a total of 8*5 to 51*5 (+ 14*5% bonus AD) physical damage (5 second cooldown per direction). Missiles' damage is increased by type=distance travelled. Each missile can critically strike for damage and applies on-hit effects at 20% effectiveness.","appNums":["5"],"wikiNums":["5","8","51","14","8","5","51","5","14","5","5","20"]},{"id":"final-form","name":"Final Form","app":"Casting your ultimate grants a shield for 50% of your max health, 20% omnivamp, and 30% move speed for 10s. (20s cooldown)","wiki":"Casting your ultimate ability empowers you for 10 seconds, causing you to gain a shield for 50% of your maximum health, 20% omnivamp, and 30% bonus movement speed for the duration (20 second cooldown).","appNums":["50","20","30","10","20"],"wikiNums":["10","50","20","30","20"]},{"id":"glass-cannon","name":"Glass Cannon","app":"Max health locks to 70% and can't be raised or healed. In return, deal bonus true damage equal to 25% of damage dealt (melee 15%).","wiki":"You gain a health threshold equal to which cannot be modified nor exceeded by any means. In return, you deal bonus true damage equal to of all of the damage you deal pre-mitigation.","appNums":["70","25","15"],"wikiNums":[]},{"id":"goldrend","name":"Goldrend","app":"Damaging a champion deals 50-150 bonus magic damage and grants 30 gold and 25% move speed for 1.5s. (30s per champion)","wiki":"Damaging basic attacks or abilities against enemy champions deal 50 to 150 (+ 40% bonus AD) (+ 20% AP) bonus magic damage, and grant you and 25% bonus movement speed for 1.5 seconds (30 second cooldown per champion).","appNums":["50","150","30","25","1.5","30"],"wikiNums":["50","150","40","20","25","1.5","30"]},{"id":"goliath","name":"Goliath","app":"Become large, gaining 35% Health and 15% Adaptive Force.","wiki":"Grants 35% bonus health, 15% adaptive force, and 50% increased size.","appNums":["35","15"],"wikiNums":["35","15","50"]},{"id":"king-me","name":"King Me","app":"Entering the enemy gate or catapult crowns you: gain a random prismatic augment and 1000 gold of stats on your first legendary.","wiki":"Upon entering the enemy team's gate or Catapult for the first time, either of which are located near their spawn, you become Kinged, causing you to gain one random Prismatic-tier augment and the first eligible Legendary item in your inventory to be upgraded with improved stats. The gold value of all upgradeable stats on the item is increased by exactly. King Me prioritize upgrading the first Legendary item eligible for a upgrade based on its position in the inventory, detecting each slot until an eligible item is found.","appNums":["1000"],"wikiNums":[]},{"id":"ominous-pact","name":"Ominous Pact","app":"Gain 1 level now and 1 more every other round. Your level cap is removed. Taken after round 4, gain 2 extra levels.","wiki":"Your abilities now have a health cost of 5% current health to cast them. In return, you gain ability power based on your missing health, up to 75 to 150 at 70% missing health, key=% bonus movement speed, and key=% omnivamp.","appNums":["1","1","4","2"],"wikiNums":["5","75","150","70"]},{"id":"quantum-computing","name":"Quantum Computing","app":"With an enemy within 650, wind up 0.75s and slash a 650 radius for 200-350. Edge hits slow, deal extra damage, and heal you.","wiki":"Automatically cast an improved version of when an enemy champion is within 650 units of you, winding up over 0.75 seconds to slash in a 650 radius around you. The slash deals 200 to 350 (+ 75% bonus AD) (+ 45% AP) physical damage to enemies within the area (30 second cooldown). Enemies hit by the outer edge of the circle take bonus physical damage equal to 10% (+ 2.5% per 100 bonus AD) (+ 1.6% per 100 AP) (+ 0.1% per 100 bonus health) of their maximum health and are slowed by 80% decaying over 2 seconds. Additionally, you are healed for 80% of the bonus post-mitigation damage against enemy champions hit by the outer edge. This augment is currently disabled.","appNums":["650","0.75","650","200","350"],"wikiNums":["650","0.75","650","200","350","75","45","30","10","2.5","100","1.6","100","0.1","100","80","2","80"]},{"id":"scopiest-weapons","name":"Scopiest Weapons","app":"Gain 150 bonus attack range (250 for melee champions).","wiki":"Gain bonus attack range.","appNums":["150","250"],"wikiNums":[]},{"id":"tap-dancer","name":"Tap Dancer","app":"Your Attacks grant you 10 Move Speed On-Hit. Gain Attack Speed equal to 10% of your Move Speed.","wiki":"Basic attacks on-hit against enemy champions and minions grant 10 bonus movement speed, lasting for 5 seconds, refreshing on subsequent triggers, and stacking infinitely. Additionally, gain bonus attack speed equal to 10% total movement speed.","appNums":["10","10"],"wikiNums":["10","5","10"]},{"id":"transmute-chaos","name":"Transmute: Chaos","app":"Gain 2 random Augments.","wiki":"Gain two completely random augments, excluding the other two offerings in your current assortment.","appNums":["2"],"wikiNums":[]},{"id":"ultimate-awakening","name":"Ultimate Awakening","app":"Gain 30 ultimate haste. Your ultimate resets all basic abilities and grants 300 basic ability haste for 15s. (20s cooldown)","wiki":"Casting your ultimate ability resets the of all your basic abilities and grants you 300 basic ability haste for 15 seconds (20 second cooldown). Additionally, gain 30 ultimate haste.","appNums":["30","300","15","20"],"wikiNums":["300","15","20","30"]},{"id":"earthwake","name":"Earthwake","app":"Your dash, blink, or teleport Abilities leave behind a trail that detonates after 1 second.","wiki":"Dashing or blinking causes you to leave behind a trail icononly=true from the location you moved to your destination that detonates after 0.75 seconds in a 300 radius, dealing 90 to 250 (+ 125% bonus AD) (+ 60% AP) physical damage per explosion to enemies hit, reduced to 70% against minions. Enemies can be affected only once every second from all cast instances, and the effect is not triggered if you move beyond 2000 units with the dash or blink. This augment is only offered to up to 2 players on each team for a given game.","appNums":["1"],"wikiNums":["0.75","300","90","250","125","60","70","2000","2"]},{"id":"slap-around","name":"Slap Around","app":"Each time you Immobilize or Ground an enemy, gain 10 Adaptive Force for the round.","wiki":"Immobilizing or grounding an enemy champion grants you, stacking infinitely (5 second cooldown per cast instance). Lose 50% of stacks on death.","appNums":["10"],"wikiNums":["5","50"]},{"id":"critical-missile","name":"Critical Missile","app":"Crits fire 1-3 missiles (+1 per 50% crit) for 15-65 magic damage each, favoring enemies near the target. Gain 25% crit chance.","wiki":"Critical strikes against enemy champions launch 1 (+ 1 per 50% critical strike chance) missiles at the target that each deal 15 to 65 magic damage. Additionally, gain 25% critical strike chance.","appNums":["1","3","1","50","15","65","25"],"wikiNums":["1","1","50","15","65","25"]},{"id":"devil-on-your-shoulder","name":"Devil on Your Shoulder","app":"Lose 0.5% current health per second (5% near enemies) for 20% bonus true damage. Hits drop Remnants that heal 50-150 on pickup.","wiki":"Forge a pact with, who drains 0.5% of your current health every second, increased to 5% if there are enemy champions within 1000 units. In return, you deal 20% bonus true damage and your basic attacks and abilities summon a Life Remnant nearby for 5 seconds (0.75-second spawn cooldown). You can absorb a Life Remnant by moving over it, healing you for 50 to 150 (+ 50% bonus AD) (+ 25% AP) and granting you 15% bonus movement speed. This augment is currently disabled.","appNums":["0.5","5","20","50","150"],"wikiNums":["0.5","5","1000","20","5","0.75","50","150","50","25","15"]},{"id":"donation","name":"Donation","app":"Gain 1750 upon acquiring this augment.","wiki":"Gain upon acquiring this augment.","appNums":["1750"],"wikiNums":[]},{"id":"dropkick","name":"Dropkick","app":"Attacks execute champions below 5% max health (+3.5% per 100 base AD), launching the corpse for 150-500. Executions heal 100-300.","wiki":"Your basic attacks and abilities execute enemy champions below 4% (+ 5.5% per 100 base AD) (+ 1% per 1000 bonus health) of their maximum health, which causes their corpse to be sent flying away in a line. Upon collision with an enemy champion or terrain, the target's corpse explodes to deal 150 to 500 (+ 100% bonus armor) (+ 100% bonus magic resistance) magic damage to nearby enemies. Successful executions heal you for 100 to 300 (+ 25% bonus health). The execution may also be triggered by the explosion and ignores shields.","appNums":["5","3.5","100","150","500","100","300"],"wikiNums":["4","5.5","100","1","1000","150","500","100","100","100","300","25"]},{"id":"droppybara","name":"Droppybara","app":"Replaces Summoner Flee with Droppybara: after a delay it deals 30% max health true damage plus magic damage over 3 seconds.","wiki":"Replace a summoner spell with Droppybara. Droppybara: This augment is only offered to up to 1 player on each team for a given game. This augment is currently disabled.","appNums":["30","3"],"wikiNums":["1"]},{"id":"empowered-by-the-faithful","name":"Empowered By The Faithful","app":"Healing or shielding blesses an ally 8s. Their damage stacks Devotion (max 50); at max a shockwave deals 50-300 (+750% heal).","wiki":"Granting a heal or shield to an allied champion blesses them for 8 seconds. Whenever a blessed ally damages an enemy champion, you generate a stack of Devotion, stacking up to 50 times. Upon reaching maximum stacks, you unleash a shockwave that deals 50 to 300 (+ 750% heal and shield power) magic damage to nearby enemies. Enemy champions damaged below a percentage of their maximum health equal to 25% of your heal and shield power are executed.","appNums":["8","50","50","300","750"],"wikiNums":["8","50","50","300","750","25"]},{"id":"final-city-transit","name":"Final City Transit","app":"On death you launch a train at your killer that pierces enemies for 150-750 (+50% AP) (+15% max health) physical damage.","wiki":"Upon death, you summon a train over 1 second that launches towards your killer at full speed, travelling in their direction at a global distance and dealing 150 to 750 (+ 65% bonus AD) (+ 50% AP) (+ 15% maximum health) physical damage to enemies it passes through. The train is summoned a slight distance away from the front of your killer, based on their facing direction at the time of your death, and launches towards the position they were located at the time of your death. This augment is currently disabled.","appNums":["150","750","50","15"],"wikiNums":["1","150","750","65","50","15"]},{"id":"juiced","name":"Juiced","app":"Attacks on champions spend 2.5% max mana to deal bonus magic damage equal to 4.5% of your max mana. Can crit for 100 more.","wiki":"Basic attacks on-hit against enemy champions consume 2.5% of your maximum mana to deal bonus magic damage equal to 4.5% of your maximum mana. This damage can critically strike for bonus damage.","appNums":["2.5","4.5","100"],"wikiNums":["2.5","4.5"]},{"id":"phenomenal-evil","name":"Phenomenal Evil","app":"Gain Phenomenal Evil: damaging a champion with an ability grants 1 permanent ability power. Starts at 40 if not your first.","wiki":"Gain. Phenomenal Evil Power: Generate a permanent stack of Phenomenal Evil each time you damage an enemy champion with ability damage. This effect cannot trigger more than once every second globally and once every 3 seconds from the same cast instance. For each stack, gain 1 ability power. If this is not your first augment, start with 40 Phenomenal Evil stacks, granting you 40 ability power.","appNums":["1","40"],"wikiNums":["3","1","40","40"]},{"id":"pinball","name":"Pinball","app":"Mark becomes a pinball dealing 100-500 true damage, ricocheting off terrain. Each bounce adds 25% size and 20% damage (max 4).","wiki":"Your Mark is empowered to instead throw a pinball, which deals 100 to 500 bonus true damage and ricochets off of terrain that it collides with. Each time the pinball ricochets, its remaining travel distance is reset, it increases in radius by 25%, deals 20% increased damage, and reduces remaining cooldown by 30%. The pinball can ricochet up to 4 times, for a maximum radius increase of 100% and a damage increase of 80%. Additionally, your cooldown is reduced equivalent to 50 ability haste. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","appNums":["100","500","25","20","4"],"wikiNums":["100","500","25","20","30","4","100","80","50"]},{"id":"prom-queen","name":"Prom Queen","app":"Periodically auto-cast Rakan's sprint: 6s of ghosting and 50% move speed, knocking down and charming enemies for 1.5s. (35s)","wiki":"Automatically cast a modified version of, empowering you to break into a captivating sprint for 6 seconds. While empowered, you gain ghosting and 50% bonus movement speed, and enemies you collide with are knocked down and become charmed for 1.5 seconds (35 second cooldown). A sparkly tiara will descend upon you 2.5 seconds before the effect activates.","appNums":["6","50","1.5","35"],"wikiNums":["6","50","1.5","35","2.5"]},{"id":"shrink-engine","name":"Shrink Engine","app":"Takedowns stack infinitely. Each grants 8 ability haste and 1% move speed and shrinks you 4% (max 80%). Death loses 65% of stacks.","wiki":"Scoring a champion takedown generates a stack, stacking infinitely. For each stack, gain 8 ability haste and 1% bonus movement speed, and reduce your size by 4%. Lose 65% of stacks on death. Size reduction is capped at 80% (20 stacks).","appNums":["8","1","4","80","65"],"wikiNums":["8","1","4","65","80","20"]},{"id":"sonata","name":"Sonata","app":"Alternate Aria and Song every 10s. Aria heals you and your lowest ally 60, shields allies 80. Song grants 30% move speed for 7s.","wiki":"Alternate between automatically casting a modified version of and modified Song of Celerity, with the former being cast first (10 second cooldown). Aria of Perseverance: Heal yourself for 60 (+ 60% AP) and send out a tone to the most wounded allied champion within 1000 units that heals them for the same amount. Additionally, generate an aura that grants you and tagged allied champions a 80 (+ 40% AP) shield for 1.5 seconds. Song of Celerity: Gain 30% bonus movement speed for 7 seconds. If you take damage during this time, the duration ends prematurely once or if 3 seconds have elapsed. Additionally, generate an aura that grants tagged allied champions 20% bonus movement speed for 3 seconds.","appNums":["10","60","80","30","7"],"wikiNums":["10","60","60","1000","80","40","1.5","30","7","3","20","3"]},{"id":"soul-eater","name":"Soul Eater","app":"Immobilizing or grounding an enemy champion grants you 20 bonus health, stacking infinitely (5 second cooldown per cast instance).","wiki":"Immobilizing or grounding an enemy champion grants you 20 bonus health, stacking infinitely (5 second cooldown per cast instance). If this is not your first augment, gain 300 bonus health.","appNums":["20","5"],"wikiNums":["20","5","300"]},{"id":"spin-me-right-round","name":"Spin Me Right Round","app":"A summoner spell becomes Akshan's Heroic Swing: swing around terrain, firing every 0.2s for 15-75 (+15% AD), then leap and fire.","wiki":"Replace a summoner spell with ' (10 second cooldown, starts post-effect). Heroic Swing - Active: You can activate Heroic Swing three times before the ability goes on cooldown, and you can use the third cast only after 0.5 seconds of the second cast. An attack or movement command may be inputted to use the second and third casts. First Cast: Fire a hook in the target direction that embeds in the first terrain hit for 2 seconds. Heroic Swing's second cast can be used while the hook is attached. If the hook fails to attach or you become immobilized, grounded, or polymorphed within the duration, Heroic Swing is cancelled and placed on full cooldown. Second Cast: Swing around the terrain in either a clockwise or counterclockwise direction based on the position of the cursor relative to your facing direction, stopping upon colliding with an enemy champion or terrain. While swinging, fire at the nearest visible enemy within your (minimum 400 units) every to deal them 15 to 75 (+ 15% AD) (1 + 0.3 per 100% bonus attack speed) physical damage and apply on-hit effects for each shot, with on-hit damage reduced to 25% effectiveness. The dash will be interrupted if you are affected by any immobilizing or polymorphing crowd control during the dash. Third Cast: End the swing by jumping to the target location and fire one last shot at a nearby visible enemy.","appNums":["0.2","15","75","15"],"wikiNums":["10","0.5","2","400","15","75","15","1","0.3","100","25"]},{"id":"stuck-in-here-with-me","name":"Stuck in Here With Me","app":"Your ultimate grows an aura to 500 over 2s. When it ends, enemies inside are taunted 2s and you take 50% less damage. (30s)","wiki":"Casting your ultimate ability grants you an aura for 2 seconds, growing in size over the duration to up to 500 units. After the duration, you taunt all enemies within the aura for 2 seconds and gain 50% damage reduction for the same duration (30 second cooldown). Additionally, gain 30 ultimate haste. Aura is activated once the ultimate's effect starts or has elapsed.","appNums":["500","2","2","50","30"],"wikiNums":["2","500","2","50","30","30"]},{"id":"twin-fire","name":"Twin Fire","app":"Damaging a champion with an ability launches 1 missile (+1 per 33.33% crit chance) for 10-30 each. (5s) Gain 25% crit chance.","wiki":"Damaging abilities against enemy champions launch 1 (+ 1 per 33.33% critical strike chance) missiles at the target that each deal 10 to 30 (+ 7% bonus AD) (+ 7% AP) magic damage (5 second cooldown). Additionally, gain 25% critical strike chance.","appNums":["1","1","33.33","10","30","5","25"],"wikiNums":["1","1","33.33","10","30","7","7","5","25"]},{"id":"from-downtown","name":"From Downtown","app":"Quest: hit champions from 700+ away 15 times. Reward: such hits call a meteor for 75-200 magic damage, scaling with distance. (8s)","wiki":"Quest: Hit enemy champions with abilities while located at least icononly=true 600 units away from them (at the time of the hit) 15 times (counts up to 1 hit per champion per cast instance). Reward: Upon completing your Quest, hitting enemy champions with abilities while located at least icononly=true 600 units away from them at the time of the hit fires a meteor to their current location, which upon landing deals 75 to 200 (+ 50% bonus AD) (+ 20% AP) magic damage to enemies within the area (8 second cooldown per target per cast instance). The meteor's damage and radius are increased based on your distance to the target at the time of the ability hit, increasing its damage by 0 to 230 for 11 and setting its radius to 150;225;337.5;506.3;759.4;1139.1;1708.6 units. Maximum meteor damage is 75*2.3 to 200*2.3 (+ 50*2.3% bonus AD) (+ 20*2.3% AP).","appNums":["700","15","75","200","8"],"wikiNums":["600","15","1","600","75","200","50","20","8","0","230","11","150","225","337.5","506.3","759.4","1139.1","1708.6","75","2.3","200","2.3","50","2.3","20","2.3"]},{"id":"rite-of-ascension","name":"Rite of Ascension","app":"Takedowns within 3s of damaging leave an Essence 8s. Attack it to blink there for move speed, a 75-300 heal, and a basic reset.","wiki":"Scoring a takedown against an enemy champion within 3 seconds of damaging them causes them to leave behind their Essence for 8 seconds. You can basic attack the Essence within 400 units to consume it: causing you to blink to its location after winding up for 1.25 seconds, during which you are untargetable (except to turrets), displacement immune, and unable to act. Upon consumption of the Essence, you gain 100% bonus movement speed decaying over 2 seconds, heal yourself for 75 to 300 (+ 50% bonus AD) (+ 25% AP), and reset the cooldowns of your basic abilities. The heal is increased by key=%, for a maximum heal of 75*2 to 300*2 (+ 50*2% bonus AD) (+ 25*2% AP).","appNums":["3","8","75","300"],"wikiNums":["3","8","400","1.25","100","2","75","300","50","25","75","2","300","2","50","2","25","2"]},{"id":"dropbear","name":"DropBear","app":"On death Tibbers drops in for 250-750 magic damage and a 1.5s stun. He carries your augments and chases your killer for 8-20s.","wiki":"Upon death, you summon ' who drops from above and lands onto the location of your death over 0.5 seconds. Upon landing, he deals 250 to 750 (+ 100% AP) (+ 2 per 1 flat magic penetration) (+ 5 per 1% magic penetration) magic damage to nearby enemies and stuns them for 1.5 seconds. then chases after and targets the enemy champion that killed you, attacking them once he is in range. has all of your augments and lasts for up to 8 to 20 seconds. He gains 80 to 100 bonus attack speed and deals 25 to 150 (+ 50% AP) magic damage every second to enemies within 350 units of him. His stats are: (rapidly decays over his lifetime) 50 to 300 (+ 75% AD) physical damage (basic attack damage) attack range","appNums":["250","750","1.5","8","20"],"wikiNums":["0.5","250","750","100","2","1","5","1","1.5","8","20","80","100","25","150","50","350","50","300","75"]},{"id":"hellbent","name":"Hellbent","app":"Hits stack (6s, max 10). At max, lethal damage triggers a 4s invulnerable revival at 35-75% health, then 15s of bonuses. (120s)","wiki":"Generate a stack of Revivemaxxing for each enemy champion you hit with basic attacks or abilities, lasting for 6 seconds, refreshing on subsequent hits, and stacking up to 10 times. At maximum stacks, you become Hellbent. Hellbent: Upon taking lethal damage, you enter resurrection for 4 seconds, during which you are invulnerable, untargetable, and unable to act. Afterwards, you revive with 35 to 75 of your maximum health (90 second cooldown). Additionally, you become empowered for the next 15 seconds, granting you 25*0.6 to 200*0.6 bonus Attack Damage or 25 to 200 Ability Power (Adaptive), 20 to 40 bonus movement speed while facing toward nearby enemy champions, and 15 to 30 omnivamp for the duration.","appNums":["6","10","4","35","75","15","120"],"wikiNums":["6","10","4","35","75","90","15","25","0.6","200","0.6","25","200","20","40","15","30"]},{"id":"titan-s-resolve","name":"Titan's Resolve","app":"Dealing or taking damage grants a stack for 6s (no DoT). Per 10 stacks: 25-50 adaptive, 4-8 armor and MR, 10% size, 8% tenacity.","wiki":"You generate a stack of Juggernauting for each instance of damage you deal or take (excluding damage over time), lasting for 6 seconds and refreshing on subsequent damage dealt or taken. For every 10 stacks of Juggernauting, you gain 25*0.6 to 75*0.6 bonus Attack Damage or 25 to 75 Ability Power (Adaptive), 5 to 10 bonus armor and bonus magic resistance, 10% increased size, and 8% tenacity. Stacks expire one by one when the duration ends, with the decay rate being faster the more stacks you have.","appNums":["6","10","25","50","4","8","10","8"],"wikiNums":["6","10","25","0.6","75","0.6","25","75","5","10","10","8"]},{"id":"multishot","name":"Multishot","app":"Quest: hit champions with a chosen missile (6 tiers). Reward: each tier adds a missile, fired in a cone. Extra hits deal 30%.","wiki":"Assigns quests that require you to hit enemy champions with a specific ability's missile a number of times (counts up to 1 hit per champion per cast instance). There are six quest tiers, and each completed tier rewards you with an additional missile fired on the ability's cast. The reward effect also modifies the ability to fire all of its missiles in a cone. Subsequent missile hits from the same cast against the same enemy deal 30% damage. Hit requirements as denoted below are rounded down to whole numbers, with a minimum value of 1.","appNums":["6","30"],"wikiNums":["1","30","1"]},{"id":"pursuit-of-haste","name":"Pursuit of Haste","app":"Quest: hit enemy champions with a chosen ability (2 tiers). Reward: each tier grants that ability bonus ability haste.","wiki":"Assigns quests that require you to hit enemy champions with a specific ability a number of times (counts up to 1 hit per champion per cast instance). There are two quest tiers, and each completed tier rewards you with ability haste on the ability.","appNums":["2"],"wikiNums":["1"]},{"id":"spirit-bomb","name":"Spirit Bomb","app":"Heals and shields build a Spirit Bomb. At 200-2000 it flies to your lowest-health ally, healing 5-15% missing health nearby.","wiki":"Your healing and shielding on yourself or allies builds up a Spirit Bomb on top of you. Once you have healed and shielded a combined total of 200 to 2000, you toss the Spirit Bomb onto the most wounded allied champion over 1.1 seconds. Upon impact, the Spirit Bomb explodes in a 475 radius to heal allied champions within the area for 5 to 15 (+ 3% per 100 AP) of their missing health and grants them a shield for 2 seconds that absorbs damage equal to 10 to 25 (+ 2% per 100 AP) of their current health. Healing and shielding from this effect do not count toward the Spirit Bomb's trigger condition.","appNums":["200","2000","5","15"],"wikiNums":["200","2000","1.1","475","5","15","3","100","2","10","25","2","100"]},{"id":"wee-woo-wee-woo","name":"Wee Woo Wee Woo","app":"Facing nearby allies grants 0-50 move speed based on their missing health, lingering 2s. Heals and shields increase as much.","wiki":"Gain key=% (based on target ally's missing health) bonus movement speed while facing toward nearby allied champions, lingering for 2 seconds after no longer facing them. Your heals and shields are also increased by key=%.","appNums":["0","50","2"],"wikiNums":["2"]},{"id":"yowch-my-coins","name":"Yowch, My Coins!","app":"Champions you take down drop 6-10 coins for 10s. You or allies collect them by walking over, granting 15 gold each.","wiki":"Enemy champions that you score a takedown against drop 6 to 10 coins, with each coin landing 500 units away from the location of their death and lasting 10 seconds. You or allied champions can collect the coins by moving over them, granting for each coin collected.","appNums":["6","10","10","15"],"wikiNums":["6","10","500","10"]},{"id":"combusting-interest","name":"Combusting Interest","app":"Burns and damage-over-time on champions generate 1-3 gold (+0.75% of damage dealt) per tick.","wiki":"Gain for each tick of damage dealt to enemy champions with damage over time effects.","appNums":["1","3","0.75"],"wikiNums":[]},{"id":"tooth-fairy","name":"Tooth Fairy","app":"Dealing 25% of a champion's max health in 2.5s drops a Tooth (4s per target). Each pickup grants 4 lethality and magic pen.","wiki":"When you deal damage to an enemy champion equal to or more than 25% of their maximum health within 2.5 seconds, they drop a Tooth on the ground (4 second cooldown per target). You can pick up this Tooth by moving over it, granting you a Dental Records stack. For each stack, you gain 3 lethality and flat magic penetration.","appNums":["25","2.5","4","4"],"wikiNums":["25","2.5","4","3"]},{"id":"chain-reaction","name":"Chain Reaction","app":"Upgrades a knockback: a displaced champion hitting another deals 100-400 and knocks up; hitting terrain deals 150-800 and stuns.","wiki":"Upgrades one of your champion's abilities that has a knock back effect, empowering the ability to trigger a chain reaction effect when displaced champions hit other champions or terrain within 200 units. If a knocked back champion collides with another enemy champion during their displacement, the champions they collided with are dealt 100 to 400 magic damage and knocked up for 0.5 seconds. If they collide with terrain during their displacement, they will rebound to take 150 to 800 magic damage and become knocked up for 0.75 seconds and stunned for 0.5 seconds. The knock up duration is increased to up to 1.1 seconds based on how long the ability's cooldown is. If the upgraded ability is an ultimate, this effect deals 250% damage, increasing the champion collision damage to 100*2.5 to 400*2.5 and the terrain collision damage to 150*2.5 to 800*2.5.","appNums":["100","400","150","800"],"wikiNums":["200","100","400","0.5","150","800","0.75","0.5","1.1","250","100","2.5","400","2.5","150","2.5","800","2.5"]},{"id":"ravenous-bind","name":"Ravenous Bind","app":"Upgrades an immobilizing or grounding ability: it deals 15-90 (+0.5% max health) magic damage and heals you 50-200.","wiki":"Upgrades one of your champion's abilities that has a immobilizing or grounding effect, empowering the ability to deal 15 to 90 (+ 10% AP) (+ 0.5% of your maximum health) magic damage to affected targets and heal you for 50 to 200 (+ 5% AP) (+ 10% bonus health). The heal is increased by up to 50% based on how long the ability's cooldown is.","appNums":["15","90","0.5","50","200"],"wikiNums":["15","90","10","0.5","50","200","5","10","50"]},{"id":"dimension-shift","name":"Dimension Shift","app":"A summoner spell becomes When the Darkness Comes: everything the light strikes is pulled into a 1200-unit Dark Realm, sealed off.","wiki":"Replace a summoner spell with When the Darkness Comes. When the Darkness Comes: The Dark Realm is a battlefield that exists outside of the normal realm in an alternate dimension. It exists only for units hit by the cosmic light. The realm includes any terrain features that would exist in the map of the normal realm, including structures, walls, and brushes. Units between realms see each other as glowing stars, considering each other dead and negating any interactions between each other. Only units that were hit by the light will enter the realm; other units cannot follow them. Everything that occurs inside the Dark Realm is hidden to units outside of it, and vice versa. Structures exist in all realms at the same time, but champions in the Dark Realm can only deal 1 damage to them per damage instance. Turrets will behave normally as if all units were in the same realm. Pets still inside the Dark Realm are killed at its end.","appNums":["1200"],"wikiNums":["1"]},{"id":"don-t-change-the-channel","name":"Don't Change the Channel","app":"Each second you channel an ability grants a 50-200 (+50% AD) (+25% AP) shield. It decays quickly once you stop channeling.","wiki":"For every second that you channel an ability, you gain a 50 to 200 (+ 50% AD) (+ 25% AP) (+ 10% bonus health) shield. The shield quickly decays once you stop channeling.","appNums":["50","200","50","25"],"wikiNums":["50","200","50","25","10"]},{"id":"bolstered","name":"Bolstered","app":"Upgrades an ability with a shield, increasing its shield strength by 0-60.","wiki":"Upgrades one of your champion's abilities that has a shield effect, increasing the strength of the ability's shield by key=%.","appNums":["0","60"],"wikiNums":[]},{"id":"shark-bait","name":"Shark Bait","app":"Lethal damage zombifies you 3.5s: invulnerable, can't act, slowing enemies 40%. Then a shark erupts for 80-300 and knocks up 1s.","wiki":"Upon taking fatal damage, you become a Shark Bait, causing you to enter a zombie state for 3.5 seconds, during which your movement speed is set to a static 400, you gain ghosting, and enemies within 400 units of you are slowed by 40%. At the end of the duration, a massive shark emerges from beneath you that lets out a powerful chomp (400 radius), dealing 120 to 350 (+ 30% of target's missing health) magic damage to all enemies within the area and knocking them up for 1 second. While under the zombie state, you are able to move and become invulnerable, untargetable, and immune to crowd control, but you are also rendered unable to declare basic attacks, cast abilities, use summoner spells, and activate items.","appNums":["3.5","40","80","300","1"],"wikiNums":["3.5","400","400","40","400","120","350","30","1"]},{"id":"lil-extra-help","name":"Lil' Extra Help","app":"Upgrades an attack-empowering ability: while active, gain 150 (melee 100) attack range and 75% (melee 40%) attack speed.","wiki":"Upgrades one of your champion's abilities that has an effect which empowers your basic attacks for a duration, further enhancing the attacks by granting you bonus attack range and {{as| bonus attack speed}} while the effect is active.","appNums":["150","100","75","40"],"wikiNums":[]},{"id":"mercy-s-strike","name":"Mercy's Strike","app":"Upgrades an ability: after casting, your next attack gains 300 range, 75% attack speed, and 3% max health bonus magic damage.","wiki":"Upgrades one of your champion's abilities, empowering the ability's cast to enhance your next basic attack. The enhanced attack has 300 bonus range, gains 75% bonus attack speed, and deals bonus magic damage equal to 3% (+ 2% per 10% heal and shield power) of the target's maximum health. If the target is a turret, the damage is modified to 2.5% of the target's maximum health bonus magic damage.","appNums":["300","75","3"],"wikiNums":["300","75","3","2","10","2.5"]},{"id":"spell-split","name":"Spell Split","app":"Upgrades a missile ability: on hit, at max range, or on recast it splits in two, firing opposite ways. Extra hits deal 30% damage.","wiki":"Upgrades one of your champion's abilities that has a missile, empowering the ability's missile to split in two over 0.25 seconds upon hitting an enemy, at maximum range, or when recast. Each of the split missiles fire perpendicularly in opposite directions and apply the same effects to enemies they hit. Subsequent missile hits from the same cast against the same enemy deal 30% damage. Recast can be used after 0.15 seconds of the initial cast.","appNums":["30"],"wikiNums":["0.25","30","0.15"]},{"id":"nature-is-healing","name":"Nature is Healing","app":"Heal yourself for 0.6 to 2.1 of your maximum health for each second that you are within brush.","wiki":"Upon entering a patch of brush, you are healed forover 1.5 seconds (20 second cooldown per brush patch).","appNums":["0.6","2.1"],"wikiNums":["1.5","20"]},{"id":"overextender","name":"Overextender","app":"Your Cannon Launcher launch is empowered: 12,000 more range, 50% more impact damage, and far greater travel speed.","wiki":"Your launch with the Cannon Launcher is now empowered, increasing the launch range by 12,000 units and the impact damage by 50%, as well as the travel speed by a significant amount. Additionally, your Recall is now functional and is upgraded to Empowered Recall. This augment is only available on the Butcher's Bridge map. Total launch range is 18,500 units, reduced to 16,500 after your team's Outer turret is destroyed. Increased impact damage is 120*1.5 to 460*1.5 magic damage.","appNums":["12","000","50"],"wikiNums":["12","000","50","18","500","16","500","120","1.5","460","1.5"]},{"id":"pat-on-the-back","name":"Pat On The Back","app":"Being within 200 of an ally grants a 50-150 shield and 30% move speed for 3s, stacking and refreshing on each pass. (9s)","wiki":"Whenever you are within 200 units of an allied champion, they pat you on the back, granting you a 50 to 150 (+ 25% bonus movement speed) shield and 30% bonus movement speed for 3 seconds (9 second cooldown). Subsequent passes only refresh the duration of the effects.","appNums":["200","50","150","30","3","9"],"wikiNums":["200","50","150","25","30","3","9"]},{"id":"porcupine","name":"Porcupine","app":"Damage from champions builds needles up to 400-3900. At max they burst in a 400 radius for 75-200 physical damage, slowing 30%.","wiki":"You build up a burst of needles from within you when taking damage from enemy champions, storing up to 400 to 3900 pre-mitigation damage taken. After reaching the maximum damage stored, you consume the stored damage to burst the needles outward in a 400 radius, dealing 75 to 200 (+ 125% bonus armor) (+ 125% bonus magic resistance) physical damage to enemies hit and slowing them by 30% for 2 seconds.","appNums":["400","3900","400","75","200","30"],"wikiNums":["400","3900","400","75","200","125","125","30","2"]},{"id":"pressure-cooker","name":"Pressure Cooker","app":"Burn enemies within 300 for 0.5% max health per second for 3s, stacking infinitely. Quest: deal burn damage to strengthen it.","wiki":"Surrounds you in flames, causing you to apply a Burn every second to enemy champions within 300 units for 3 seconds that deals magic damage equal toThis Burn stacks infinitely and refreshes with each application. Additionally, you are assigned with quests that require you to deal a certain amount of damage with the Burn effect against enemy champions. There are three quest tiers, and each completed tier grants you a reward that improves Pressure Cooker's effect.","appNums":["300","0.5","3"],"wikiNums":["300","3"]},{"id":"shark-tempest","name":"Shark Tempest","app":"Sharks circle your Mark for 50-100 damage and a 30% slow. On champion hit they circle that spot 3s, dealing 25-75 per second.","wiki":"Your Mark is empowered to circle sharks around it in a 300 radius, dealing 50 to 100 magic damage to enemies it passes through as it travels and slowing targets hit by 30% for 1 second. If the missile hits an enemy champion, the sharks circle around their location in a 425 radius instead for 3 seconds, dealingto enemies within the area and slowing them by 30% for 3 seconds. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","appNums":["50","100","30","3","25","75"],"wikiNums":["300","50","100","30","1","425","3","30","3"]},{"id":"ult-bot","name":"Ult Bot","app":"Your ability haste applies only to your ultimate. In return, ability haste is increased 150% and you gain 100 more.","wiki":"Your ability haste now only applies to the cooldown of your ultimate ability. In return, you gain 100 ability haste and your ability haste is 50% more effective.","appNums":["150","100"],"wikiNums":["100","50"]},{"id":"snowblast","name":"Snowblast","app":"Mark's dash deals 100% more damage and on arrival knocks up the target and knocks back nearby enemies. Mark gains 100 haste.","wiki":"Empowers the Dash spell from Mark to deal 100% increased damage and upon arrival cause you to knock up the target for 0.5 seconds and knock back nearby enemies. Additionally, your cooldown is reduced equivalent to 100 ability haste. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","appNums":["100","100"],"wikiNums":["100","0.5","100"]},{"id":"squishy-slappy-grab","name":"Squishy Slappy Grab","app":"With an enemy within 450, after 1.5s you tether enemies within 800 for 4s. Your next attack pulls them in, stunning 0.25s. (45s)","wiki":"When an enemy champion is within 450 units of you, after a 1.5-second delay, you send out Squishy Slappy Hands that latch onto all nearby enemy champions within 800 units, forming a tether between yourself and each target for 4 seconds (35 second cooldown). While the tethers persist (950 tether radius), your next basic attack is empowered to pull all tethered enemies toward you, dealing 30 to 100 (+ 10% bonus health) magic damage to affected targets and stunning them for 0.25 seconds after the pull ends. Targets are pulled over 450 units, reduced to 350 for those farther away from you. Additionally, you gain a 35 to 150 (+ 50% bonus armor) (+ 50% bonus magic resistance) shield for each pulled enemy.","appNums":["450","1.5","800","4","0.25","45"],"wikiNums":["450","1.5","800","4","35","950","30","100","10","0.25","450","350","35","150","50","50"]},{"id":"surge-field","name":"Surge Field","app":"Your ultimate spawns a 300-radius zone for 6s. Inside you gain 50 ability haste, 40% move speed, and reflect 20% of your damage.","wiki":"Upon casting your ultimate ability, you spawn a surge zone beneath you that has a 300 radius. While you are within the zone, you gain 50 ability haste and 40% bonus movement speed, and your damage dealt to enemy champions fires missiles at them that deal 20% of the triggering damage instance pre-mitigation as bonus magic damage. The missile effect cannot trigger from itself. The zone lasts indefinitely as long as you stay within its radius. If you leave the zone's radius for the first time, it moves to your current location. Exiting the zone a second time causes it to disappear if you do not re-enter the area within 1.25 seconds.","appNums":["300","6","50","40","20"],"wikiNums":["300","50","40","20","1.25"]},{"id":"stay-resolute","name":"Stay Resolute","app":"Upgrades an ability: damaging a champion grants 4-12 armor or MR matching their adaptive type, stacking. (5s per target)","wiki":"Upgrades one of your champion's abilities, empowering the ability to grant you 1 to 3 for 3 bonus armor or bonus magic resistance permanently when it damages an enemy champion, stacking infinitely (5 second cooldown per target per cast instance). The resistance type granted is based on the target's adaptive type: bonus armor for physical and bonus magic resistance for magic. If this is not your first augment, gain 20 bonus armor and bonus magic resistance.","appNums":["4","12","5"],"wikiNums":["1","3","3","5","20"]},{"id":"void-dash","name":"Void Dash","app":"Upgrades a dash: 0.3s after arriving a 250-radius void zone deals 80-400 (+100% ability haste) magic damage and slows 35% for 1s.","wiki":"Upgrades one of your champion's abilities that has a dash, empowering the ability to spawn a void zone (250 radius) at the dash's destination after a 0.3-second delay. Enemy champions within the zone are dealt 80 to 400 (+ 100% ability haste) magic damage and are slowed by 35% for 1 second. This augment is currently disabled.","appNums":["0.3","250","80","400","100","35","1"],"wikiNums":["250","0.3","80","400","100","35","1"]},{"id":"adaptive-ward","name":"Adaptive Ward","app":"Upgrades an ability: hitting a champion grants 5-10 armor or MR for 6s, matching their adaptive type. Stacks. (4s cooldown)","wiki":"Upgrades one of your champion's abilities, empowering the ability to grant you 7 to 12 bonus armor or bonus magic resistance for 6 seconds when it hits an enemy champion (4 second cooldown). This effect can stack up to a number of times. The resistance type granted is based on the target's adaptive type: bonus armor for physical and bonus magic resistance for magic.","appNums":["5","10","6","4"],"wikiNums":["7","12","6","4"]},{"id":"pursuit-of-power","name":"Pursuit of Power","app":"Quest: hit an enemy champion with a chosen ability 10 times. Reward: that ability deals 30% more damage.","wiki":"Quest: Hit an enemy champion with a specific ability 10 times (counts up to 1 hit per champion per cast instance). Reward: Upon completing your Quest, increase the damage of the ability by 30%.","appNums":["10","30"],"wikiNums":["10","1","30"]},{"id":"endless-decimation","name":"Endless Decimation","app":"Wind up 1.25s, then slash a 460 radius for 100-400 physical damage (50% inside 240). Edge hits heal 15% missing health. (8s)","wiki":"While in combat, automatically cast an improved version of, winding up over 1.25 seconds to slash in a icononly=true 460 radius around you. The slash deals 100 to 400 (+ 60% AD) (+ 40% AP) physical damage to enemies within the area (8 second cooldown). Enemies within the icononly=true 240 inner radius of the slash takeAdditionally, for each enemy champion hit along the outer edge, you heal for 18% of your missing health and the cooldown of this effect is reduced by 10%, down to a minimum of 3 seconds.","appNums":["1.25","460","100","400","50","240","15","8"],"wikiNums":["1.25","460","100","400","60","40","8","240","18","10","3"]},{"id":"upgrade-death-s-dance","name":"Upgrade Death's Dance","app":"Upgrades Death's Dance: 40% of damage taken is dealt over 3s, and takedowns instantly heal for 125% bonus AD. Gain 250 gold.","wiki":"Upgrades Death's Dance, empowering with an increased damage reduction of and with an increased heal AD ratio of 125% bonus AD. healing is also granted instantly upon the passive effect being triggered rather than over 2 seconds. Additionally, gain.","appNums":["40","3","125","250"],"wikiNums":["125","2"]},{"id":"upgrade-ravenous-hydra","name":"Upgrade Ravenous Hydra","app":"Hitting an enemy champion with an ability triggers Cleave. Ravenous Hydra gains 18% life steal. Gain 500 gold.","wiki":"Upgrades Ravenous Hydra, increasing its life steal stat to 20% and empowering to trigger its effect on ability hits against enemies (1 second cooldown per ability). Additionally, gain.","appNums":["18","500"],"wikiNums":["20","1"]},{"id":"upgrade-sundered-sky","name":"Upgrade Sundered Sky","app":"Sundered Sky's per-target cooldown drops to 5 seconds and it heals you for 9% of your missing health. Gain 500 gold.","wiki":"Upgrades Sundered Sky, empowering with an increased heal health ratio of 9% of your missing health and a reduced cooldown of 5 seconds. Additionally, gain.","appNums":["5","9","500"],"wikiNums":["9","5"]}];

// 앱의 augmentImageUrl(iconPath,'large')과 동일
function iconUrl(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/game' + s.replace(/_small(\.\w+)$/i, '_large$1');
}
// 라이엇 컬러 원본은 접미사 없는 베이스 파일에 있다 — 앱과 동일
function iconUrlBase(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/game' + s.replace(/_small(\.\w+)$/i, '$1');
}
// large·base 자산이 없는 신규(Kiwi) 아이콘용 small 폴백 — 앱과 동일
function iconUrlSmall(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/plugins/rcp-be-lol-game-data/global/default' + s;
}
const RNAME = { silver: '실버', gold: '골드', prismatic: '프리즘' };
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// 등급·모드는 단일 선택, 표시 플래그만 다중 토글.
// 칼바람+클래식 동시 선택은 사실상 "양쪽 공유"라 별도 항목으로 뺐다 — 토글 두 개를 켜서
// 교집합을 만들게 하는 것보다 그렇게 이름 붙여 두는 편이 무엇을 보는지 분명하다.
let rarity = 'all', mode = 'all', query = '';
const flags = { shared: false, isNew: false, noCoef: false };

function render() {
  const out = document.getElementById('out');
  let items = DATA.filter((a) => {
    if (rarity !== 'all' && a.rarity !== rarity) return false;
    if (mode === 'aram' && !a.modes.includes('aram')) return false;
    if (mode === 'classic' && !a.modes.includes('classic')) return false;
    if (mode === 'both' && a.modes.length < 2) return false;
    if (mode === 'none' && a.modes.length) return false;
    if (flags.shared && !a.shared) return false;
    if (flags.isNew && !a.isNew) return false;
    if (flags.noCoef && !a.noCoef) return false;
    if (query) {
      const q = query.toLowerCase();
      const hay = (a.ko + ' ' + a.en + ' ' + a.id + ' ' + a.descKo + ' ' + a.descEn).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').innerHTML = '<b>' + items.length + '</b> / ' + DATA.length + '개';
  const order = { silver: 0, gold: 1, prismatic: 2 };
  const groups = {};
  for (const a of items) (groups[a.rarity] ??= []).push(a);
  out.innerHTML = '';
  const keys = Object.keys(groups).sort((x, y) => order[x] - order[y]);
  if (!keys.length) { out.innerHTML = '<div class="empty">결과 없음</div>'; return; }
  for (const k of keys) {
    const list = groups[k].sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
    const h = document.createElement('div');
    h.className = 'group-title';
    h.innerHTML = '<span class="rb ' + k + '">' + RNAME[k] + '</span> ' + list.length + '개';
    out.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const a of list) {
      const card = document.createElement('div');
      card.className = 'card' + (a.shared ? ' shared' : '') + (a.isNew ? ' isnew' : '');
      const img = document.createElement('img');
      img.className = 'icon';
      img.loading = 'lazy';
      img.src = iconUrl(a.iconPath);
      img.alt = a.ko;
      img.onerror = () => {
        const st = img.dataset.step || '0';
        if (st === '0') { img.dataset.step = '1'; img.src = iconUrlBase(a.iconPath); return; }
        if (st === '1') { img.dataset.step = '2'; img.src = iconUrlSmall(a.iconPath); return; }
        img.replaceWith(Object.assign(document.createElement('div'),
          { className: 'icon err', textContent: 'no img' }));
      };
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = '<div class="ko">' + esc(a.ko) + '</div>' +
        '<div class="en">' + esc(a.en) + '</div>' +
        '<div class="badges"><span class="rb ' + a.rarity + '">' + RNAME[a.rarity] + '</span>' +
        (a.modes.includes('aram') ? '<span class="mb aram">칼바람</span>' : '') +
        (a.modes.includes('classic') ? '<span class="mb classic">클래식</span>' : '') +
        (a.modes.length === 0 ? '<span class="mb none">미출시</span>' : '') +
        (a.isNew ? '<span class="nb">신규</span>' : '') +
        (a.noCoef ? '<span class="cb">수치 미확인</span>' : '') +
        (a.disabled ? '<span class="db">비활성</span>' : '') +
        (a.shared ? '<span class="sb">공유</span>' : '') + '</div>' +
        '<div class="desc">' + esc(a.descKo) + '</div>' +
        '<div class="descEn">' + esc(a.descEn) + '</div>' +
        '<div class="iconpath">' + esc(a.iconPath.replace(/.*\//, '')) + '</div>';
      card.appendChild(img);
      card.appendChild(meta);
      grid.appendChild(card);
    }
    out.appendChild(grid);
  }
}

document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });

// 단일 선택 그룹(등급·모드)
document.querySelectorAll('.chip[data-g]').forEach((c) =>
  c.addEventListener('click', () => {
    const g = c.dataset.g;
    document.querySelectorAll('.chip[data-g="' + g + '"]').forEach((x) => x.classList.remove('active'));
    c.classList.add('active');
    if (g === 'rarity') rarity = c.dataset.v;
    else mode = c.dataset.v;
    render();
  }),
);

// 다중 토글(표시)
document.querySelectorAll('.chip[data-t]').forEach((c) =>
  c.addEventListener('click', () => {
    const k = c.dataset.t;
    flags[k] = !flags[k];
    c.classList.toggle('active', flags[k]);
    render();
  }),
);

document.getElementById('reset').addEventListener('click', () => {
  rarity = 'all';
  mode = 'all';
  for (const k of Object.keys(flags)) flags[k] = false;
  query = '';
  document.getElementById('q').value = '';
  document.querySelectorAll('.chip[data-t]').forEach((x) => x.classList.remove('active'));
  for (const g of ['rarity', 'mode']) {
    document.querySelectorAll('.chip[data-g="' + g + '"]').forEach((x) =>
      x.classList.toggle('active', x.dataset.v === 'all'),
    );
  }
  render();
});

// 앱 설명과 위키 수치가 엇갈리는 건들. 대개 서술 상세도 차이라 자동 반영하지 않고
// 여기 모아만 둔다 — 실제 패치 변경인지 눈으로 가려 다음 커밋에서 정리한다.
if (NUMBER_DIFFS.length) {
  const d = document.createElement('details');
  d.className = 'review';
  const rows = NUMBER_DIFFS.map((r) =>
    '<tr><td class="n">' + esc(r.name) + '</td>' +
    '<td class="a"><b>앱</b> ' + esc(r.app) + '<br><b>위키</b> <span class="w">' + esc(r.wiki) + '</span></td></tr>'
  ).join('');
  d.innerHTML = '<summary>앱 · 위키 수치가 다른 ' + NUMBER_DIFFS.length +
    '건 — 확인 필요 (자동 반영하지 않음)</summary><table>' + rows + '</table>';
  document.body.appendChild(d);
}
render();
</script>
</body>
</html>
