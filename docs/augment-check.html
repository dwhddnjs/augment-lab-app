<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>증강 검수 — 199개</title>
<style>
  :root {
    --bg: #0d1311; --surface: #131b18; --raised: #1a2420; --border: #25322d;
    --text: #e8f0ec; --text2: #9bb0a8; --text3: #6c7f78;
    --mint: #1ED7A0; --silver: #b9c4cc; --gold: #e8c45f; --prism: #c98bff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,19,17,.92);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .stats { color: var(--text2); font-size: 13px; }
  .stats b { color: var(--text); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  input[type=search] { background: var(--raised); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 8px 12px; font-size: 14px; min-width: 220px; outline: none; }
  input[type=search]:focus { border-color: var(--mint); }
  .chip { background: var(--raised); border: 1px solid var(--border); color: var(--text2);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; user-select: none; }
  .chip.active { background: var(--mint); color: #06231b; border-color: var(--mint); font-weight: 600; }
  .chip.toggle.active { background: #4a2f2f; color: #ffd9d9; border-color: #7a4a4a; }
  main { padding: 20px 24px 60px; }
  .group-title { margin: 24px 0 12px; font-size: 15px; color: var(--text2); display: flex; gap: 8px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .card.shared { border-color: #6a4a2a; }
  .icon { width: 56px; height: 56px; border-radius: 9px; flex: 0 0 56px; background: var(--raised);
    object-fit: contain; }
  .icon.err { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text3); }
  .meta { min-width: 0; flex: 1; }
  .ko { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 13px; color: var(--text); line-height: 1.45; margin-top: 8px; white-space: pre-wrap; }
  .descEn { font-size: 12px; color: var(--text2); line-height: 1.4; margin-top: 5px; white-space: pre-wrap; }
  .badges { display: flex; gap: 6px; margin-top: 8px; }
  .rb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
  .rb.silver { background: rgba(185,196,204,.15); color: var(--silver); }
  .rb.gold { background: rgba(232,196,95,.15); color: var(--gold); }
  .rb.prismatic { background: rgba(201,139,255,.15); color: var(--prism); }
  .sb { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: rgba(232,150,80,.15); color: #e89650; }
  .empty { color: var(--text3); padding: 40px; text-align: center; }
  .iconpath { font-size: 10px; color: var(--text3); margin-top: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>증강 데이터·아이콘 검수</h1>
  <div class="stats">
    총 <b>199</b>개 ·
    <span style="color:var(--silver)">실버 63</span> ·
    <span style="color:var(--gold)">골드 70</span> ·
    <span style="color:var(--prism)">프리즘 66</span> ·
    아이콘 공유 <b style="color:#e89650">16</b>개
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="한글·영문 이름 검색…" autocomplete="off" />
    <span class="chip active" data-r="all">전체</span>
    <span class="chip" data-r="silver">실버</span>
    <span class="chip" data-r="gold">골드</span>
    <span class="chip" data-r="prismatic">프리즘</span>
    <span class="chip toggle" id="sharedOnly">공유 아이콘만</span>
  </div>
</header>
<main id="out"></main>

<script>
const DATA = [{"id":"adapt","ko":"적응형 능력치","en":"ADAPt","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/ADAPt_small.png","descKo":"추가 공격력을 모두 주문력으로 전환하고, 주문력이 추가로 증가합니다.","descEn":"Converts all of your bonus attack damage into ability power, and additionally increases your ability power.","shared":false},{"id":"adamant","ko":"단호함","en":"Adamant","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Adamant_small.png","descKo":"적을 이동 불가 상태로 만들거나 이동 스킬을 봉인할 때마다 방어력과 마법 저항력을 얻습니다. 여러 번 중첩됩니다.","descEn":"Immobilizing or grounding an enemy grants bonus armor and magic resistance, stacking several times.","shared":false},{"id":"blunt-force","ko":"육중한 힘","en":"Blunt Force","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/BluntForce_small.png","descKo":"공격력이 증가합니다.","descEn":"Increases your attack damage.","shared":false},{"id":"buff-buddies","ko":"쌍버프","en":"Buff Buddies","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/BuffBuddies_small.png","descKo":"잉걸불 문장과 통찰력의 문장을 영구히 얻습니다. 기본 공격이 적을 둔화시키고 화상 피해를 입히며, 스킬 가속과 마나·기력 재생을 얻습니다.","descEn":"Permanently gain the Crest of Cinders and Crest of Insight. Your basic attacks slow and burn enemies, and you gain ability haste plus mana/energy regeneration.","shared":false},{"id":"deft","ko":"능수능란","en":"Deft","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Deft_small.png","descKo":"공격 속도를 얻습니다.","descEn":"Grants bonus attack speed.","shared":false},{"id":"dive-bomber","ko":"폭격기","en":"Dive Bomber","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/DiveBomber_small.png","descKo":"사망 시 폭발해 주변 적에게 대상 최대 체력에 비례하는 고정 피해를 입힙니다.","descEn":"On death, you explode, dealing true damage to nearby enemies based on their maximum health.","shared":false},{"id":"don-t-blink","ko":"속전속결","en":"Don't Blink","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/DontBlink_small.png","descKo":"대상보다 이동 속도가 빠를수록 입히는 피해량이 증가합니다.","descEn":"Deal increased damage scaling with how much faster your movement speed is than the target.","shared":false},{"id":"erosion","ko":"부식","en":"Erosion","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Erosion_small.png","descKo":"적에게 피해를 입히면 잠시 대상의 방어력과 마법 저항력을 깎습니다. 여러 번 중첩됩니다.","descEn":"Damaging an enemy briefly reduces their armor and magic resistance, stacking several times.","shared":false},{"id":"escape-plan","ko":"도주 계획","en":"Escape Plan","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/EscapePlan_small.png","descKo":"체력이 낮아지면 막대한 보호막과 이동 속도를 얻고 크기가 작아집니다. 이 효과는 시간이 지나며 사라집니다. (재사용 대기시간 있음)","descEn":"When your health drops low, gain a large shield, bonus movement speed, and reduced size. These effects decay over time. (Has a cooldown)","shared":false},{"id":"first-aid-kit","ko":"응급처치 키트","en":"First-Aid Kit","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/FirstAidKit_small.png","descKo":"체력 회복 및 보호막 효과가 증가합니다.","descEn":"Increases your heal and shield power.","shared":false},{"id":"flashbang","ko":"점멸탄","en":"Flashbang","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Flashbang_small.png","descKo":"점멸 사용 시 도착 지점에 폭발을 일으켜 주변 적에게 마법 피해를 입히고 둔화시킵니다. 또한 사망 시 점멸이 초기화됩니다.","descEn":"Using Flash creates an explosion that deals magic damage and slows nearby enemies. Your Flash also resets on death.","shared":false},{"id":"frost-wraith","ko":"서리 망령","en":"Frost Wraith","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/FrostWraith_small.png","descKo":"주기적으로 주변에 냉기 파동을 자동 발산해 적을 잠시 속박합니다.","descEn":"Periodically releases a frost pulse around you, rooting nearby enemies for a short duration.","shared":false},{"id":"goredrink","ko":"선혈포식","en":"Goredrink","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/GoreDrink_small.png","descKo":"모든 피해 흡혈을 얻습니다.","descEn":"Grants omnivamp (healing from all damage dealt).","shared":false},{"id":"guilty-pleasure","ko":"죄책감의 쾌락","en":"Guilty Pleasure","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/GuiltyPleasure_small.png","descKo":"적 챔피언을 이동 불가 상태로 만들거나 이동 스킬을 봉인하면 체력을 회복합니다.","descEn":"Immobilizing or grounding an enemy champion heals you.","shared":false},{"id":"hat-on-a-hat","ko":"모자 겹쳐쓰기","en":"Hat on a Hat","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/HatonaHat_small.png","descKo":"인벤토리의 모자·머리 착용 아이템 1개당 주문력과 마법 저항력을 얻습니다.","descEn":"Gain ability power and bonus magic resistance for each hat or headwear item in your inventory.","shared":false},{"id":"heavy-hitter","ko":"강타자","en":"Heavy Hitter","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/HeavyHitter_small.png","descKo":"기본 공격 시 대상 최대 체력에 비례하는 추가 물리 피해를 입힙니다.","descEn":"Basic attacks deal bonus physical damage based on the target’s maximum health.","shared":false},{"id":"homeguard","ko":"민병대","en":"Homeguard","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Homeguard_small.png","descKo":"이동 속도가 크게 증가합니다. 단, 챔피언에게 피해를 입은 직후 잠시 효과가 사라집니다.","descEn":"Gain greatly increased movement speed, lost for a few seconds after taking damage from champions.","shared":false},{"id":"ice-cold","ko":"차가운 냉기","en":"Ice Cold","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/IceCold_small.png","descKo":"둔화 효과가 적의 이동 속도를 추가로 더 많이 감소시킵니다.","descEn":"Your slows reduce enemy movement speed by an additional amount.","shared":false},{"id":"infernal-soul","ko":"지옥불 영혼","en":"Infernal Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/InfernalSoul_small.png","descKo":"지옥불 드래곤의 영혼을 얻습니다. 적을 공격할 때마다 주변에 추가 피해를 입힙니다. (이미 보유 시 다른 영혼 획득)","descEn":"Grants the Infernal Dragon Soul, dealing bonus area damage when you attack enemies. (Or a different Soul if already owned)","shared":true},{"id":"leg-day","ko":"하체 운동의 날","en":"Leg Day","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/LegDay_small.png","descKo":"이동 속도와 둔화 저항을 얻습니다.","descEn":"Grants bonus movement speed and slow resistance.","shared":false},{"id":"light-em-up","ko":"불을 밝혀","en":"Light 'em Up!","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/LightEmUp_small.png","descKo":"기본 공격이 중첩되어 네 번째 공격마다 폭죽을 발사해 추가 마법 피해를 입힙니다.","descEn":"Every fourth basic attack launches firecrackers that deal bonus magic damage.","shared":false},{"id":"mountain-soul","ko":"대지의 영혼","en":"Mountain Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/MountainSoul_small.png","descKo":"대지 드래곤의 영혼을 얻습니다. 전투에서 벗어나면 보호막을 얻습니다. (이미 보유 시 다른 영혼 획득)","descEn":"Grants the Mountain Dragon Soul, gaining a shield while out of combat. (Or a different Soul if already owned)","shared":false},{"id":"mighty-shield","ko":"강력한 방패","en":"Mighty Shield","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/MightyShield_small.png","descKo":"보호막을 얻을 때마다 잠시 적응형 능력치를 얻습니다. (재사용 대기시간 있음)","descEn":"Gaining a shield grants you adaptive force for a short duration. (Has a cooldown)","shared":false},{"id":"mind-to-matter","ko":"정신 변환","en":"Mind to Matter","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/MindToMatter_small.png","descKo":"최대 마나의 절반만큼 최대 체력을 얻습니다.","descEn":"Grants bonus health equal to half of your maximum mana.","shared":false},{"id":"ocean-soul","ko":"바다의 영혼","en":"Ocean Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/OceanSoul_small.png","descKo":"바다 드래곤의 영혼을 얻습니다. 적에게 피해를 입힌 후 높은 체력·마나 재생을 얻습니다. (이미 보유 시 다른 영혼 획득)","descEn":"Grants the Ocean Dragon Soul, gaining strong he ,"rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Stats_small.png","descKo":"능력치 모루를 2개 획득합니다.","descEn":"Gain 2 Stat Bonus Anvils.","shared":false},{"id":"stats-on-stats","ko":"능력치 더하기 능력치!","en":"Stats on Stats!","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/StatsOnStats_small.png","descKo":"능력치 모루를 3개 획득합니다. (골드·프리즘 모루 확률 증가)","descEn":"Gain 3 Stat Bonus Anvils, with a higher chance for Gold and Prismatic anvils.","shared":false},{"id":"stats-on-stats-on-stats","ko":"능력치 더하기 능력치 더하기 능력치!","en":"Stats on Stats on Stats!","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/StatsOnStatsOnStats_small.png","descKo":"능력치 모루를 4개 획득합니다. (골드·프리즘 모루 확률 증가, 다음 증강 선택 시 슬롯당 재추첨 1회 추가)","descEn":"Gain 4 Stat Bonus Anvils (higher chance for Gold/Prismatic) and an extra reroll per slot next selection.","shared":false},{"id":"stuck-in-here-with-me","ko":"도망갈 수 없어","en":"Stuck in Here With Me","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/StuckInHereWithMe_small.png","descKo":"궁극기를 사용하면 주변에 점점 커지는 오라를 펼친 뒤 안의 적을 도발하고, 자신은 피해 감소를 얻습니다. (재사용 대기시간 있음)","descEn":"Casting your ultimate creates a growing aura that taunts enemies inside and grants you damage reduction. (Has a cooldown)","shared":false},{"id":"twin-fire","ko":"쌍둥이 불꽃","en":"Twin Fire","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/TwinFire_small.png","descKo":"스킬로 피해를 입히면 폭죽을 발사해 추가 마법 피해를 입힙니다. 또한 치명타 확률을 얻습니다.","descEn":"Damaging abilities launch firecrackers for bonus magic damage. Also grants critical strike chance.","shared":false},{"id":"upgrade-thornmail","ko":"가시 갑옷 업그레이드","en":"Upgrade Thornmail","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeCollector_small.png","descKo":"가시 갑옷·덤불 조끼를 강화합니다. 전투에서 벗어나면 다음 적의 기본 공격에 큰 피해를 반사하는 껍질을 생성합니다.","descEn":"Upgrades Thornmail/Bramble Vest: out of combat, form a shell that reflects heavy damage to the next enemy basic attack.","shared":true},{"id":"void-rift","ko":"공허 균열","en":"Void Rift","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/VoidRift_small.png","descKo":"스킬로 적 챔피언에게 피해를 입히면 공허 상흔이 생깁니다. 가까이에 상흔이 두 개 생기면 둘이 사라지며 그 사이에 균열이 열려 안의 적에게 마법 피해를 입히고 둔화시킵니다.","descEn":"Ability hits leave Void Scars; two nearby scars collapse into a rift that deals magic damage and slows enemies within.","shared":false},{"id":"weighted-popoffs","ko":"중량 폭주","en":"Weighted Popoffs","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/WeightedPopoffs_small.png","descKo":"스킬로 적 챔피언을 맞히면 중첩을 얻어 기본 스킬의 재사용 대기시간 진행이 빨라집니다. 최대 중첩 시 효과가 2배가 됩니다.","descEn":"Hitting enemy champions with abilities stacks faster basic-ability cooldown recovery, doubled at max stacks.","shared":false},{"id":"zealot","ko":"광신자","en":"Zealot","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Zealot_small.png","descKo":"치명타 확률과 공격 속도를 얻습니다. (주문력에 비례해 증가)","descEn":"Grants critical strike chance and bonus attack speed, scaling with ability power.","shared":false},{"id":"hand-of-baron","ko":"남작의 도움","en":"Hand of Baron","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/HandofBaron_small.png","descKo":"적응형 능력치를 얻고, 주변 아군 미니언이 크게 강화됩니다.","descEn":"Gain adaptive force and greatly empower nearby allied minions.","shared":false},{"id":"upgrade-sword-of-blossoming-dawn","ko":"꽃피는 새벽의 검 업그레이드","en":"Upgrade Sword of Blossoming Dawn","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeMikaelsBlessing_small.png","descKo":"꽃피는 새벽의 검을 강화합니다. 페퍼민트 효과의 회복량이 크게 증가하고, 공격 속도를 얻습니다.","descEn":"Upgrades Sword of Blossoming Dawn: greatly increases Peppermint’s healing and grants bonus attack speed.","shared":true}];
const CDRAGON = 'https://raw.communitydragon.org/latest';
// 앱의 augmentImageUrl(iconPath,'large')과 동일
function iconUrl(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/game' + s.replace(/_small(\.\w+)$/i, '_large$1');
}
const RNAME = { silver: '실버', gold: '골드', prismatic: '프리즘' };
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let rarity = 'all', sharedOnly = false, query = '';

function render() {
  const out = document.getElementById('out');
  let items = DATA.filter((a) => {
    if (rarity !== 'all' && a.rarity !== rarity) return false;
    if (sharedOnly && !a.shared) return false;
    if (query) {
      const q = query.toLowerCase();
      const hay = (a.ko + ' ' + a.en + ' ' + a.id + ' ' + a.descKo + ' ' + a.descEn).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const order = { silver: 0, gold: 1, prismatic: 2 };
  const groups = {};
  for (const a of items) (groups[a.rarity] ??= []).push(a);
  out.innerHTML = '';
  const keys = Object.keys(groups).sort((x, y) => order[x] - order[y]);
  if (!keys.length) { out.innerHTML = '<div class="empty">결과 없음</div>'; return; }
  for (const k of keys) {
    const list = groups[k].sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
    const h = document.createElement('div');
    h.className = 'group-title';
    h.innerHTML = '<span class="rb ' + k + '">' + RNAME[k] + '</span> ' + list.length + '개';
    out.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const a of list) {
      const card = document.createElement('div');
      card.className = 'card' + (a.shared ? ' shared' : '');
      const img = document.createElement('img');
      img.className = 'icon';
      img.loading = 'lazy';
      img.src = iconUrl(a.iconPath);
      img.alt = a.ko;
      img.onerror = () => { img.replaceWith(Object.assign(document.createElement('div'),
        { className: 'icon err', textContent: 'no img' })); };
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = '<div class="ko">' + esc(a.ko) + '</div>' +
        '<div class="en">' + esc(a.en) + '</div>' +
        '<div class="badges"><span class="rb ' + a.rarity + '">' + RNAME[a.rarity] + '</span>' +
        (a.shared ? '<span class="sb">공유</span>' : '') + '</div>' +
        '<div class="desc">' + esc(a.descKo) + '</div>' +
        '<div class="descEn">' + esc(a.descEn) + '</div>' +
        '<div class="iconpath">' + esc(a.iconPath.replace(/.*\//, '')) + '</div>';
      card.appendChild(img);
      card.appendChild(meta);
      grid.appendChild(card);
    }
    out.appendChild(grid);
  }
}

document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
document.querySelectorAll('.chip[data-r]').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-r]').forEach((x) => x.classList.remove('active'));
  c.classList.add('active'); rarity = c.dataset.r; render();
}));
document.getElementById('sharedOnly').addEventListener('click', (e) => {
  sharedOnly = !sharedOnly; e.target.classList.toggle('active', sharedOnly); render();
});
render();
</script>
