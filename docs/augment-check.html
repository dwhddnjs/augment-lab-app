Icons/TransmuteChaos_small.png","descKo":"무작위 증강 2개를 획득합니다.","descEn":"Gain 2 random Augments.","shared":false},{"id":"ultimate-awakening","ko":"궁극의 각성","en":"Ultimate Awakening","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/ZeroHour_small.png","descKo":"궁극기 가속을 30 얻습니다. 궁극기 사용 시 모든 기본 스킬이 초기화되고 15초 동안 기본 스킬 가속을 300 얻습니다. (재사용 대기시간 20초)","descEn":"Casting your ultimate ability resets the cooldowns of all your basic abilities and grants you 300 basic ability haste for 15 seconds (20 second cooldown). Additionally, gain 30 ultimate haste.","shared":false},{"id":"ultimate-revolution","ko":"궁극기 대변혁","en":"Ultimate Revolution","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/UltimateRevolution_small.png","descKo":"라운드마다 한 번 궁극기를 사용한 다음 초기화합니다.","descEn":"Once per round, refresh your Ultimate after casting it.","shared":false},{"id":"windspeaker-s-blessing","ko":"바람전달자의 축복","en":"Windspeaker's Blessing","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/WindspeakersBlessing_small.png","descKo":"자신이나 아군에게 회복·보호막을 부여하면 대상에게 3초 동안 방어력과 마법 저항력을 30~60 부여합니다.","descEn":"Your or allies' heals and shields on yourself, or your heals and shields on allies, grant the target 30 to 60 bonus armor and bonus magic resistance for 3 seconds.","shared":false},{"id":"earthwake","ko":"대지의 각성","en":"Earthwake","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Earthwake_small.png","descKo":"돌진, 점멸, 순간이동 스킬이 1초 후에 폭발하는 흔적을 남깁니다.","descEn":"Your dash, blink, or teleport Abilities leave behind a trail that detonates after 1 second.","shared":false},{"id":"pandora-s-box","ko":"판도라의 상자","en":"Pandora's Box","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Pandoras_Box_Small.png","descKo":"모든 증강을 무작위 프리즘 증강으로 전환합니다.","descEn":"Transmute all of your augments into random Prismatic Augments.","shared":false},{"id":"slap-around","ko":"우당탕탕","en":"Slap Around","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/SlapAround_small.png","descKo":"적을 이동 불가 상태로 만들거나 이동 스킬을 사용할 수 없게 하면 해당 라운드에 15의 적응형 능력치를 얻습니다.","descEn":"Each time you Immobilize or Ground an enemy, gain 15 Adaptive Force for the round.","shared":false},{"id":"hextech-soul","ko":"마법공학의 영혼","en":"Hextech Soul","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/InfernalSoul_small.png","descKo":"스킬 또는 기본 공격으로 적을 공격할 때마다 추가 피해를 입히는 화염의 드래곤 영혼을 얻습니다.","descEn":"You gain the Infernal Dragon Soul, dealing bonus damage when you hit enemies with Abilities or Attacks.","shared":true},{"id":"infinite-recursion","ko":"무한 반복","en":"Infinite Recursion","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/InfiniteRecursion_small.png","descKo":"스킬 가속을 60 얻고, 처치 관여마다 스킬 가속이 3씩 추가로 증가합니다.","descEn":"Gain 60 ability haste, increased by 3 each time you score a champion takedown.","shared":false},{"id":"crit-n-cast","ko":"치명적 가속","en":"Crit 'n Cast","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/CritnCast_small.png","descKo":"치명타 확률의 40%에 해당하는 스킬 가속을 얻습니다.","descEn":"Gain ability haste equal to 40% of your critical strike chance.","shared":false},{"id":"critical-missile","ko":"치명적 미사일","en":"Critical Missile","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/CriticalMissile_small.png","descKo":"적 챔피언에게 치명타 적중 시 1발(+ 치명타 확률 33.33%당 1발)의 폭죽을 발사해 각 20~100의 마법 피해를 입힙니다. 또한 치명타 확률을 25% 얻습니다.","descEn":"Critical strikes against enemy champions launch 1 (+ 1 per 33.33% critical strike chance) missiles at the target that each deal 20 to 100 magic damage. Additionally, gain 25% critical strike chance.","shared":false},{"id":"devil-on-your-shoulder","ko":"어깨 위의 악마","en":"Devil on Your Shoulder","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/LittleDevil_small.png","descKo":"작은 악마와 계약합니다. 매초 현재 체력의 0.5%(1000 범위 내 적 챔피언이 있으면 5%)를 잃지만, 추가 고정 피해를 20% 입히고 기본 공격·스킬이 5초 동안 생명력 파편을 남깁니다. 파편을 주우면 50~150(+ 추가 공격력의 50%)(+ 주문력의 25%)를 회복하고 이동 속도를 15% 얻습니다.","descEn":"Forge a pact with Little Devil, who drains 0.5% of your current health every second, increased to 5% if there are enemy champions within 1000 units. In return, you deal 20% bonus true damage and your basic attacks and abilities summon a Life Remnant nearby for 5 seconds (0.75-second spawn cooldown). You can absorb a Life Remnant by moving over it, healing you for 50 to 150 (+ 50% bonus AD) (+ 25% AP) and granting you 15% bonus movement speed.\n\nThis augment is currently disabled.","shared":false},{"id":"donation","ko":"후원","en":"Donation","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Donation_small.png","descKo":"획득 즉시 1750골드를 받습니다.","descEn":"Gain 1750 upon acquiring this augment.","shared":false},{"id":"double-tap","ko":"한 발에 두 놈","en":"Double Tap","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/DoubleTap_small.png","descKo":"치명타가 적용된 기본 공격이 적중 효과(온히트)를 한 번 더 적용합니다. 또한 치명타 확률을 25% 얻습니다.","descEn":"Basic attacks that critically strike apply on-hit effects an additional time. Additionally, gain 25% critical strike chance.","shared":false},{"id":"dropkick","ko":"드롭킥","en":"Dropkick","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Dropkick_small.png","descKo":"기본 공격과 스킬이 최대 체력의 5%(+ 기본 공격력 100당 3.5%)(+ 추가 체력 1000당 2%) 미만인 적을 처형해 날려버립니다. 날아간 시체가 충돌하면 폭발해 주변 적에게 150~500(+ 추가 방어력의 100%)(+ 추가 마법 저항력의 100%)의 마법 피해를 입히고, 처형 성공 시 100~300(+ 추가 체력의 25%)을 회복합니다.","descEn":"Your basic attacks and abilities execute enemy champions below 5% (+ 3.5% per 100 base AD) (+ 2% per 1000 bonus health) of their maximum health, which causes their corpse to be sent flying away in a line. Upon collision with an enemy champion or terrain, the target's corpse explodes to deal 150 to 500 (+ 100% bonus armor) (+ 100% bonus magic resistance) magic damage to nearby enemies. Successful executions heal you for 100 to 300 (+ 25% bonus health).\n\nThe execution may also be triggered by the explosion and goes through shields.","shared":false},{"id":"droppybara","ko":"카피바라 폭격","en":"Droppybara","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/OrbitalLaser_small.png","descKo":"소환사 질주를 궤도형 레이저로 교체합니다.\n\n교체가 끝나면 잠시 후 궤도형 레이저로 최대 체력의 30%에 해당하는 고정 피해를 입히고, 추가로 3초 동안 의 마법 피해를 입힙니다.","descEn":"Replace Summoner Flee with Orbital Laser.\n\nAfter a delay, call down an orbital laser that deals 30% max Health true damage plus magic damage over 3 seconds.","shared":true},{"id":"empowered-by-the-faithful","ko":"신념을 통한 강화","en":"Empowered By The Faithful","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/EmpoweredByTheFaithful_small.png","descKo":"아군 챔피언에게 회복·보호막을 부여하면 8초 동안 축복합니다. 축복받은 아군이 적 챔피언에게 피해를 입힐 때마다 헌신이 쌓여 최대 50회 중첩되고, 최대치에 도달하면 충격파를 내보내 주변 적에게 50~300(+ 회복 및 보호막 효과의 750%)의 마법 피해를 입힙니다. 회복 및 보호막 효과의 25%에 해당하는 체력 비율 미만의 적은 처형됩니다.","descEn":"Granting a heal or shield to an allied champion blesses them for 8 seconds. Whenever a blessed ally damages an enemy champion, you generate a stack of Devotion, stacking up to 50 times. Upon reaching maximum stacks, you unleash a shockwave that deals 50 to 300 (+ 750% heal and shield power) magic damage to nearby enemies. Enemy champions damaged below a percentage of their maximum health equal to 25% of your heal and shield power are executed.","shared":false},{"id":"final-city-transit","ko":"최후의 도시 대중교통","en":"Final City Transit","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Nightstalking_small.png","descKo":"사망하면 1초에 걸쳐 열차를 소환해 처치자를 향해 발사합니다. 열차는 관통하며 지나가는 적에게 150~750(+ 추가 공격력의 65%)(+ 주문력의 50%)(+ 최대 체력의 15%)의 물리 피해를 입힙니다.","descEn":"Upon death, you summon a train over 1 second that launches towards your killer at full speed, travelling in their direction at a global distance and dealing 150 to 750 (+ 65% bonus AD) (+ 50% AP) (+ 15% maximum health) physical damage to enemies it passes through.\n\nThe train is summoned a slight distance away from the front of your killer, based on their facing direction at the time of your death, and launches towards the position they were located at the time of your death.\n\nThis augment is currently disabled.","shared":true},{"id":"firefox","ko":"불여우","en":"Firefox","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Firfox_small.png","descKo":"자동 사용\n이동 속도가 증가하고 주위를 빙빙 도는 불꽃 3개를 생성합니다. 불꽃은 시야에 들어오는 가장 가까운 적을 대상으로 지정해 마법 피해를 입힙니다.","descEn":"Autocast\nGain Movement Speed and conjure three flames that orbit you, targetting the closest visible enemy in range and dealing magic damage.","shared":false},{"id":"growth-spurt","ko":"급속 성장","en":"Growth Spurt","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GrowthSpurt_small.png","descKo":"급속 성장 소환사 주문을 얻습니다. 사용 시 급격히 커져 주변 적을 공중으로 띄우고 최대 체력을 얻습니다.","descEn":"Replace a summoner spell with Growth Spurt.\n\nGrowth Spurt:","shared":false},{"id":"holy-snowball","ko":"신성한 눈덩이","en":"Holy Snowball","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GoldenSnowball_small.png","descKo":"눈덩이(표식)로 돌진하면 도착 시 1.5초 동안 무적이 됩니다. 또한 눈덩이 재사용 대기시간이 스킬 가속 100만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"After using the Dash spell from Mark, you become invulnerable for 1.5 seconds upon arrival. Additionally, your Mark cooldown is reduced equivalent to 100 ability haste.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","shared":false},{"id":"triggered-inferno","ko":"지옥불 난사 발동","en":"Triggered Inferno","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/MadScientist_small.png","descKo":"라운드마다 크기가 커져 적응형 능력치 및 체력이 증가하거나 크기가 작아져 스킬 가속 및 이동 속도가 증가합니다.","descEn":"Each Round you'll either grow large (Adaptive Force and Health) or tiny (Ability Haste and Move Speed).","shared":true},{"id":"juiced","ko":"도취","en":"Juiced","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Juiced_small.png","descKo":"기본 공격 적중 시 최대 마나의 2.5%를 소모해 최대 마나의 4.5%에 해당하는 추가 마법 피해를 입힙니다. 이 피해는 치명타 적용 시 100의 추가 피해를 입힙니다.","descEn":"Basic attacks on-hit against enemy champions consume 2.5% of your maximum mana to deal bonus magic damage equal to 4.5% of your maximum mana. This damage can critically strike for 100 bonus damage.","shared":false},{"id":"kill-secured","ko":"확보된 킬","en":"Kill Secured","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/KillSecure_small.png","descKo":"최대 체력의 40% 미만인 적 챔피언에게 다가갈 때 이동 속도를 60% 얻습니다.","descEn":"Gain 60% bonus movement speed towards enemy champions below 40% of their maximum health.","shared":false},{"id":"phenomenal-evil","ko":"극악무도","en":"Phenomenal Evil","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/ARAM_PhenomenalEvil_small.png","descKo":"베이가의 경이로운 악행을 얻습니다. 스킬로 적 챔피언에게 피해를 입힐 때마다 영구히 주문력을 1 얻습니다. (전역 1초, 동일 시전당 3초 쿨다운) 첫 증강이 아니라면 40중첩(주문력 40)을 지닌 채 시작합니다.","descEn":"Gain Veigar.\n\nPhenomenal Evil Power: Generate a permanent stack of Phenomenal Evil each time you damage an enemy champion with ability damage. This effect cannot trigger more than once every second globally and once every 3 seconds from the same cast instance. For each stack, gain 1 ability power.\n\nIf this is not your first augment, start with 40 Phenomenal Evil stacks, granting you 40 ability power.","shared":false},{"id":"pinball","ko":"핀볼","en":"Pinball","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/PinballSnowball_small.png","descKo":"눈덩이(표식)가 핀볼이 되어 100~500의 추가 고정 피해를 입히고 지형에 튕깁니다. 튕길 때마다 이동 거리가 초기화되고 크기 25%·피해 20%가 증가하며 눈덩이 재사용 대기시간이 30% 감소합니다. 최대 4회까지 튕깁니다(크기 +100%, 피해 +80%). 또한 눈덩이 재사용 대기시간이 스킬 가속 50만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"Your Mark is empowered to instead throw a pinball, which deals 100 to 500 bonus true damage and ricochets off of terrain that it collides with. Each time the pinball ricochets, its remaining travel distance is reset, it increases in radius by 25%, deals 20% increased damage, and reduces Mark remaining cooldown by 30%. The pinball can ricochet up to 4 times, for a maximum radius increase of 100% and a damage increase of 80%. Additionally, your Mark cooldown is reduced equivalent to 50 ability haste.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","shared":false},{"id":"prom-queen","ko":"퀸카","en":"Prom Queen","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/PromQueen_small.png","descKo":"주기적으로 라칸의 변형 스킬을 자동 사용합니다. 발동 2.5초 전 반짝이는 티아라가 내려오고, 발동 시 6초 동안 유체화와 50% 이동 속도를 얻으며 질주합니다. 질주 중 300 범위 내 닿는 적을 1.5초 동안 넘어뜨리고 매혹시킵니다. (재사용 대기시간 35초)","descEn":"Automatically cast a modified version of Rakan, empowering you to break into a captivating sprint for 6 seconds. While empowered, you gain ghosting and 50% bonus movement speed, and enemies you 300 unit collision radius are knocked down and become charmed for 1.5 seconds (35 second cooldown).\n\nA sparkly tiara will descend upon you 2.5 seconds before the effect activates.","shared":false},{"id":"purist-caster","ko":"순수주의자 - 마법사","en":"Purist - Caster","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/PuristCaster_small.png","descKo":"모든 추가 공격 속도를 1%당 스킬 가속 0.65의 비율로 스킬 가속으로 전환합니다. 또한 스킬의 총 재사용 대기시간이 10% 감소합니다.","descEn":"Convert all of your bonus attack speed into ability haste at a rate of 0.65 ability haste per 1% bonus attack speed. Additionally, your abilities' total cooldowns are reduced by 10%.","shared":false},{"id":"quest-icathia-s-fall","ko":"이케시아의 몰락","en":"Icathia's Fall","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Quest_VoidImmolation_small.png","descKo":"즉시: 바미의 불씨를 획득합니다. 퀘스트: 태양불꽃 방패와 공허한 광휘를 보유하세요. 보상: 두 아이템이 공허의 불길로 합쳐집니다.","descEn":"Now: gain Bami’s Cinder. Quest: obtain Sunfire Aegis and Hollow Radiance. Reward: combine them into Void Immolation.","shared":false},{"id":"shrink-engine","ko":"축소 엔진","en":"Shrink Engine","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/ShrinkEngine_small.png","descKo":"처치 관여 시마다 중첩을 얻습니다(무한 중첩). 중첩마다 스킬 가속 8과 이동 속도 1%를 얻고 크기가 4% 작아집니다. (크기 감소 최대 80%/20중첩) 사망 시 중첩의 65%를 잃습니다.","descEn":"Scoring a champion takedown generates a stack, stacking infinitely. For each stack, gain 8 ability haste and 1% bonus movement speed, and reduce your size by 4%. Lose 65% of stacks on death.\n\nSize reduction is capped at 80% (20 stacks).","shared":false},{"id":"sonata","ko":"소나타","en":"Sonata","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Sonata_small.png","descKo":"주기적으로 소나의 인내의 아리아와 기민함의 노래를 번갈아 자동 사용합니다. (재사용 대기시간 10초) 아리아: 자신과 체력이 가장 부족한 아군을 60(+ 주문력의 60%) 회복시키고, 주변 아군에게 1.5초 동안 80(+ 주문력의 40%) 보호막을 부여합니다. 노래: 7초 동안 이동 속도 30%를 얻고, 주변 아군에게 3초 동안 이동 속도 20%를 부여합니다.","descEn":"Alternate between automatically casting a modified version of Sona and modified Sona, with the former being cast first (10 second cooldown).\n\nAria of Perseverance: Heal yourself for 60 (+ 60% AP) and send out a tone to the Based on greatest % missing health allied champion within 1000 units that heals them for the same amount. Additionally, generate an 400 unit radius, center-to-edge that grants you and tagged allied champions a 80 (+ 40% AP) shield for 1.5 seconds.\n\nSong of Celerity: Gain 30% bonus movement speed for 7 seconds. If you take damage during this time, the duration ends prematurely once or if 3 seconds have elapsed. Additionally, generate an 400 unit radius, center-to-edge that grants tagged allied champions 20% bonus movement speed for 3 seconds.","shared":false},{"id":"soul-eater","ko":"영혼의 포식자","en":"Soul Eater","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SoulEater_small.png","descKo":"적 챔피언을 이동 불가 상태로 만들거나 이동 스킬을 봉인하면 최대 체력을 20 얻습니다(무한 중첩). (시전당 재사용 대기시간 5초)","descEn":"Immobilizing or grounding an enemy champion grants you 20 bonus health, stacking infinitely (5 second cooldown per cast instance).","shared":false},{"id":"spin-me-right-round","ko":"빙글빙글","en":"Spin Me Right Round","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/YouSpinMeRightRound_small.png","descKo":"소환사 주문이 악샨의 영웅의 비상으로 바뀝니다. 갈고리를 발사해 지형에 2초간 고정한 뒤 매달려 회전 이동하며, 회전 중 주변 적에게 0.2초마다 15~75(+ 공격력의 15%)의 물리 피해를 입히고 적중 효과를 적용합니다(온히트 25% 효율). 마지막에 도약하며 한 번 더 사격합니다.","descEn":"Replace a summoner spell with Akshan (5.88 seconds after applying the 70 summoner spell haste from the global ARAM champion buff, starts post-effect).\n\nHeroic Swing - Active: You can activate Heroic Swing three times before the ability goes on cooldown, and you can use the third cast only after 0.5 seconds of the second cast. An attack or movement command may be inputted to use the second and third casts.\n\nFirst Cast: Fire a hook in the target direction that embeds in the first terrain hit for 2 seconds. Heroic Swing's second cast can be used while the hook is attached. If the hook fails to attach or you become immobilized, grounded, or polymorphed within the duration, Heroic Swing is cancelled and placed on full cooldown.\n\nSecond Cast: Swing around the terrain in either a clockwise or counterclockwise direction based on the position of the cursor Dash will move clockwise if the player's cursor is anywhere to the left of their champion from their facing direction (or perspective), and counterclockwise if the cursor is anywhere to their champion's right., stopping upon colliding with an enemy champion or terrain. While swinging, fire at the nearest visible enemy within your attack range (minimum 400 units) every 0.2 to deal them 15 to 75 (+ 15% AD) (1 + 0.3 per 100% bonus attack speed) physical damage and apply on-hit effects for each shot, with on-hit damage reduced to 25% effectiveness. The dash will be interrupted if you are affected by any immobilizing or polymorphing crowd control during the dash.\n\nThird Cast: End the swing by jumping to the target location and fire one last shot at a nearby visible enemy.","shared":false},{"id":"stats","ko":"능력치!","en":"Stats!","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Stats_small.png","descKo":"능력치 모루를 2개 획득합니다.","descEn":"Gain 2 Stat Anvils!","shared":false},{"id":"stats-on-stats","ko":"능력치 더하기 능력치!","en":"Stats on Stats!","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/StatsOnStats_small.png","descKo":"능력치 모루를 3개 획득합니다.","descEn":"Gain 3 Stat Anvils!","shared":false},{"id":"stats-on-stats-on-stats","ko":"능력치 더하기 능력치 더하기 능력치!","en":"Stats on Stats on Stats!","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/StatsOnStatsOnStats_small.png","descKo":"능력치 모루를 4개 획득합니다.","descEn":"Gain 4 Stat Anvils!","shared":false},{"id":"stuck-in-here-with-me","ko":"도망갈 수 없어","en":"Stuck in Here With Me","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/StuckInHereWithMe_small.png","descKo":"궁극기 사용 시 2초에 걸쳐 최대 500까지 커지는 오라를 펼칩니다. 지속시간이 끝나면 오라 내 적을 2초간 도발하고, 자신은 같은 시간 동안 50% 피해 감소를 얻습니다. 또한 궁극기 가속을 30 얻습니다. (재사용 대기시간 30초)","descEn":"Casting your ultimate ability grants you an aura for 2 seconds, growing in size over the duration to up to 500 units. After the duration, you taunt all enemies within the aura for 2 seconds and gain 50% damage reduction for the same duration (30 second cooldown). Additionally, gain 30 ultimate haste.\n\nAura is activated once the ultimate's effect For instant-cast spells or has For duration-based spells.","shared":false},{"id":"twin-fire","ko":"쌍둥이 불꽃","en":"Twin Fire","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/TwinFire_small.png","descKo":"스킬로 적 챔피언에게 피해를 입히면 1발(+ 치명타 확률 33.33%당 1발)의 폭죽을 발사해 각 10~30(+ 추가 공격력의 7%)(+ 주문력의 7%)의 마법 피해를 입힙니다. (재사용 대기시간 5초) 또한 치명타 확률을 25% 얻습니다.","descEn":"Damaging abilities against enemy champions launch 1 (+ 1 per 33.33% critical strike chance) missiles at the target that each deal 10 to 30 (+ 7% bonus AD) (+ 7% AP) magic damage (5 second cooldown). Additionally, gain 25% critical strike chance.","shared":false},{"id":"zealot","ko":"광신자","en":"Zealot","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Zealot_small.png","descKo":"공격 속도 35%(+ 주문력 100당 5%)와 치명타 확률 25%(+ 주문력 100당 5%)를 얻습니다.","descEn":"Gain 35% (+ 5% per 100 AP) bonus attack speed and 25% (+ 5% per 100 AP) critical strike chance.","shared":false},{"id":"hand-of-baron","ko":"남작의 도움","en":"Hand of Baron","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/HandofBaron_small.png","descKo":"변형된 내셔 남작의 손길을 얻어 적응형 능력치를 25% 더 얻고, 주변 아군 미니언이 크게 강화됩니다.","descEn":"Gain a modified Hand of Baron, which only grants 25% increased adaptive force and greatly empowers nearby allied minions.","shared":false},{"id":"upgrade-sword-of-blossoming-dawn","ko":"꽃피는 새벽의 검 업그레이드","en":"Upgrade Sword of Blossoming Dawn","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeMikaelsBlessing_small.png","descKo":"꽃피는 새벽의 검을 강화합니다. 페퍼민트 효과의 회복량이 250% 증가하고, 공격 속도를 100% 얻습니다.","descEn":"Upgrades Sword of Blossoming Dawn, empowering Peppermint to have its healing increased by 250%. Additionally, you gain 100% bonus attack speed.","shared":false},{"id":"archmage","ko":"대마법사","en":"Archmage","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Eureka_small.png","descKo":"주문력의 20%에 해당하는 스킬 가속을 얻습니다.","descEn":"Gain Ability Haste equal to 20% Ability Power.","shared":true},{"id":"from-downtown","ko":"로켓 배송","en":"From Downtown","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/QuestBangBang_small.png","descKo":"퀘스트: 700 이상 떨어진 적 챔피언을 스킬로 15회 적중시키세요. 보상: 이후 700 이상 떨어진 적을 스킬로 맞히면 운석을 떨어뜨려 75~200(+ 추가 공격력의 50%)(+ 주문력의 20%)의 마법 피해를 입히며, 거리가 멀수록 피해와 범위가 커집니다. (대상별/시전당 재사용 대기시간 8초) 빵야! 빵야! 멋진 사격이군요!","descEn":"Quest: Hit enemy champions with abilities while located at least 700 units away from them (at the time of the hit) 15 times (counts up to 1 hit per champion per cast instance).\n\nReward: Upon completing your Quest, hitting enemy champions with abilities while located at least 700 units away from them at the time of the hit fires a meteor to their current location, which upon landing deals 75 to 200 (+ 50% bonus AD) (+ 20% AP) magic damage to enemies within the area (8 second cooldown per target per cast instance). The meteor's damage and radius are increased based on your distance to the target at the time of the ability hit, increasing its damage by 0 to 230 for 11/700 to 3000 and setting its radius to 120;180;270;405;607.5;911.25;1366.875/700;X;X;X;X;X;3000 units.\n\nMaximum meteor damage is 75*2.3 to 200*2.3 (+ 50*2.3% bonus AD) (+ 20*2.3% AP).","shared":false},{"id":"rite-of-ascension","ko":"초월 의식","en":"Rite of Ascension","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GlassCannon_small.png","descKo":"피해를 입힌 적 챔피언을 3초 안에 처치 관여하면 8초 동안 정수를 남깁니다. 기본 공격으로 정수를 소모하면 1초 정신집중 후 해당 위치로 순간이동하며(무적), 이동 속도 100%(2초간 감소), 75~300(+ 추가 공격력의 50%)(+ 주문력의 25%) 회복, 기본 스킬 초기화를 얻습니다.","descEn":"Scoring a takedown against an enemy champion within 3 seconds of damaging them causes them to leave behind their Essence for 8 seconds. You can basic attack the Essence to consume it: causing you to blink to its location after winding up for 1 second, during which you are untargetable (except to turrets), displacement immune, and unable to act. Upon consumption of the Essence, you gain 100% bonus movement speed decaying over 2 seconds, heal yourself for 75 to 300 (+ 50% bonus AD) (+ 25% AP), and reset the cooldowns of your basic abilities. The heal is increased by 0 to 100 for 11/0 to 100, for a maximum heal of 75*2 to 300*2 (+ 50*2% bonus AD) (+ 25*2% AP).","shared":true},{"id":"dropbear","ko":"곰 투하","en":"DropBear","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Drop_Bear.png","descKo":"사망 시 거대 티버가 하늘에서 떨어져 0.5초 후 착지하며 주변 적에게 250~750(+ 주문력의 100%)의 마법 피해를 입히고 1.5초간 기절시킵니다. 티버는 플레이어의 모든 증강을 지니고 8~20초간 처치자를 추격하며, 매초 주변 적에게 25~150(+ 주문력의 50%)의 마법 피해를 입힙니다.","descEn":"Upon death, you summon Tibbers who drops from above and lands onto the location of your death over 0.5 seconds. Upon landing, he deals 250 to 750 (+ 100% AP) (+ 2 per 1 flat magic penetration) (+ 5 per 1% magic penetration) magic damage to nearby enemies and stuns them for 1.5 seconds. Tibbers then chases after and targets the enemy champion that killed you, attacking them once he is in range.\n\nTibbers has all of your augments and lasts for up to 8 to 20 seconds. He gains 80 to 100 bonus attack speed and deals 25 to 150 (+ 50% AP) magic damage every second to enemies within 350 units of him. His stats are:\n1500 to 6000 (+ 15% maximum health) (+ 150% AP) health (rapidly decays over his lifetime) 50 to 300 (+ 75% AD) magic damage (basic attack damage)1.00 attack speed150 attack range50 armor50 magic resistance200 to 300 (+ 20% movement speed) movement speed","shared":false},{"id":"en-passant","ko":"앙파상","en":"En Passant","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/Dashing_small.png","descKo":"돌진, 도약, 점멸, 순간이동 스킬의 스킬 가속이 75만큼 증가합니다.","descEn":"Your dash, leap, blink, or teleport Abilities gain 75 Ability Haste.","shared":true},{"id":"hellbent","ko":"열의","en":"Hellbent","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Hellbent_small.png","descKo":"기본 공격이나 스킬로 적 챔피언을 맞힐 때마다 중첩을 얻어(6초 지속, 최대 10회) 최대 중첩 시 헬벤트 상태가 됩니다. 헬벤트: 치명적 피해를 받으면 4초간 부활 상태(무적·행동 불가)에 들어간 뒤 최대 체력의 35~75%로 부활합니다. (재사용 대기시간 120초) 이후 15초 동안 적응형 공격력/주문력 25~200, 이동 속도, 모든 피해 흡혈 15~30%를 얻습니다.","descEn":"Generate a stack of Revivemaxxing for each enemy champion you hit with basic attacks or abilities, lasting for 6 seconds, refreshing on subsequent hits, and stacking up to 10 times. At maximum stacks, you become Hellbent.\n\nHellbent: Upon taking lethal damage, you enter resurrection for 4 seconds, during which you are invulnerable, untargetable, and unable to act. Afterwards, you revive with 35 to 75 of your maximum health (120 second cooldown). Additionally, you become empowered for the next 15 seconds, granting you 25*0.6 to 200*0.6 bonus Attack Damage or 25 to 200 Ability Power (Adaptive), 20 to 40 bonus movement speed while facing toward nearby enemy champions, and 15 to 30 omnivamp for the duration.","shared":false},{"id":"high-roller","ko":"도박꾼","en":"High Roller","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/HighRoller_small.png","descKo":"주변 적이 죽을 때 7% 확률로 능력치 모루를 떨어뜨립니다. 모루를 주우면 다음 상점 이용 시(사망 후) 능력치를 획득합니다.","descEn":"Nearby enemies that die have a 7% chance to drop a Stat Bonus at the location of their death. You can pick up dropped anvils by moving over them. The obtained Stat Bonus will be consumed once the shop is enabled again (after your death).","shared":false},{"id":"titan-s-resolve","ko":"거인의 결의","en":"Titan's Resolve","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/IAmTheJuggernaut_small.png","descKo":"피해를 주거나 받을 때마다 중첩을 얻습니다(6초 지속, 지속 피해 제외). 10중첩마다 적응형 공격력/주문력 25~50, 방어력·마법 저항력 4~8, 크기 10%, 강인함 8%를 얻습니다.","descEn":"You generate a stack of Juggernauting for each instance of damage you deal or take (excluding damage over time), lasting for 6 seconds and refreshing on subsequent damage dealt or taken. For every 10 stacks of Juggernauting, you gain 25*0.6 to 50*0.6 bonus Attack Damage or 25 to 50 Ability Power (Adaptive), 4 to 8 bonus armor and bonus magic resistance, 10% increased size, and 8% tenacity.\n\nStacks expire one by one when the duration ends, with the decay rate being faster the more stacks you have.","shared":false},{"id":"multishot","ko":"다중 공격","en":"Multishot","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"퀘스트: 선택한 스킬의 투사체로 적 챔피언을 필요 횟수만큼 적중시키세요. (총 6단계) 보상: 단계마다 시전 시 투사체가 1개씩 추가되고 스킬이 부채꼴로 발사됩니다. 같은 시전의 추가 적중은 30% 피해.","descEn":"Assigns quests that require you to hit enemy champions with a specific ability's missile a number of times (counts up to 1 hit per champion per cast instance). There are six quest tiers, and each completed tier rewards you with an additional missile fired on the ability's cast. The reward effect also modifies the ability to fire all of its missiles in a cone. Subsequent missile hits from the same cast against the same enemy deal 30% damage.","shared":true},{"id":"orbital-laser","ko":"궤도형 레이저","en":"Orbital Laser","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/OrbitalLaser_small.png","descKo":"소환사 질주를 궤도형 레이저로 교체합니다.\n\n교체가 끝나면 잠시 후 궤도형 레이저로 최대 체력의 30%에 해당하는 고정 피해를 입히고, 추가로 3초 동안 의 마법 피해를 입힙니다.","descEn":"Replace Summoner Flee with Orbital Laser.\n\nAfter a delay, call down an orbital laser that deals 30% max Health true damage plus magic damage over 3 seconds.","shared":true},{"id":"quickstep","ko":"날쌘걸음","en":"Quickstep","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"선택한 스킬을 강화합니다. 시전 시 커서 방향으로 최대 350 돌진합니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability's cast to cause you to dash up to 350 units towards your cursor.","shared":true},{"id":"snowday","ko":"눈 오는 날","en":"Snowday","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Snowday_small.png","descKo":"눈덩이(표식)가 자체 피해의 100%에 해당하는 추가 마법 피해를 입히고, 재사용 대기시간이 스킬 가속 100만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"Your Mark deals bonus magic damage equal to 100% of its damage and has its cooldown reduced equivalent to 100 ability haste.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","shared":false},{"id":"pursuit-of-haste","ko":"가속 추구","en":"Pursuit of Haste","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"퀘스트: 선택한 스킬로 적 챔피언을 필요 횟수만큼 적중시키세요. (총 2단계) 보상: 단계마다 해당 스킬에 스킬 가속을 얻습니다.","descEn":"Assigns quests that require you to hit enemy champions with a specific ability a number of times (counts up to 1 hit per champion per cast instance). There are two quest tiers, and each completed tier rewards you with ability haste on the ability.","shared":true},{"id":"spirit-bomb","ko":"영혼 폭탄","en":"Spirit Bomb","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SpiritBomb_small.png","descKo":"자신이나 아군에게 회복·보호막을 부여하면 영혼 폭탄이 축적됩니다. 누적 200~2000에 도달하면 체력이 가장 부족한 아군에게 폭탄을 던져, 475 범위 아군의 잃은 체력의 5~15%(+ 주문력 100당 3%)를 회복시키고 2초 동안 현재 체력의 10~25%(+ 주문력 100당 2%)를 흡수하는 보호막을 부여합니다.","descEn":"Your healing and shielding on yourself or allies builds up a Spirit Bomb on top of you. Once you have healed and shielded a combined total of 200 to 2000, you toss the Spirit Bomb onto the Lowest health percent allied champion over 1.1 seconds. Upon impact, the Spirit Bomb explodes in a 475 radius to heal allied champions within the area for 5 to 15 (+ 3% per 100 AP) of their missing health and grants them a shield for 2 seconds that absorbs damage equal to 10 to 25 (+ 2% per 100 AP) of their current health.\n\nHealing and shielding from this effect do not count toward the Spirit Bomb's trigger condition.","shared":false},{"id":"stackosaurus-rex","ko":"다단 중첩","en":"Stackosaurus Rex","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/StackosaurusRex_small.png","descKo":"스킬, 증강 또는 아이템 중첩을 영구적으로 획득할 때마다 75% 더 획득합니다!","descEn":"When you gain permanent Stacks of an Ability, Augment, or Item gain 75% more!","shared":false},{"id":"siphon","ko":"흡수","en":"Siphon","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"선택한 스킬을 강화합니다. 적 챔피언에게 입힌 피해의 30%만큼 체력을 회복합니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability to heal you for 30% of its Damage calculated after modifiers dealt to enemy champions.","shared":true},{"id":"wee-woo-wee-woo","ko":"삐뽀삐뽀","en":"Wee Woo Wee Woo","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/WeeWooWeeWoo_small.png","descKo":"주변 아군 챔피언을 향할 때 이동 속도를 0~50(대상의 잃은 체력에 비례) 얻으며, 향하지 않게 된 후 2초간 지속됩니다. 회복·보호막 효과도 0~50 증가합니다.","descEn":"Gain 0 to 50 for 11/0 to 75 (based on target ally's missing health) bonus movement speed while facing toward nearby allied champions, lingering for 2 seconds after no longer facing them. Your heals and shields are also increased by 0 to 50 for 11/0 to 75.","shared":false},{"id":"yowch-my-coins","ko":"으악, 내 동전!","en":"Yowch, My Coins!","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/YouchMyCoins_small.png","descKo":"처치 관여한 적 챔피언이 주변에 동전 6~10개를 떨어뜨립니다(10초 지속). 자신이나 아군이 주우면 동전당 골드 15를 얻습니다.","descEn":"Enemy champions that you score a takedown against drop 6 to 10 coins, with each coin landing 500 units away from the location of their death and lasting 10 seconds. You or allied champions can collect the coins by moving over them, granting 15 for each coin collected.","shared":false},{"id":"echo-cast","ko":"메아리 시전","en":"Echo Cast","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"선택한 스킬을 강화합니다. 시전 시 커서 방향으로 최대 500 이동하는 분신을 소환하며, 분신이 0.25초 후 그 스킬을 다시 시전합니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability's cast to summon a clone of your champion that is untargetable and moves up to 500 units towards your cursor. The clone then casts the ability it was summoned from after a 0.25-second delay, mimicking the active effects of the casted spell and disappearing after it finishes casting.","shared":true},{"id":"combusting-interest","ko":"타오르는 이자","en":"Combusting Interest","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/BloodMoney2_small.png","descKo":"적 챔피언에게 적용된 화상·지속 피해가 매 타격마다 골드를 1~3(+ 입힌 피해의 0.75%) 생성합니다.","descEn":"Gain 1 to 3 (+ 0.75% of damage dealt) gold for each tick of damage dealt to enemy champions with persistent damage effects as well as damage over time from item effects.","shared":false},{"id":"bonk","ko":"꽁!","en":"BONK!","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"강화된 기본 공격 효과가 있는 스킬을 강화합니다. 대상에게 30% 증가한 피해를 입히고 그 피해의 30%를 주변 적에게도 입힙니다.","descEn":"Upgrades one of your champion's abilities that has an empowered basic attack effect, further enhancing the attack to deal 30% increased damage to the target and 30% of its damage to nearby enemies.","shared":true},{"id":"hide-on-bush","ko":"Hide on bush","en":"Hide on Bush","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/BrushPower_small.png","descKo":"수풀에 있는 동안 피해량이 20% 증가합니다. 수풀을 벗어난 후 2초간 지속됩니다.","descEn":"While in brush, you deal 20% increased damage. This effect lingers for 2 seconds after leaving brush.","shared":false},{"id":"tooth-fairy","ko":"이빨 요정","en":"Tooth Fairy","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/QuestBurstingTeeth_small.png","descKo":"2.5초 안에 적 챔피언에게 최대 체력의 25% 이상 피해를 입히면 이빨을 떨어뜨립니다. (대상별 재사용 대기시간 4초) 이빨을 주우면 중첩마다 물리 관통력과 마법 관통력을 4 얻습니다.","descEn":"When you deal damage to an enemy champion equal to or more than 25% of their maximum health within 2.5 seconds, they drop a Tooth on the ground (4 second cooldown per target). You can pick up this Tooth by moving over it, granting you a Dental Records stack. For each stack, you gain 4 lethality and flat magic penetration.","shared":false},{"id":"chain-reaction","ko":"연쇄 반응","en":"Chain Reaction","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"넉백 효과가 있는 스킬을 강화합니다. 밀려난 챔피언이 200 내 다른 챔피언과 부딪히면 둘에게 100~400의 마법 피해와 0.5초 공중에 띄우기를, 지형과 부딪히면 150~800의 마법 피해와 0.75초 공중에 띄우기 및 0.5초 기절을 입힙니다.","descEn":"Upgrades one of your champion's abilities that has a knock back effect, empowering the ability to trigger a chain reaction effect when displaced champions hit other champions or terrain within 200 units. If a knocked back champion collides with another enemy champion during their displacement, the champions they collided with are dealt 100 to 400 magic damage and knocked up for 0.5 seconds. If they collide with terrain during their displacement, they will rebound to take 150 to 800 magic damage and become knocked up for 0.75 seconds and stunned for 0.5 seconds. The knock up duration is increased to up to 1.1 seconds based on how long the ability's cooldown is.","shared":true},{"id":"ravenous-bind","ko":"굶주린 속박","en":"Ravenous Bind","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/UpgradeHubris_small.png","descKo":"이동 불가/이동 스킬 봉인 효과가 있는 스킬을 강화합니다. 대상에게 15~90(+ 주문력의 10%)(+ 최대 체력의 0.5%)의 마법 피해를 입히고, 자신을 50~200(+ 주문력의 5%)(+ 추가 체력의 10%) 회복합니다.","descEn":"Upgrades one of your champion's abilities that has a immobilizing or grounding effect, empowering the ability to deal 15 to 90 (+ 10% AP) (+ 0.5% of your maximum health) magic damage to affected targets and heal you for 50 to 200 (+ 5% AP) (+ 10% bonus health). The heal is increased by up to 50% based on how long the ability's cooldown is.","shared":false},{"id":"dimension-shift","ko":"차원 이동","en":"Dimension Shift","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/WhenTheDarknessComes_small.png","descKo":"어둠이 드리우면 소환사 주문을 얻습니다. 빛에 맞은 모든 대상을 1200 범위의 대체 차원(어둠의 영역)으로 이동시킵니다. 영역 안과 밖의 대상은 서로를 죽은 것으로 간주하며 상호작용할 수 없습니다.","descEn":"Replace a summoner spell with When the Darkness Comes.\n\nWhen the Darkness Comes:\n\nThe Dark Realm is a battlefield that exists outside of the normal realm in an alternate dimension. It exists only for units hit by the cosmic light, and consists of an arena that has a radius of 1200 units and includes any terrain features that would exist in the map of the normal realm, including structures, walls, and brushes. The boundaries of the arena are impassable but not considered terrain themselves, and enemies that try to move out of the area will be displaced back inside.\n\nUnits between realms see each other as glowing stars, considering each other dead and negating any interactions between each other. Only units that were hit by the light will enter the realm; other units cannot follow them. Everything that occurs inside the Dark Realm is hidden to units outside of it, and vice versa.\n\nStructures exist in all realms at the same time, but are untargetable in the Dark Realm. Turrets will behave normally as if all units were in the same realm. Pets still inside the Dark Realm are killed at its end.","shared":false},{"id":"don-t-change-the-channel","ko":"채널 고정","en":"Don't Change the Channel","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/DontChangeTheChannel_small.png","descKo":"스킬을 정신 집중하는 매초 50~200(+ 공격력의 50%)(+ 주문력의 25%)(+ 추가 체력의 10%)의 보호막을 얻습니다. 정신 집중을 멈추면 빠르게 사라집니다.","descEn":"For every second that you channel an ability, you gain a 50 to 200 (+ 50% AD) (+ 25% AP) (+ 10% bonus health) shield. The shield quickly decays once you stop channeling.","shared":false},{"id":"bolstered","ko":"보강","en":"Bolstered","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"보호막 효과가 있는 스킬을 강화해 보호막 세기를 0~60 증가시킵니다.","descEn":"Upgrades one of your champion's abilities that has a shield effect, increasing the strength of the ability's shield by 0 to 60 for 11/0 to 70.","shared":true},{"id":"double-strike","ko":"2연속 방어","en":"Double Strike","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Adamant_small.png","descKo":"강화된 기본 공격 효과가 있는 스킬을 강화합니다. 강화된 공격이 적중 효과(온히트)를 한 번 더 적용합니다.","descEn":"Upgrades one of your champion's abilities that has an empowered basic attack effect, further enhancing the attack to apply on-hit effects to targets it hits a second time.","shared":true},{"id":"our-healing","ko":"우리의 치유","en":"Our Healing","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Equillibrium_small.png","descKo":"주변 대상이 체력을 회복할 때마다(자신 제외) 그 회복량의 15%만큼 자신을 회복합니다. 적의 회복 효과로는 두 배(30%) 적용됩니다.","descEn":"Whenever a nearby unit is healed (excluding yourself), you heal yourself equal to 15% of the amount they healed, doubled to 30% from the heals of enemies.","shared":false},{"id":"shark-bait","ko":"상어 미끼","en":"Shark Bait","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/FishBait_small.png","descKo":"치명적 피해를 받으면 3.5초 동안 좀비 상태가 됩니다. 이동 속도가 400으로 고정되고 유체화를 얻으며 주변 적을 40% 둔화시킵니다. 지속시간이 끝나면 거대한 상어가 솟아올라 400 범위 적에게 80~300(+ 대상 잃은 체력의 20%)의 마법 피해를 입히고 1초간 공중에 띄웁니다. 좀비 상태 동안에는 무적·행동 불가입니다.","descEn":"Upon taking fatal damage, you become a Shark Bait, causing you to enter a zombie state for 3.5 seconds, during which your movement speed is set to a static 400, you gain ghosting, and enemies within 400 units of you are slowed by 40%. At the end of the duration, a massive shark emerges from beneath you that lets out a powerful chomp (400 radius), dealing 80 to 300 (+ 20% of target's missing health) magic damage to all enemies within the area and knocking them up for 1 second.\n\nWhile under the zombie state, you are able to move and become invulnerable, untargetable, and immune to crowd control, but you are also rendered unable to declare basic attacks, cast abilities, use summoner spells, and activate items.","shared":false},{"id":"forged-by-the-master","ko":"장인의 솜씨","en":"Forged By The Master","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/ForgedByTheMaster_small.png","descKo":"아이템 및 증강으로 입히는 피해량이 45% 증가합니다.","descEn":"Increases the damage dealt by your item effects and augments by 45%.","shared":false},{"id":"it-s-go-time","ko":"출발할 시간","en":"It's Go Time","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"지속시간이 있는 스킬을 강화합니다. 효과가 지속되는 동안 이동 속도를 25~45 얻습니다.","descEn":"Upgrades one of your champion's abilities that has a duration-based effect, empowering the ability to grant 25 to 45 bonus movement speed for the effect's duration.","shared":true},{"id":"lil-extra-help","ko":"작은 도움","en":"Lil' Extra Help","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"기본 공격을 강화하는 스킬을 강화합니다. 효과가 지속되는 동안 공격 사거리를 150(근접 100), 공격 속도를 75%(근접 40%) 얻습니다.","descEn":"Upgrades one of your champion's abilities that has an effect which empowers your basic attacks for a duration, further enhancing the attacks by granting you 150/100 bonus attack range and 75%/40% bonus attack speed while the effect is active.","shared":true},{"id":"mercy-s-strike","ko":"자비의 일격","en":"Mercy's Strike","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"선택한 스킬을 강화합니다. 시전 후 다음 기본 공격이 사거리 300과 공격 속도 75%를 얻고, 대상 최대 체력의 3%(+ 회복 및 보호막 효과 10%당 2%)에 해당하는 추가 마법 피해를 입힙니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability's cast to enhance your next basic attack within a duration. The enhanced attack has 300 bonus range, gains 75% bonus attack speed, and deals bonus magic damage equal to 3% (+ 2% per 10% heal and shield power) of the target's maximum health.","shared":true},{"id":"spell-split","ko":"주문 분산","en":"Spell Split","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"투사체가 있는 스킬을 강화합니다. 투사체가 적에게 적중하거나 최대 사거리에 도달하거나 재시전 시 0.25초에 걸쳐 두 개로 갈라져 반대 방향으로 발사됩니다. 같은 시전의 추가 적중은 30% 피해.","descEn":"Upgrades one of your champion's abilities that has a missile, empowering the ability's missile to split in two over 0.25 seconds upon hitting an enemy, at maximum range, or when recast. Each of the split missiles fire perpendicularly in opposite directions and apply the same effects to enemies they hit. Subsequent missile hits from the same cast against the same enemy deal 30% damage.\n\nRecast can be used after 0.15 seconds of the initial cast.","shared":true},{"id":"nature-is-healing","ko":"자연의 회복","en":"Nature is Healing","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/NatureIsHealing_small.png","descKo":"수풀에 있는 매초 최대 체력의 0.6~2.1%를 회복합니다.","descEn":"Heal yourself for 0.6 to 2.1 of your maximum health for each second that you are within brush.","shared":false},{"id":"overextender","ko":"무리한 진입","en":"Overextender","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Overextender_small.png","descKo":"대포 발사기 발사가 강화되어 사거리가 12,000 증가하고 충돌 피해가 50%, 이동 속도가 크게 증가합니다. 또한 귀환이 강화 귀환으로 업그레이드됩니다. (도살자의 다리 전용)","descEn":"Your launch with the Cannon Launcher is now empowered, increasing the launch range by 12,000 units and the impact damage by 50%, as well as the travel speed by a significant amount. Additionally, your Recall is now functional and is upgraded to Empowered Recall.\n\nThis augment is only available on the Butcher's Bridge map.\n\nTotal launch range is 18,500 units, reduced to 16,500 after your team's Outer turret is destroyed. Increased impact damage is 120*1.5 to 460*1.5 magic damage.","shared":false},{"id":"overloaded","ko":"과충전","en":"Overloaded","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"선택한 스킬을 강화합니다. 다른 스킬을 시전할 때마다 해당 스킬의 재사용 대기시간이 초기화됩니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability to have its cooldown reset whenever you cast a different ability.","shared":true},{"id":"pat-on-the-back","ko":"격려하기","en":"Pat On The Back","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/PatOnTheBack_small.png","descKo":"아군 챔피언과 200 이내에 있으면 격려를 받아 3초 동안 50~150(+ 이동 속도의 25%) 보호막과 30% 이동 속도를 얻습니다. (재사용 대기시간 9초) 중첩 가능하며 지나갈 때마다 지속시간이 갱신됩니다.","descEn":"Whenever you are within 200 units of an allied champion, they pat you on the back, granting you a 50 to 150 (+ 25% bonus movement speed) shield and 30% bonus movement speed for 3 seconds (9 second cooldown). This effect can stack and its duration refreshes with each pass.","shared":false},{"id":"porcupine","ko":"고슴도치","en":"Porcupine","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/PinCushion_small.png","descKo":"적 챔피언에게 피해를 받으면 바늘이 축적되어 400~3900까지 저장됩니다. 최대치에 도달하면 바늘이 400 범위로 튀어 나가 적에게 75~200(+ 추가 방어력의 125%)(+ 추가 마법 저항력의 125%)의 물리 피해를 입히고 2초간 30% 둔화시킵니다.","descEn":"You build up a burst of needles from within you when taking damage from enemy champions, storing up to 400 to 3900 Damage calculated before modifiers damage taken. After reaching the maximum damage stored, you consume the stored damage to burst the needles outward in a 400 radius, dealing 75 to 200 (+ 125% bonus armor) (+ 125% bonus magic resistance) physical damage to enemies hit and slowing them by 30% for 2 seconds.","shared":false},{"id":"poro-stampede","ko":"포로 쇄도","en":"Poro Stampede","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/QuestPoroCharge_small.png","descKo":"퀘스트: 포로 간식을 모아 포로에게 주세요. 보상: 적 팀에게 포로 무리를 날리는 포로 돌격 소환사 주문을 얻습니다. 퀘스트 레벨마다 추가 무리를 얻습니다. \"아! 어찌나 사랑스러운지!\" - 포로치기","descEn":"Poro-Snaxes will now randomly appear around you every 35 to 20 seconds. You can pick up a Poro-Snax by moving over it, granting you a Poro-Snax charge. Poro-Snaxes will not spawn while you are at the maximum number of Poro-Snax charges (2). Feeding a Poro with a Poro-Snax generates a stack of Poro Love. At 5 stacks, you are granted the Poro Charge summoner spell and are prompted to replace one of your summoner spells with it. You are then assigned with quests that require you to reach a certain amount of Poro Love stacks. There are nine quest tiers, and each completed tier rewards you with an additional Poro wave for Poro Charge.\n\nPoro Charge:","shared":false},{"id":"pressure-cooker","ko":"압력솥","en":"Pressure Cooker","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/QuestPressureCooker_small.png","descKo":"주변 300 범위 적 챔피언에게 매초 화상을 적용해 최대 체력의 0.5%에 해당하는 마법 피해를 3초간 입힙니다(무한 중첩). 퀘스트: 화상으로 피해를 입히세요. 보상: 단계마다 효과가 강화됩니다.","descEn":"Surrounds you in flames, causing you to apply a Burn every second to enemy champions within 300 units for 3 seconds that deals magic damage equal to0.5% of your maximum health per second.This Burn stacks infinitely and refreshes with each application.\n\nAdditionally, you are assigned with quests that require you to deal a certain amount of damage with the Burn effect against enemy champions. There are three quest tiers, and each completed tier grants you a reward that improves Pressure Cooker's effect.","shared":false},{"id":"sneakerhead","ko":"신발 수집가","en":"Sneakerhead","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Sneakerhead_small.png","descKo":"즉시: 무작위 강화 장화 한 쌍을 얻습니다. 퀘스트: 해당 장화의 퀘스트를 완료해 다음으로 교체하세요. 보상: 자르반 1세의 장화","descEn":"Immediate: Gain a random pair of upgraded boots. Requirement: Complete its quest to swap for another. Reward: Jarvan I's Boot","shared":false},{"id":"shark-tempest","ko":"상어 폭풍","en":"Shark Tempest","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SharkTempest_small.png","descKo":"상어가 눈덩이(표식) 주위 300 범위를 돌며 지나가는 적에게 50~100의 마법 피해를 입히고 1초간 30% 둔화시킵니다. 눈덩이가 적 챔피언에게 적중하면 3초 동안 해당 위치 425 범위를 돌며 매초 25~75(+ 추가 공격력의 20%)(+ 주문력의 12%)의 마법 피해를 입히고 30% 둔화시킵니다. (미보유 시 눈덩이 획득)","descEn":"Your Mark is empowered to circle sharks around it in a 300 radius, dealing 50 to 100 magic damage to enemies it passes through as it travels and slowing targets hit by 30% for 1 second. If the missile hits an enemy champion, the sharks circle around their location in a 425 radius instead for 3 seconds, dealing25 to 75 (+ 20% bonus AD) (+ 12% AP) magic damage every secondto enemies within the area and slowing them by 30% for 3 seconds.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","shared":false},{"id":"ult-bot","ko":"궁극기 봇","en":"Ult Bot","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SkipTheBasic_small.png","descKo":"스킬 가속이 궁극기에만 적용되는 대신, 스킬 가속이 150% 증가하고 추가로 100 얻습니다.","descEn":"Your ability haste now only applies to the cooldown of your ultimate ability. In return, increase your ability haste by 150% and gain 100 ability haste.","shared":false},{"id":"snap-back","ko":"원상복구","en":"Snap Back","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"선택한 스킬에 재시전을 부여합니다. 재시전 시 원래 시전 위치로 순간이동하며 폭발해 주변 적에게 100~300(+ 공격력의 20%)(+ 주문력의 20%)의 마법 피해를 입힙니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability with a recast. Using the recast causes you to blink back to your original casting position of the ability and explode to deal 100 to 300 (+ 20% AD) (+ 20% AP) magic damage to nearby enemies.","shared":true},{"id":"snowblast","ko":"눈 폭발","en":"Snowblast","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/Snowbomb_small.png","descKo":"눈덩이(표식) 돌진을 강화해 100% 증가한 피해를 입히고, 도착 시 대상을 공중에 띄우며 주변 적을 밀쳐냅니다. 또한 눈덩이 재사용 대기시간이 스킬 가속 100만큼 감소합니다. (미보유 시 눈덩이 획득)","descEn":"Empowers the Dash spell from Mark to deal 100% increased damage and upon arrival cause you to knock up the target and knock back nearby enemies. Additionally, your Mark cooldown is reduced equivalent to 100 ability haste.\n\nIf Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","shared":false},{"id":"tripleshot","ko":"3연발","en":"Tripleshot","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"유닛을 대상으로 투사체를 발사하는 스킬을 강화합니다. 정면의 적 2명에게 추가로 투사체를 발사합니다. 같은 시전의 추가 적중은 30% 피해.","descEn":"Upgrades one of your champion's abilities that is unit-targeted and fires a missile, empowering the ability to fire its missiles at two additional enemies in front of you. Subsequent hits from the same cast against the same enemy deal 30% damage.","shared":true},{"id":"squishy-slappy-grab","ko":"말랑 찰싹 손","en":"Squishy Slappy Grab","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SquishySlappyGrab_small.png","descKo":"주변 450 내에 적 챔피언이 있으면 1.5초 후 말랑 찰싹 손을 내보내 800 내 모든 적 챔피언과 4초간 연결합니다. (재사용 대기시간 45초) 연결 중 다음 기본 공격이 연결된 적을 끌어당겨 30~100(+ 추가 체력의 10%)의 마법 피해를 입히고 0.25초간 기절시킵니다. 끌어당긴 적 1명당 25~75(+ 추가 방어력의 50%)(+ 추가 마법 저항력의 50%) 보호막을 얻습니다.","descEn":"When an enemy champion is within 450 units of you, after a 1.5-second delay, you send out Squishy Slappy Hands that latch onto all nearby enemy champions within 800 units, forming a tether between yourself and each target for 4 seconds (45 second cooldown). While the tethers persist (950 tether radius), your next basic attack is empowered to pull all tethered enemies toward you, dealing 30 to 100 (+ 10% bonus health) magic damage to affected targets and stunning them for 0.25 seconds after the pull ends. Targets are pulled over 450 units, reduced to 350 for those farther away from you. Additionally, you gain a 25 to 75 (+ 50% bonus armor) (+ 50% bonus magic resistance) shield for each pulled enemy.","shared":false},{"id":"support-main","ko":"서포터 주력","en":"Support Main","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/QuestSupportMain_small.png","descKo":"퀘스트: 아군 챔피언을 회복시키세요. 보상: 이후 모든 회복 효과가 일정 시간에 걸쳐 최초 회복량의 일부를 지속 회복으로 추가 부여합니다.","descEn":"QUEST: Heal allied champions for health. REWARD: Any healing you provide now also Heals Over Time for% of the initial heal over seconds. Healing Done: /","shared":false},{"id":"surge-field","ko":"방출 역장","en":"Surge Field","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/SurgeField_small.png","descKo":"궁극기 사용 시 발밑에 300 범위의 6초 지속 구역을 생성합니다. 구역 안에 있는 동안 스킬 가속 50과 이동 속도 40%를 얻고, 적에게 입히는 피해의 20%를 추가 마법 피해 투사체로 발사합니다.","descEn":"Upon casting your ultimate ability, you spawn a surge zone beneath you that has a 300 radius and lasts for 6 seconds. While you are within the zone, you gain 50 ability haste and 40% bonus movement speed, and your damage dealt to enemy champions fires missiles at them that deal 20% of the triggering damage instance Damage calculated before modifiers as bonus magic damage. The missile effect cannot trigger from itself.\n\nIf you leave the zone's radius for the first time, it moves to your current location. Exiting the zone a second time causes it to disappear if you do not re-enter the area within a short time.","shared":false},{"id":"stay-resolute","ko":"확고한 의지로","en":"Stay Resolute","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"선택한 스킬을 강화합니다. 적 챔피언에게 피해를 입히면 일정 시간 동안 방어력 또는 마법 저항력을 4~12 얻습니다(대상 적응형 유형 기준, 중첩 가능). (대상별/시전당 재사용 대기시간 5초) 첫 증강이 아니라면 방어력·마법 저항력을 20 얻습니다.","descEn":"Upgrades one of your champion's abilities, empowering the ability to grant you 4 to 12 for 3/1 to 11 bonus armor or bonus magic resistance for a duration when it damages an enemy champion (5 second cooldown per target per cast instance). This effect can stack up to a number of times.\n\nThe resistance type granted is based on the target's adaptive type: bonus armor for physical and bonus magic resistance for magic.\n\nIf this is not your first augment, gain 20 bonus armor and bonus magic resistance.","shared":true},{"id":"trusty-weapon","ko":"믿음직한 무기","en":"Trusty Weapon","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"선택한 스킬을 강화합니다. 적 챔피언을 맞히면 6초 동안 우정 중첩을 얻고, 중첩마다 해당 스킬 피해가 5% 증가합니다(중첩 가능).","descEn":"Upgrades one of your champion's abilities, empowering the ability to generate a Friendship stack for 6 seconds when it hits an enemy champion. For each Friendship stack you have, the ability deals 5% increased damage. This effect can stack up to a number of times.","shared":true},{"id":"void-dash","ko":"공허 돌진","en":"Void Dash","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"돌진이 있는 스킬을 강화합니다. 돌진 도착 지점에 0.3초 후 250 범위 공허 지대를 생성해 적에게 80~400(+ 스킬 가속의 100%)의 마법 피해를 입히고 1초간 35% 둔화시킵니다.","descEn":"Upgrades one of your champion's abilities that has a dash, empowering the ability to spawn a void zone (250 radius) at the dash's destination after a 0.3-second delay. Enemy champions within the zone are dealt 80 to 400 (+ 100% ability haste) magic damage and are slowed by 35% for 1 second.\n\nThis augment is currently disabled.","shared":true},{"id":"adaptive-ward","ko":"적응형 와드","en":"Adaptive Ward","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"선택한 스킬을 강화합니다. 적 챔피언을 맞히면 6초 동안 방어력 또는 마법 저항력을 5~10 얻습니다(대상 적응형 유형 기준, 중첩 가능). (재사용 대기시간 4초)","descEn":"Upgrades one of your champion's abilities, empowering the ability to grant you 5 to 10 bonus armor or bonus magic resistance for 6 seconds when it hits an enemy champion (4 second cooldown). This effect can stack up to a number of times.\n\nThe resistance type granted is based on the target's adaptive type: bonus armor for physical and bonus magic resistance for magic.","shared":true},{"id":"warlock-juicebox","ko":"마도사의 주스 상자","en":"Warlock Juicebox","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/WarlockJuicebox_small.png","descKo":"모든 피해 흡혈을 10%(+ 주문력 100당 3%) 얻습니다.","descEn":"Gain 10% (+ 3% per 100 AP) omnivamp.","shared":false},{"id":"pursuit-of-power","ko":"위력 추구","en":"Pursuit of Power","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Silver.png","descKo":"퀘스트: 선택한 스킬로 적 챔피언을 10회 적중시키세요. 보상: 해당 스킬의 피해량이 영구히 30% 증가합니다.","descEn":"Quest: Hit an enemy champion with a specific ability 10 times (counts up to 1 hit per champion per cast instance).\n\nReward: Upon completing your Quest, increase the damage of the ability by 30%.","shared":true},{"id":"endless-decimation","ko":"끝없는 학살","en":"Endless Decimation","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/EndlessDecimate_small.png","descKo":"전투 중 1.25초 정신집중 후 자신 주위 460 범위를 베는 강화된 다리우스 궁극기를 자동 시전합니다. 100~400(+ 공격력의 60%)(+ 주문력의 40%)의 물리 피해를 입히며(내부 240 범위는 50% 피해), 가장자리에 맞은 적 1명당 잃은 체력의 15%를 회복하고 재사용 대기시간이 10%씩(최소 3초) 감소합니다. (재사용 대기시간 8초)","descEn":"Automatically cast an improved version of Darius, winding up over 1.25 seconds to slash in a 460 radius around you. The slash deals 100 to 400 (+ 60% AD) (+ 40% AP) physical damage to enemies within the area (8 second cooldown). Enemies within the 240 inner radius of the slash take50% damage.Additionally, for each enemy champion hit along the outer edge, you heal for 15% of your missing health and the cooldown of this effect is reduced by 10%, down to a minimum of 3 seconds.","shared":false},{"id":"terraind","ko":"지형 생성됨","en":"Terrain'd","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/LightningStrikes_small.png","descKo":"총 공격 속도가 20% 증가합니다.\n\n초당 공격 횟수 3.5회에서 추가 마법 피해(적중 시)를 입힙니다.","descEn":"Gain 20% total Attack Speed.\n\nAt 3.5 Attacks per second, deal additional magic damage On-Hit.","shared":false},{"id":"pin-cushion","ko":"바늘꽂이","en":"Pin Cushion","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Cherry/Augments/Icons/SymphonyOfWar_small.png","descKo":"치명적 속도와 정복자 핵심 룬을 얻습니다.","descEn":"Gain the Lethal Tempo and Conqueror Keystone Runes.","shared":true},{"id":"one-trick","ko":"특기 빼면 시체","en":"One Trick","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Prismatic.png","descKo":"선택한 스킬이 대폭 강화되지만, 그 외 능력은 약해집니다.","descEn":"Your chosen ability is greatly empowered, but your other capabilities are weakened.","shared":true},{"id":"terror","ko":"공포","en":"Terror","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/GenericAbilityAugmentIcon_Gold.png","descKo":"선택한 스킬을 강화합니다. 시전 시 주변 450 내 모든 적을 1.75초 동안 공포에 빠뜨립니다. (재사용 대기시간 30초)","descEn":"Upgrades one of your champion's abilities, empowering the ability's cast to fear all enemies within 450 units of you for 1.75 seconds (30 second cooldown).","shared":true}];
const CDRAGON = 'https://raw.communitydragon.org/latest';
// 앱의 augmentImageUrl(iconPath,'large')과 동일
function iconUrl(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/game' + s.replace(/_small(\.\w+)$/i, '_large$1');
}
// 라이엇 컬러 원본은 접미사 없는 베이스 파일에 있다 — 앱과 동일
function iconUrlBase(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/game' + s.replace(/_small(\.\w+)$/i, '$1');
}
// large·base 자산이 없는 신규(Kiwi) 아이콘용 small 폴백 — 앱과 동일
function iconUrlSmall(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const s = p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
  return CDRAGON + '/plugins/rcp-be-lol-game-data/global/default' + s;
}
const RNAME = { silver: '실버', gold: '골드', prismatic: '프리즘' };
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let rarity = 'all', sharedOnly = false, query = '';

function render() {
  const out = document.getElementById('out');
  let items = DATA.filter((a) => {
    if (rarity !== 'all' && a.rarity !== rarity) return false;
    if (sharedOnly && !a.shared) return false;
    if (query) {
      const q = query.toLowerCase();
      const hay = (a.ko + ' ' + a.en + ' ' + a.id + ' ' + a.descKo + ' ' + a.descEn).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const order = { silver: 0, gold: 1, prismatic: 2 };
  const groups = {};
  for (const a of items) (groups[a.rarity] ??= []).push(a);
  out.innerHTML = '';
  const keys = Object.keys(groups).sort((x, y) => order[x] - order[y]);
  if (!keys.length) { out.innerHTML = '<div class="empty">결과 없음</div>'; return; }
  for (const k of keys) {
    const list = groups[k].sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
    const h = document.createElement('div');
    h.className = 'group-title';
    h.innerHTML = '<span class="rb ' + k + '">' + RNAME[k] + '</span> ' + list.length + '개';
    out.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const a of list) {
      const card = document.createElement('div');
      card.className = 'card' + (a.shared ? ' shared' : '');
      const img = document.createElement('img');
      img.className = 'icon';
      img.loading = 'lazy';
      img.src = iconUrl(a.iconPath);
      img.alt = a.ko;
      img.onerror = () => {
        const st = img.dataset.step || '0';
        if (st === '0') { img.dataset.step = '1'; img.src = iconUrlBase(a.iconPath); return; }
        if (st === '1') { img.dataset.step = '2'; img.src = iconUrlSmall(a.iconPath); return; }
        img.replaceWith(Object.assign(document.createElement('div'),
          { className: 'icon err', textContent: 'no img' }));
      };
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = '<div class="ko">' + esc(a.ko) + '</div>' +
        '<div class="en">' + esc(a.en) + '</div>' +
        '<div class="badges"><span class="rb ' + a.rarity + '">' + RNAME[a.rarity] + '</span>' +
        (a.shared ? '<span class="sb">공유</span>' : '') + '</div>' +
        '<div class="desc">' + esc(a.descKo) + '</div>' +
        '<div class="descEn">' + esc(a.descEn) + '</div>' +
        '<div class="iconpath">' + esc(a.iconPath.replace(/.*\//, '')) + '</div>';
      card.appendChild(img);
      card.appendChild(meta);
      grid.appendChild(card);
    }
    out.appendChild(grid);
  }
}

document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
document.querySelectorAll('.chip[data-r]').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-r]').forEach((x) => x.classList.remove('active'));
  c.classList.add('active'); rarity = c.dataset.r; render();
}));
document.getElementById('sharedOnly').addEventListener('click', (e) => {
  sharedOnly = !sharedOnly; e.target.classList.toggle('active', sharedOnly); render();
});
render();
</script>
</body>
</html>
