r Attacks.","lnKo":4,"lnEn":4,"clip":false,"edited":false,"modes":["aram"],"localIcon":null,"isNew":false,"noCoef":false,"disabled":false,"shared":true},{"id":"infinite-recursion","ko":"무한 반복","en":"Infinite Recursion","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/InfiniteRecursion_small.png","descKo":"스킬 가속을 60 얻고, 처치 관여마다 스킬 가속이 3씩 추가로 증가합니다.","descEn":"Gain 60 ability haste, increased by 3 each time you score a champion takedown.","lnKo":3,"lnEn":4,"clip":false,"edited":false,"modes":["aram"],"localIcon":null,"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"crit-n-cast","ko":"치명적 가속","en":"Crit 'n Cast","rarity":"silver","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/CritnCast_small.png","descKo":"치명타 확률의 40%에 해당하는 스킬 가속을 얻습니다.","descEn":"Gain ability haste equal to 40% of your critical strike chance.","lnKo":2,"lnEn":3,"clip":false,"edited":false,"modes":[],"localIcon":null,"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"critical-missile","ko":"치명적 미사일","en":"Critical Missile","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/CriticalMissile_small.png","descKo":"치명타 적중 시 미사일을 발사해 마법 피해를 입힙니다. 치명타 확률이 높을수록 미사일이 늘어납니다. 치명타 확률 25%를 얻습니다.","descEn":"Crits fire missiles for magic damage, with more missiles at higher crit chance. Gain 25% crit chance.","lnKo":5,"lnEn":5,"clip":false,"edited":true,"modes":[],"localIcon":null,"isNew":false,"noCoef":false,"disabled":false,"shared":false},{"id":"devil-on-your-shoulder","ko":"어깨 위의 악마","en":"Devil on Your Shoulder","rarity":"prismatic","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/LittleDevil_small.png","descKo":"지속적으로 체력을 잃는 대신 추가 고정 피해 20%를 얻습니다. 공격과 스킬이 주우면 체력을 회복하는 생명력 파편을 남깁니다.","descEn":"Lose health over time for 20% bonus true damage. Your hits drop Remnants that heal you on pickup.","lnKo":5,"lnEn":4,"clip":false,"edited":true,"modes":[],"localIcon":null,"isNew":false,"noC ,"en":"Weapon of Destiny","rarity":"gold","iconPath":"/lol-game-data/assets/ASSETS/UX/Kiwi/Augments/Icons/ProtagonistsSignatureWeapon_small.png","descKo":"첫 번째 전설급 아이템이 운명의 무기가 됩니다. 피해를 입힌 적이 3초 안에 죽으면 능력치가 200골드어치 영구히 오릅니다. 판매할 수 없습니다.","descEn":"Your first Legendary item becomes the Weapon of Destiny: takedowns within 3s permanently add 200 gold of stats. Can't be sold.","lnKo":5,"lnEn":5,"clip":false,"edited":true,"modes":["aram"],"localIcon":null,"isNew":true,"noCoef":false,"disabled":false,"shared":false}],
  item: [{"id":"2065","ko":"슈렐리아의 군가","en":"Shurelya's Battlesong","imageKey":"2065.png","gold":2200,"boots":false,"descKo":"주문력 50\n스킬 가속 15\n이동 속도 4%\n기본 마나 재생 125%\n\n고무적인 연설\n4초 동안 주변 아군의 이동 속도를 30% 상승시킵니다.","descEn":"50 Ability Power\n15 Ability Haste\n4% Move Speed\n125% Base Mana Regen\n\nInspiring Speech\nGrant nearby allies 30% Move Speed for 4 seconds.","modes":["aram"]},{"id":"2501","ko":"지배자의 피갑옷","en":"Overlord's Bloodmail","imageKey":"2501.png","gold":3300,"boots":false,"descKo":"공격력 30\n체력 550\n\n폭정\n추가 체력의 2.5%에 해당하는 공격력을 얻습니다.\n\n응징\n잃은 체력에 비례해 공격력이 12%까지 증가합니다.","descEn":"30 Attack Damage\n550 Health\n\nTyranny\nGain 2.5% of your bonus Health as Attack Damage.\n\nRetribution\nGain up to 12% increased Attack Damage based on your percent missing Health.","modes":["aram"]},{"id":"2502","ko":"끝없는 절망","en":"Unending Despair","imageKey":"2502.png","gold":2800,"boots":false,"descKo":"체력 400\n방어력 50\n스킬 가속 15\n\n고뇌\n챔피언과 전투 중일 때 4초마다 주변 적 챔피언에게 마법 피해를 입히고 피해량의 250%만큼 체력을 회복합니다.","descEn":"400 Health\n50 Armor\n15 Ability Haste\n\nAnguish\nEvery 4 seconds while in combat with champions, deal magic damage to nearby enemy champions and heal for 250% of the damage dealt.","modes":["aram"]},{"id":"2503","ko":"어둠불꽃 횃불","en":"Blackfire Torch","imageKey":"2503.png","gold":2800,"boots":false,"descKo":"주문력 80\n마나 600\n스킬 가속 20\n\n악의의 불길\n스킬로 적에게 피해를 입히면 3초 동안 추가 마법 피해를 입힙니다.\n\n어둠불꽃\n악의의 불길에 영향을 받는 적 챔피언, 에픽 몬스터, 대형 몬스터 하나당 주문력이 4% 증가합니다.","descEn":"80 Ability Power\n600 Mana\n20 Ability Haste\n\nBaleful Blaze\nDamaging Abilities deals bonus magic damage for 3 seconds.\n\nBlackfire\nFor each enemy champion, epic and large monster affected by your Baleful Blaze, gain 4% Ability Power.","modes":["aram"]},{"id":"2504","ko":"케이닉 루컨","en":"Kaenic Rookern","imageKey":"2504.png","gold":2900,"boots":false,"descKo":"체력 400\n마법 저항력 80\n기본 체력 재생 100%\n\n마법사의 파멸\n15초 동안 마법 피해를 받지 않으면 마법 보호막을 얻습니다.","descEn":"400 Health\n80 Magic Resist\n100% Base Health Regen\n\nMagebane\nAfter not taking magic damage for 15 seconds, gain a magic shield.","modes":["aram"]},{"id":"2510","ko":"황혼과 새벽","en":"Dusk and Dawn","imageKey":"2510.png","gold":3100,"boots":false,"descKo":"체력 300\n주문력 60\n스킬 가속 20\n공격 속도 20%\n\n주문 검 (0초)\n스킬을 사용하고 나면 다음 기본 공격 시 0의 추가 마법 피해를 입히고 0의 체력을 회복하며(적중 시 ) 적중 시 효과를 추가로 1회 적용합니다.","descEn":"300 Health\n60 Ability Power\n20 Ability Haste\n20% Attack Speed\n\nSpellblade (0s)\nAfter using an Ability, your next Attack deals bonus magic damage and heals you for On-Hit and then applies On-Hit effects an additional time.","modes":["aram"]},{"id":"2512","ko":"악마사냥꾼의 화살","en":"Fiendhunter Bolts","imageKey":"2512.png","gold":2650,"boots":false,"descKo":"공격 속도 45%\n치명타 확률 25%\n이동 속도 4%\n\n한밤 경계\n궁극기 가속이 30 증가합니다.\n\n폭격 개시\n궁극기를 사용하고 나면 8초 동안 다음 3회의 기본 공격 시 공격 속도가 50% 증가하고 치명타가 적용되어 일반적인 치명타 피해량의 80%만큼 피해를 입힙니다. 기본 공격에 이미 치명타가 적용된 경우, 대신 15%의 추가 고정 피해를 입힙니다.","descEn":"45% Attack Speed\n25% Critical Strike Chance\n4% Move Speed\n\nNight Vigil\nGain 30 Ultimate Ability Haste.\n\nOpening Barrage\nAfter casting your Ultimate, your next 3 basic attacks gain 50% Attack Speed and Critically Strike for 80% of your normal Critical Strike damage for 8 seconds. If an attack would already Critically Strike, instead it deals 15% bonus true damage.","modes":["aram"]},{"id":"2517","ko":"끝없는 갈망","en":"Endless Hunger","imageKey":"2517.png","gold":3100,"boots":false,"descKo":"공격력 65\n모든 피해 흡혈 5%\n강인함 20%\n\n기근\n추가 공격력에 따라 스킬 가속이 증가합니다.\n\n만찬\n최근 피해를 입힌 챔피언이 죽으면 잠시 모든 피해 흡혈을 얻습니다.","descEn":"65 Attack Damage\n5% Omnivamp\n20% Tenacity\n\nFamine\nGain Ability Haste based on your Bonus AD.\n\nFeast\nWhen a champion that you damaged recently dies, gain Omnivamp for a moderate duration.","modes":["aram"]},{"id":"2522","ko":"실체화 장비","en":"Actualizer","imageKey":"2522.png","gold":2800,"boots":false,"descKo":"주문력 90\n마나 300\n스킬 가속 10\n\n마나 실현 (0초)\n8초 동안 마나가 강화됩니다. 강화된 동안 스킬이 마나를 100% 더 소모하지만 스킬 피해량, 보호막 흡수량, 체력 회복량이 0 증가하고 기본 스킬 재사용 대기시간이 30% 더 빠르게 흐릅니다.","descEn":"90 Ability Power\n300 Mana\n10 Ability Haste\n\nMana Made Real (0s)\nFor 8 seconds, your mana is Empowered. While Empowered, your spells cost 100% more Mana, you gain increased Ability damage, Shielding, and Healing, and your basic ability cooldowns progress 30% faster.","modes":["aram"]},{"id":"2523","ko":"마법광학 장치 C44","en":"Hexoptics C44","imageKey":"2523.png","gold":2800,"boots":false,"descKo":"공격력 55\n치명타 확률 25%\n\n확대\n기본 공격 시 적과의 거리에 따라 최대 10% 증가한 피해를 입힙니다. (500 거리일 때 최대 피해)\n\n비전 조준\n피해를 입힌 챔피언이 3초 안에 사망하면 8초 동안 추가로 공격 사거리가 100 증가합니다.","descEn":"55 Attack Damage\n25% Critical Strike Chance\n\nMagnification\nDeal up to 10% increased damage with Attacks, based on how far away the enemy is (max damage at 500 range).\n\nArcane Aim\nWhen a champion that you damaged within 3 seconds dies, gain 100 additional attack range for 8 seconds.","modes":["aram"]},{"id":"2524","ko":"밴들파이프","en":"Bandlepipes","imageKey":"2524.png","gold":2300,"boots":false,"descKo":"체력 200\n스킬 가속 15\n방어력 20\n마법 저항력 20\n\n팡파르\n적 챔피언을 둔화시키거나 이동 불가 상태로 만들면 0초 동안 팡파르가 활성화됩니다. 팡파르는 이동 속도를 20 증가시킵니다. 팡파르가 활성화된 동안 자신을 포함한 주변 아군의 공격 속도가 0 증가합니다.","descEn":"200 Health\n15 Ability Haste\n20 Armor\n20 Magic Resist\n\nFanfare\nSlowing or Immobilizing an enemy champion grants Fanfare for seconds. Fanfare grants you 20 Move Speed. While you have Fanfare, nearby allies, including yourself, gain Attack Speed.","modes":["aram"]},{"id":"2525","ko":"원형질 안전벨트","en":"Protoplasm Harness","imageKey":"2525.png","gold":2500,"boots":false,"descKo":"체력 600\n스킬 가속 20\n\n생명선 (0초)\n체력이 30% 아래로 떨어질 만큼 피해를 받으면 5초 동안 최대 체력을 0 얻고 지속시간 동안 체력을 0 회복합니다. 체력을 회복하는 동안 크기가 15% 커지고 이동 속도가 10% 증가하며 강인함을 25% 얻습니다.","descEn":"600 Health\n20 Ability Haste\n\nLifeline (0s)\nTaking damage that would reduce your Health below 30% causes you to gain maximum Health for 5 seconds, then heal Health over the duration. While regenerating Health, you gain 15% increased Size, 10% Move Speed, and 25% Tenacity.","modes":["aram"]},{"id":"2526","ko":"속삭이는 머리띠","en":"Whispering Circlet","imageKey":"2526.png","gold":2250,"boots":false,"descKo":"체력 200\n체력 회복 및 보호막 8%\n기본 마나 재생 75%\n마나 300\n\n조화\n체력 회복 및 보호막 효과가 0% 증가합니다.\n\n마나순환 (8초, 최대 5회 충전)\n스킬 적중 시 최대 마나를 4 얻습니다. 챔피언 대상으로는 두 배로 적용됩니다.\n최대 마나가 360에 도달하면 악곡의 왕관으로 변합니다.","descEn":"200 Health\n8% Heal and Shield Power\n75% Base Mana Regen\n300 Mana\n\nHarmony\nGain % Heal and Shield Power.\n\nManaflow (8s, max 5 charges)\nLanding Abilities grants 4 max Mana (doubled vs. champions).\nTransforms into Diadem of Songs at 360 max Mana.","modes":["aram"]},{"id":"3003","ko":"대천사의 지팡이","en":"Archangel's Staff","imageKey":"3003.png","gold":2900,"boots":false,"descKo":"주문력 70\n마나 600\n스킬 가속 25\n\n경탄\n추가 마나의 1%만큼 주문력을 얻습니다.\n\n마나순환 (8초, 최대 충전량 5회)\n스킬 적중 시 5의 최대 마나(챔피언 상대 시 두 배)를 얻습니다.\n360의 최대 마나에 도달하면 대천사의 포옹으로 변합니다.","descEn":"70 Ability Power\n600 Mana\n25 Ability Haste\n\nAwe\nGain Ability Power equal to 1% bonus Mana.\n\nManaflow (8s, max 5 charges)\nLanding Abilities grants 5 max Mana (doubled vs. champions).\nTransforms into Seraph's Embrace at 360 max Mana.","modes":["aram"]},{"id":"3004","ko":"마나무네","en":"Manamune","imageKey":"3004.png","gold":2900,"boots":false,"descKo":"공격력 35\n마나 500\n스킬 가속 15\n\n경탄\n0의 추가 공격력을 얻습니다.\n\n마나순환 (8초, 최대 충전량 4회)\n기본 공격과 스킬 적중 시 3의 최대 마나(챔피언 상대 시 두 배)를 얻습니다.\n360의 최대 마나에 도달하면 무라마나로 변합니다.","descEn":"35 Attack Damage\n500 Mana\n15 Ability Haste\n\nAwe\nGain bonus Attack Damage.\n\nManaflow (8s, max 4 charges)\nLanding Attacks and Abilities grants 3 max Mana (doubled vs. champions).\nTransforms into Muramana at 360 max Mana.","modes":["aram"]},{"id":"3006","ko":"광전사의 군화","en":"Berserker's Greaves","imageKey":"3006.png","gold":1100,"boots":true,"descKo":"공격 속도 25%\n이동 속도 45","descEn":"25% Attack Speed\n45 Move Speed","modes":["aram"]},{"id":"3008","ko":"탐욕의 군화","en":"Gluttonous Greaves","imageKey":"3008.png","gold":1000,"boots":true,"descKo":"이동 속도 45\n모든 피해 흡혈 4%\n\n학살\n챔피언 처치 관여 시 모든 피해 흡혈이 0.6% 증가합니다. (최대 10회 중첩)","descEn":"45 Move Speed\n4% Omnivamp\n\nSlay\nGain 0.6% Omnivamp on Champion takedown, stacking up to 10 times.","modes":["aram"]},{"id":"3009","ko":"신속의 장화","en":"Boots of Swiftness","imageKey":"3009.png","gold":1000,"boots":true,"descKo":"이동 속도 55\n\n날쌘 발걸음\n둔화 효과가 25% 감소합니다.","descEn":"55 Move Speed\n\nFleetfooted\nReduce the effectiveness of Slows by 25%.","modes":["aram"]},{"id":"3020","ko":"마법사의 신발","en":"Sorcerer's Shoes","imageKey":"3020.png","gold":1100,"boots":true,"descKo":"마법 관통력 12\n이동 속도 45","descEn":"12 Magic Penetration\n45 Move Speed","modes":["aram"]},{"id":"3031","ko":"무한의 대검","en":"Infinity Edge","imageKey":"3031.png","gold":3500,"boots":false,"descKo":"공격력 75\n치명타 확률 25%\n치명타 피해량 30%","descEn":"75 Attack Damage\n25% Critical Strike Chance\n30% Critical Strike Damage","modes":["aram"]},{"id":"3032","ko":"윤 탈 야생화살","en":"Yun Tal Wildarrows","imageKey":"3032.png","gold":3100,"boots":false,"descKo":"공격력 50\n공격 속도 40%\n치명타 확률 0%\n\n연습이 치명타를 낳는다\n공격 시 치명타 확률이 영구적으로 최대 25%까지 증가합니다.\n\n광풍\n적 챔피언 공격 시 6초 동안 공격 속도가 30% 증가합니다. (재사용 대기시간 30초)\n기본 공격 시 이 스킬의 재사용 대기시간이 1초 감소합니다. 치명타 적중 시 2초 감소합니다.","descEn":"50 Attack Damage\n40% Attack Speed\n0% Critical Strike Chance\n\nPractice Makes Lethal\nOn-Attack, gain Critical Strike Chance permanently up to 25%.\n\nFlurry\nOn-Attacking an enemy champion, gain 30% Attack Speed for 6 seconds (30 second cooldown).\nAttacks reduce this cooldown by 1 second, increased to 2 seconds for Critical Strikes.","modes":["aram"]},{"id":"3033","ko":"필멸자의 운명","en":"Mortal Reminder","imageKey":"3033.png","gold":3000,"boots":false,"descKo":"공격력 35\n방어구 관통력 30%\n치명타 확률 25%\n\n고통스러운 상처\n적 챔피언에게 물리 피해를 입히면 3초 동안 40%의 상처를 남깁니다.","descEn":"35 Attack Damage\n30% Armor Penetration\n25% Critical Strike Chance\n\nGrievous Wounds\nDealing physical damage applies 40% Wounds to enemy champions for 3 seconds.","modes":["aram"]},{"id":"3036","ko":"도미닉 경의 인사","en":"Lord Dominik's Regards","imageKey":"3036.png","gold":3300,"boots":false,"descKo":"공격력 35\n방어구 관통력 35%\n치명타 확률 25%\n\n거인 학살자\n대상의 추가 체력에 비례해 챔피언에게 최대 15%의 추가 피해를 입힙니다. 추가 피해량은 추가 체력이 1500일 때 최대가 됩니다.","descEn":"35 Attack Damage\n35% Armor Penetration\n25% Critical Strike Chance\n\nGiant Slayer\nDeal up to 15% bonus damage against champions based on their bonus Health. Maximum damage bonus reached at 1500 bonus Health.","modes":["aram"]},{"id":"3046","ko":"유령 무희","en":"Phantom Dancer","imageKey":"3046.png","gold":2650,"boots":false,"descKo":"공격 속도 65%\n치명타 확률 25%\n이동 속도 10%\n\n망령의 왈츠\n유체화 상태가 됩니다.","descEn":"65% Attack Speed\n25% Critical Strike Chance\n10% Move Speed\n\nSpectral Waltz\nBecome Ghosted.","modes":["aram"]},{"id":"3047","ko":"판금 장화","en":"Plated Steelcaps","imageKey":"3047.png","gold":1200,"boots":true,"descKo":"방어력 25\n이동 속도 45\n\n장갑판\n기본 공격으로 받는 피해량이 10% 감소합니다.","descEn":"25 Armor\n45 Move Speed\n\nPlating\nReduces incoming damage from Attacks by 10%.","modes":["aram"]},{"id":"3050","ko":"지크의 융합","en":"Zeke's Convergence","imageKey":"3050.png","gold":2200,"boots":false,"descKo":"체력 300\n방어력 25\n마법 저항력 25\n스킬 가속 10\n\n서리불꽃 폭풍\n궁극기 사용 시 주변에 5초 동안 폭풍을 소환합니다. 폭풍은 적 챔피언에게 매초 30의 마법 피해를 입히고 30% 둔화시킵니다.","descEn":"300 Health\n25 Armor\n25 Magic Resist\n10 Ability Haste\n\nFrostfire Tempest\nCasting your Ultimate summons a storm around you for 5 seconds. The storm deals 30 magic damage per second to enemy champions and Slows them by 30%.","modes":["aram"]},{"id":"3053","ko":"스테락의 도전","en":"Sterak's Gage","imageKey":"3053.png","gold":3200,"boots":false,"descKo":"체력 400\n강인함 20%\n\n잡아채는 발톱\n추가 공격력을 얻습니다.\n\n생명선\n체력이 30% 밑으로 떨어질 만큼 피해를 입으면 4.5초 동안 피해를 흡수하며 점차 사라지는 보호막을 얻습니다.","descEn":"400 Health\n20% Tenacity\n\nThe Claws that Catch\nGain bonus Attack Damage.\n\nLifeline\nTaking damage that would reduce your Health below 30% grants a decaying Shield for 4.5 seconds.","modes":["aram"]},{"id":"3065","ko":"정령의 형상","en":"Spirit Visage","imageKey":"3065.png","gold":2700,"boots":false,"descKo":"체력 400\n마법 저항력 50\n스킬 가속 10\n기본 체력 재생 100%\n\n무한한 활력\n자신이 받는 회복 효과와 보호막 효과가 25% 증가합니다.","descEn":"400 Health\n50 Magic Resist\n10 Ability Haste\n100% Base Health Regen\n\nBoundless Vitality\nHeals and Shields on you are increased by 25%.","modes":["aram"]},{"id":"3068","ko":"태양불꽃 방패","en":"Sunfire Aegis","imageKey":"3068.png","gold":2700,"boots":false,"descKo":"체력 350\n방어력 50\n스킬 가속 10\n\n불사르기\n피해를 받거나 입히면 주변 적들에게 3초 동안 매초 마법 피해를 입힙니다.","descEn":"350 Health\n50 Armor\n10 Ability Haste\n\nImmolate\nAfter taking or dealing damage, deal magic damage per second to nearby enemies for 3 seconds.","modes":["aram"]},{"id":"3071","ko":"칠흑의 양날 도끼","en":"Black Cleaver","imageKey":"3071.png","gold":3000,"boots":false,"descKo":"공격력 40\n체력 400\n스킬 가속 20\n\n깎아내기\n챔피언에게 물리 피해를 입히면 6초 동안 대상의 방어력을 6% 감소시킵니다. (5회 중첩)\n\n열정\n물리 피해를 입히면 2초 동안 이동 속도가 20 증가합니다.","descEn":"40 Attack Damage\n400 Health\n20 Ability Haste\n\nCarve\nDealing physical damage to champions reduces the target's Armor by 6% for 6 seconds. (stacks 5 times).\n\nFervor\nDealing physical damage grants 20 Move Speed for 2 seconds.","modes":["aram"]},{"id":"3072","ko":"피바라기","en":"Bloodthirster","imageKey":"3072.png","gold":3400,"boots":false,"descKo":"공격력 80\n생명력 흡수 15%\n\n영액의 보호막\n생명력 흡수 효과로 체력 회복 시 초과분을 보호막으로 전환합니다.","descEn":"80 Attack Damage\n15% Life Steal\n\nIchorshield\nConvert excess healing from your Lifesteal to a Shield.","modes":["aram"]},{"id":"3073","ko":"실험적 마공학판","en":"Experimental Hexplate","imageKey":"3073.png","gold":3000,"boots":false,"descKo":"공격력 40\n공격 속도 20%\n체력 450\n\n마공학 충전\n궁극기 가속이 30 증가합니다.\n\n폭주\n궁극기를 사용한 후 8초 동안 공격 속도가 0%, 이동 속도가 0% 증가합니다.","descEn":"40 Attack Damage\n20% Attack Speed\n450 Health\n\nHexcharged\nGain 30 Ultimate Ability Haste.\n\nOverdrive\nAfter casting your Ultimate, gain % Attack Speed and % Move Speed for 8 seconds.","modes":["aram"]},{"id":"3074","ko":"굶주린 히드라","en":"Ravenous Hydra","imageKey":"3074.png","gold":3300,"boots":false,"descKo":"공격력 65\n스킬 가속 15\n생명력 흡수 12%\n\n쪼개기\n기본 공격 시 주변 적들에게 물리 피해를 입힙니다.\n\n굶주린 초승달\n주변 적에게 물리 피해를 입힙니다.\n이 피해에는 생명력 ts Move Speed.","modes":["aram"]},{"id":"3142","ko":"요우무의 유령검","en":"Youmuu's Ghostblade","imageKey":"3142.png","gold":2800,"boots":false,"descKo":"공격력 55\n물리 관통력 18\n이동 속도 4%\n\n출몰\n전투에서 벗어나 있으면 이동 속도가 0 상승합니다.\n\n망령의 발걸음\n0초 동안 이동 속도가 상승하고 유체화 효과를 얻습니다.","descEn":"55 Attack Damage\n18 Lethality\n4% Move Speed\n\nHaunt\nGain Move Speed while out of combat.\n\nWraith Step\nGain Move Speed and Ghosting for seconds.","modes":["aram"]},{"id":"3143","ko":"란두인의 예언","en":"Randuin's Omen","imageKey":"3143.png","gold":2700,"boots":false,"descKo":"체력 350\n방어력 75\n\n저항\n치명타로 받는 피해량이 30% 감소합니다.\n억제\n주변 적을 2초 동안 70% 둔화시킵니다.","descEn":"350 Health\n75 Armor\n\nResilience\nReceive 30% less damage from Critical Strikes.\nHumility\nSlow nearby enemies by 70% for 2 seconds.","modes":["aram"]},{"id":"3146","ko":"마법공학 총검","en":"Hextech Gunblade","imageKey":"3146.png","gold":3000,"boots":false,"descKo":"주문력 80\n공격력 40\n모든 피해 흡혈 10%\n\n활성화 (0초)\n번개 화살\n적 챔피언에게 충격을 줘 0의 마법 피해를 입히고 1.5초 동안 25% 둔화시킵니다.","descEn":"80 Ability Power\n40 Attack Damage\n10% Omnivamp\n\nACTIVE (0s)\nLightning Bolt\nShocks the target enemy champion, dealing magic damage and slowing them by 25% for 1.5 seconds.","modes":["aram"]},{"id":"3152","ko":"마법공학 로켓 벨트","en":"Hextech Rocketbelt","imageKey":"3152.png","gold":2650,"boots":false,"descKo":"주문력 70\n체력 300\n스킬 가속 20\n\n초음속\n지정 방향으로 돌진하며 마법 피해를 입히는 탄환을 발사합니다.","descEn":"70 Ability Power\n300 Health\n20 Ability Haste\n\nSupersonic\nDash in target direction, unleashing missiles that deal magic damage.","modes":["aram"]},{"id":"3153","ko":"몰락한 왕의 검","en":"Blade of The Ruined King","imageKey":"3153.png","gold":3200,"boots":false,"descKo":"공격력 40\n공격 속도 25%\n생명력 흡수 10%\n\n안개의 검\n기본 공격 시 적의 현재 체력의 일정 비율만큼 추가 물리 피해(적중 시 )를 입힙니다.\n\n할퀴는 그림자\n챔피언에게 3회 기본 공격을 가하면 1초 동안 30% 둔화시킵니다.","descEn":"40 Attack Damage\n25% Attack Speed\n10% Life Steal\n\nMist's Edge\nAttacks deal a percentage of enemy's current Health as bonus physical damage On-Hit.\n\nClawing Shadows\nAttacking a champion 3 times Slows them by 30% for 1 second.","modes":["aram"]},{"id":"3156","ko":"맬모셔스의 아귀","en":"Maw of Malmortius","imageKey":"3156.png","gold":3100,"boots":false,"descKo":"공격력 60\n스킬 가속 15\n마법 저항력 40\n\n생명선\n체력이 30% 밑으로 떨어질 만큼 마법 피해를 입으면 3초 동안 마법 피해를 흡수하는 보호막을 얻고 전투가 끝날 때까지 10%의 모든 피해 흡혈을 얻습니다.","descEn":"60 Attack Damage\n15 Ability Haste\n40 Magic Resist\n\nLifeline\nTaking magic damage that would reduce your Health below 30% grants a magic damage Shield for 3 seconds and 10% Omnivamp until end of combat.","modes":["aram"]},{"id":"3157","ko":"존야의 모래시계","en":"Zhonya's Hourglass","imageKey":"3157.png","gold":3250,"boots":false,"descKo":"주문력 105\n방어력 50\n\n시간 정지\n2.5초 동안 경직 상태가 됩니다.","descEn":"105 Ability Power\n50 Armor\n\nTime Stop\nEnter Stasis for 2.5 seconds.","modes":["aram"]},{"id":"3158","ko":"명석함의 아이오니아 장화","en":"Ionian Boots of Lucidity","imageKey":"3158.png","gold":900,"boots":true,"descKo":"스킬 가속 10\n이동 속도 45\n\n아이오니아의 통찰\n소환사 주문 가속이 10 증가합니다.","descEn":"10 Ability Haste\n45 Move Speed\n\nIonian Insight\nGain 10 Summoner Spell Haste.","modes":["aram"]},{"id":"3161","ko":"쇼진의 창","en":"Spear of Shojin","imageKey":"3161.png","gold":3100,"boots":false,"descKo":"공격력 45\n체력 450\n\n드래곤의 힘\n기본 스킬 가속이 25 증가합니다.\n\n집중된 의지\n스킬로 피해를 입히면 챔피언 스킬과 기본 지속 효과 피해량이 6초 동안 3% 증가합니다. (4회 중첩)","descEn":"45 Attack Damage\n450 Health\n\nDragonforce\nGain 25 Basic Ability Haste.\n\nFocused Will\nDealing damage with Abilities increases your Champion's Ability and Passive damage by 3% for 6 seconds. (stacks 4 times).","modes":["aram"]},{"id":"3165","ko":"모렐로노미콘","en":"Morellonomicon","imageKey":"3165.png","gold":2850,"boots":false,"descKo":"주문력 75\n체력 350\n스킬 가속 15\n\n고통스러운 상처\n챔피언에게 마법 피해를 입히면 3초 동안 40%의 상처를 남깁니다.","descEn":"75 Ability Power\n350 Health\n15 Ability Haste\n\nGrievous Wounds\nDealing magic damage to champions applies 40% Wounds for 3 seconds.","modes":["aram"]},{"id":"3179","ko":"그림자 검","en":"Umbral Glaive","imageKey":"3179.png","gold":2800,"boots":false,"descKo":"공격력 60\n물리 관통력 18\n스킬 가속 15\n\n밤의 추적자\n잠시 적에게 보이지 않으면 챔피언 대상 다음 기본 공격 시 추가 고정 피해를 입힙니다.\n\n암전\n주변에 있는 적 투명 와드와 함정을 잠시 드러냅니다. 지속시간 동안 와드를 기본 공격하면 추가 피해를 입힙니다.","descEn":"60 Attack Damage\n18 Lethality\n15 Ability Haste\n\nNightstalker\nAfter being unseen by enemies briefly, your next attack against a champion deals an additional true damage.\n\nBlackout\nWhen you are near enemy Stealth Wards and traps, reveal them briefly. While revealing wards, your attacks deal bonus damage to them.","modes":["aram"]},{"id":"3181","ko":"선체파괴자","en":"Hullbreaker","imageKey":"3181.png","gold":3000,"boots":false,"descKo":"공격력 40\n체력 500\n이동 속도 4%\n\n선장\n챔피언과 에픽 몬스터에게 다섯 번째 기본 공격을 가할 때마다 추가 물리 피해를 입힙니다. 대상이 구조물일 경우 피해량이 증가합니다.\n\n승선 부대\n주변 공성 미니언과 슈퍼 미니언이 방어력 및 마법 저항력을 얻습니다.","descEn":"40 Attack Damage\n500 Health\n4% Move Speed\n\nSkipper\nEvery fifth Attack against champions and epic monsters deals bonus physical damage, increased against Structures.\n\nBoarding Party\nNearby allied siege and super minions gain Armor and Magic Resist.","modes":["aram"]},{"id":"3190","ko":"강철의 솔라리 펜던트","en":"Locket of the Iron Solari","imageKey":"3190.png","gold":2200,"boots":false,"descKo":"체력 200\n방어력 30\n마법 저항력 30\n스킬 가속 10\n\n헌신\n주변 아군들에게 290~360의 피해를 흡수하는 보호막을 부여합니다. 보호막 피해 흡수량은 2.5초에 걸쳐 점차 감소합니다.","descEn":"200 Health\n30 Armor\n30 Magic Resist\n10 Ability Haste\n\nDevotion\nGrant nearby allies a 290 - 360 Shield that decays over 2.5 seconds.","modes":["aram"]},{"id":"3222","ko":"미카엘의 축복","en":"Mikael's Blessing","imageKey":"3222.png","gold":2300,"boots":false,"descKo":"체력 250\n기본 마나 재생 100%\n체력 회복 및 보호막 12%\n스킬 가속 15\n\n정화\n아군 챔피언에게 걸린 모든 군중 제어 효과(공중에 뜸 및 제압 제외)를 제거하고 체력을 100~250 회복합니다.","descEn":"250 Health\n100% Base Mana Regen\n12% Heal and Shield Power\n15 Ability Haste\n\nPurify\nRemove all crowd control debuffs (excluding Airborne and Suppression) from an ally champion and restore 100 - 250 Health.","modes":["aram"]},{"id":"3302","ko":"경계","en":"Terminus","imageKey":"3302.png","gold":3000,"boots":false,"descKo":"공격력 30\n공격 속도 35%\n\n그림자\n기본 공격 시 30의 추가 마법 피해(적중 시 )를 입힙니다.\n\n빛과 어둠\n챔피언에게 기본 공격 시 빛과 어둠 기본 공격을 번갈아 가며 적용합니다. 빛 기본 공격 시 5초 동안 방어력과 마법 저항력이 증가합니다. 어둠 기본 공격 시 5초 동안 방어구 관통력과 마법 관통력이 10% 증가합니다.","descEn":"30 Attack Damage\n35% Attack Speed\n\nShadow\nAttacks deal 30 bonus magic damage On-Hit.\n\nJuxtaposition\nAlternate between Light and Dark Attacks against champions: Light Attacks grant Armor and Magic Resist for 5s. Dark Attacks grant 10% Armor Penetration and Magic Penetration for 5s.","modes":["aram"]},{"id":"3504","ko":"불타는 향로","en":"Ardent Censer","imageKey":"3504.png","gold":2200,"boots":false,"descKo":"주문력 45\n체력 회복 및 보호막 10%\n기본 마나 재생 125%\n이동 속도 4%\n\n축성\n아군을 치유하거나 보호막을 씌워주면 6초 동안 자신과 대상 아군의 공격 속도가 25% 상승하고 공격 시 20의 마법 피해(적중 시 )를 입힙니다.","descEn":"45 Ability Power\n10% Heal and Shield Power\n125% Base Mana Regen\n4% Move Speed\n\nSanctify\nHealing or Shielding an ally enhances you both for 6 seconds, granting 25% Attack Speed and 20 magic damage On-Hit.","modes":["aram"]},{"id":"3508","ko":"정수 약탈자","en":"Essence Reaver","imageKey":"3508.png","gold":3050,"boots":false,"descKo":"공격력 50\n스킬 가속 20\n치명타 확률 25%\n\n주문 검\n스킬을 사용하고 나면 다음 기본 공격 시 추가 물리 피해를 입히고 마나를 얻습니다. (적중 시 )","descEn":"50 Attack Damage\n20 Ability Haste\n25% Critical Strike Chance\n\nSpellblade\nAfter using an Ability, your next Attack deals bonus physical damage and grants Mana On-Hit.","modes":["aram"]},{"id":"3742","ko":"망자의 갑옷","en":"Dead Man's Plate","imageKey":"3742.png","gold":2900,"boots":false,"descKo":"체력 350\n방어력 55\n이동 속도 4%\n\n침몰시키는 자\n이동 시 최대 20의 추가 이동 속도를 얻습니다. 다음 기본 공격 시 추가 물리 피해를 입히고 추가 이동 속도를 잃습니다.\n\n굴하지 않는 자\n둔화 효과가 15% 감소합니다.","descEn":"350 Health\n55 Armor\n4% Move Speed\n\nShipwrecker\nWhile moving, build up to 20 bonus Move Speed. Your next Attack discharges built up Move Speed to deal bonus physical damage.\n\nUnsinkable\nReduce the effectiveness of Slows by 15%.","modes":["aram"]},{"id":"3748","ko":"거대한 히드라","en":"Titanic Hydra","imageKey":"3748.png","gold":3300,"boots":false,"descKo":"공격력 40\n체력 600\n\n쪼개기\n기본 공격 적중 시 대상 뒤의 적들에게 물리 피해를 입힙니다.\n거대한 초승달\n다음 쪼개기를 강화하여 추가 물리 피해(적중 시 )를 입히고 대상 뒤의 적들에게 추가 물리 피해를 입힙니다.","descEn":"40 Attack Damage\n600 Health\n\nCleave\nAttacks deal physical damage on-hit and to enemies behind the target.\nTitanic Crescent\nEmpower your next Cleave to deal bonus physical damage On-Hit and deal bonus physical damage to enemies behind the target.","modes":["aram"]},{"id":"3814","ko":"밤의 끝자락","en":"Edge of Night","imageKey":"3814.png","gold":3000,"boots":false,"descKo":"공격력 50\n물리 관통력 15\n체력 250\n\n무효화\n적의 다음 스킬을 막아 주는 주문 방어막을 생성합니다.","descEn":"50 Attack Damage\n15 Lethality\n250 Health\n\nAnnul\nGrants a Spell Shield that blocks the next enemy Ability.","modes":["aram"]},{"id":"4005","ko":"제국의 명령","en":"Imperial Mandate","imageKey":"4005.png","gold":2400,"boots":false,"descKo":"주문력 65\n스킬 가속 15\n기본 마나 재생 150%\n\n통제\n이동 불가 효과를 지닌 스킬의 스킬 가속이 15 증가합니다.\n\n명령\n적 챔피언에게 이동 불가 효과를 적용하면 4초 동안 해당 챔피언에게 6% 취약 표식을 남깁니다.","descEn":"65 Ability Power\n15 Ability Haste\n150% Base Mana Regen\n\nControl\nGain 15 Ability Haste for your abilities with Immobilizing effects.\n\nCommand\nOn Immobilizing an enemy champion, mark them as 6% Vulnerable for 4 seconds.","modes":["aram"]},{"id":"4401","ko":"대자연의 힘","en":"Force of Nature","imageKey":"4401.png","gold":2800,"boots":false,"descKo":"체력 400\n마법 저항력 55\n이동 속도 4%\n\n굳건함\n챔피언에게 마법 피해를 8회 받으면 70의 마법 저항력 및 6%의 추가 이동 속도를 얻습니다.","descEn":"400 Health\n55 Magic Resist\n4% Move Speed\n\nSteadfast\nGain 70 Magic Resist and 6% bonus Move Speed after taking magic damage from Champions 8 times.","modes":["aram"]},{"id":"4628","ko":"지평선의 초점","en":"Horizon Focus","imageKey":"4628.png","gold":2700,"boots":false,"descKo":"주문력 75\n스킬 가속 25\n\n초강력 사격\n600 거리 이상에서 스킬로 챔피언에게 피해를 입히면 6초 동안 대상의 위치를 드러냅니다.\n\n집중\n초강력 사격 발동 시 3초 동안 대상으로부터 1400의 사거리 내에 있는 다른 모든 적 챔피언의 위치를 드러냅니다.","descEn":"75 Ability Power\n25 Ability Haste\n\nHypershot\nDealing Ability damage to champions at 600 range or greater Reveals them for 6 seconds.\n\nFocus\nWhen Hypershot is triggered, Reveal all other enemy champions within 1400 range of them for 3 seconds.","modes":["aram"]},{"id":"4629","ko":"우주의 추진력","en":"Cosmic Drive","imageKey":"4629.png","gold":3000,"boots":false,"descKo":"주문력 70\n체력 350\n스킬 가속 25\n이동 속도 4%\n\n마법의 춤\n챔피언에게 마법 피해 또는 고정 피해를 입히면 4초 동안 이동 속도가 증가합니다.","descEn":"70 Ability Power\n350 Health\n25 Ability Haste\n4% Move Speed\n\nSpelldance\nDealing magic or true damage to champions grants Move Speed for 4 seconds.","modes":["aram"]},{"id":"4633","ko":"균열 생성기","en":"Riftmaker","imageKey":"4633.png","gold":3100,"boots":false,"descKo":"주문력 70\n체력 350\n스킬 가속 15\n\n공허의 부패\n적 챔피언과 전투 중 매초 2%의 추가 피해(최대 8%)를 입힙니다. 피해량이 최대가 되면 모든 피해 흡혈을 얻습니다.\n\n공허의 마력\n추가 체력의 2%만큼 주문력이 상승합니다.","descEn":"70 Ability Power\n350 Health\n15 Ability Haste\n\nVoid Corruption\nFor each second in combat with enemy champions, deal 2% bonus damage, up to 8%. At maximum strength, gain Omnivamp.\n\nVoid Infusion\nGain 2% of your bonus Health as Ability Power.","modes":["aram"]},{"id":"4645","ko":"그림자불꽃","en":"Shadowflame","imageKey":"4645.png","gold":3200,"boots":false,"descKo":"주문력 110\n마법 관통력 15\n\n잿덩이꽃\n체력이 40% 이하인 적에게 마법과 고정 피해가 치명타로 적용되어 20%의 추가 피해를 입힙니다.","descEn":"110 Ability Power\n15 Magic Penetration\n\nCinderbloom\nMagic and true damage Critically Strikes enemies below 40% Health, dealing 20% increased damage.","modes":["aram"]},{"id":"4646","ko":"폭풍 쇄도","en":"Stormsurge","imageKey":"4646.png","gold":2800,"boots":false,"descKo":"주문력 90\n마법 관통력 15\n이동 속도 6%\n\n폭풍 약탈자\n2.5초 내로 챔피언 최대 체력의 25%에 해당하는 피해를 입히면 질풍을 적용합니다.\n\n질풍\n2초 후에 마법 피해를 입힙니다. 질풍이 발동하기 전에 대상이 사망할 경우 주변 적에게 피해를 입힙니다.","descEn":"90 Ability Power\n15 Magic Penetration\n6% Move Speed\n\nStormraider\nDealing 25% of a champion's maximum Health within 2.5s applies Squall to them.\n\nSquall\nAfter 2 seconds, deal magic damage. If the target dies before Squall triggers, it damages nearby enemies.","modes":["aram"]},{"id":"6333","ko":"죽음의 무도","en":"Death's Dance","imageKey":"6333.png","gold":3300,"boots":false,"descKo":"공격력 60\n방어력 50\n스킬 가속 15\n\n고통 무시\n자신이 받은 피해의 일정 비율만큼을 3초에 걸쳐서 입습니다.\n\n반항\n자신이 피해를 입힌 챔피언이 3초 안에 죽으면 고통 무시의 지속 피해 효과가 사라지고 2초에 걸쳐 체력을 회복합니다.","descEn":"60 Attack Damage\n50 Armor\n15 Ability Haste\n\nIgnore Pain\nA percentage of damage taken is dealt to you over 3 seconds instead.\n\nDefy\nWhen a champion that you damaged within 3 seconds dies, cleanse Ignore Pain's remaining damage and restore Health over 2 seconds.","modes":["aram"]},{"id":"6609","ko":"화공 펑크 사슬검","en":"Chempunk Chainsword","imageKey":"6609.png","gold":3000,"boots":false,"descKo":"공격력 45\n체력 450\n스킬 가속 15\n\n광란의 뿔\n적 챔피언에게 물리 피해를 입히면 3초 동안 40%의 상처를 남깁니다.","descEn":"45 Attack Damage\n450 Health\n15 Ability Haste\n\nHackshorn\nDealing physical damage applies 40% Wounds to enemy champions for 3 seconds.","modes":["aram"]},{"id":"6610","ko":"갈라진 하늘","en":"Sundered Sky","imageKey":"6610.png","gold":3100,"boots":false,"descKo":"공격력 45\n체력 400\n스킬 가속 10\n\n라이트실드 타격\n챔피언에게 처음 기본 공격을 가할 때 치명타로 적용되고 체력을 회복합니다.","descEn":"45 Attack Damage\n400 Health\n10 Ability Haste\n\nLightshield Strike\nYour first Attack against a champion Critically Strikes and restores Health.","modes":["aram"]},{"id":"6616","ko":"흐르는 물의 지팡이","en":"Staff of Flowing Water","imageKey":"6616.png","gold":2250,"boots":false,"descKo":"주문력 35\n체력 회복 및 보호막 10%\n기본 마나 재생 125%\n스킬 가속 10\n\n급류\n아군의 체력을 회복시키거나 보호막을 씌우면 6초 동안 자신과 아군의주문력이 40, 스킬 가속이 15 증가합니다.","descEn":"35 Ability Power\n10% Heal and Shield Power\n125% Base Mana Regen\n10 Ability Haste\n\nRapids\nHealing or Shielding an ally grants you both 40 Ability Power and 15 Ability Haste for 6 seconds.","modes":["aram"]},{"id":"6617","ko":"월석 재생기","en":"Moonstone Renewer","imageKey":"6617.png","gold":2200,"boots":false,"descKo":"주문력 25\n체력 200\n스킬 가속 20\n기본 마나 재생 125%\n\n별빛 은총\n아군을 상대로 체력을 회복시키거나 보호막을 씌우면 (자신을 제외하고) 다른 아군에게 연쇄 효과가 적용되며 기존 수치의 30%만큼 체력을 회복시키거나 35%만큼 피해를 흡수하는 보호막을 부여합니다.","descEn":"25 Ability Power\n200 Health\n20 Ability Haste\n125% Base Mana Regen\n\nStarlit Grace\nHealing or shielding an ally chains the effect to another ally (excluding yourself), healing 30% or shielding 35% of the original amount.","modes":["aram"]},{"id":"6620","ko":"헬리아의 메아리","en":"Echoes of Helia","imageKey":"6620.png","gold":2200,"boots":false,"descKo":"주문력 35\n체력 200\n스킬 가속 20\n기본 마나 재생 125%\n\n영혼 흡수\n챔피언에게 입힌 감소 전 피해량의 30%만큼 영혼 충전을 얻습니다. 아군을 상대로 체력을 회복시키거나 보호막을 씌우면 모든 영혼 충전을 소모해 체력을 회복합니다.","descEn":"35 Ability Power\n200 Health\n20 Ability Haste\n125% Base Mana Regen\n\nSoul Siphon\nGain 30% of pre-mitigation damage dealt to champions as Soul Charges. Healing or Shielding an ally consumes all Soul Charges to restore Health.","modes":["aram"]},{"id":"6621","ko":"새벽심장","en":"Dawncore","imageKey":"6621.png","gold":2500,"boots":false,"descKo":"주문력 45\n체력 회복 및 보호막 16%\n기본 마나 재생 100%\n\n태초의 빛\n기본 마나 재생 100%당 체력 회복 및 보호막 효과가 2%, 주문력이 10 증가합니다.","descEn":"45 Ability Power\n16% Heal and Shield Power\n100% Base Mana Regen\n\nFirst Light\nGain 2% Heal and Shield Power and 10 Ability Power per 100% Base Mana Regen.","modes":["aram"]},{"id":"6631","ko":"발걸음 분쇄기","en":"Stridebreaker","imageKey":"6631.png","gold":3300,"boots":false,"descKo":"공격력 40\n공격 속도 25%\n체력 450\n\n쪼개기\n기본 공격 시 주변 적들에게 물리 피해를 입힙니다.\n파괴의 충격파\n물리 피해를 입히고 주변 적을 35% 둔화시킵니다.\n적중한 챔피언 하나당 3초 동안 이동 속도가 35% 증가했다가 점차 감소합니다.","descEn":"40 Attack Damage\n25% Attack Speed\n450 Health\n\nCleave\nAttacks deal physical damage to nearby enemies.\nBreaking Shockwave\nDeal physical damage and Slow nearby enemies by 35%.\nGain 35% decaying Move Speed per champion hit for 3 seconds.","modes":["aram"]},{"id":"6653","ko":"리안드리의 고통","en":"Liandry's Torment","imageKey":"6653.png","gold":3000,"boots":false,"descKo":"주문력 60\n체력 300\n\n고통\n스킬 공격이 적을 불태워 3초 동안 매초 최대 체력의 2%에 해당하는 마법 피해를 입힙니다.\n\n고난\n적 챔피언과 전투 중 매초 2%의 추가 피해를 입힙니다. (최대 6%)","descEn":"60 Ability Power\n300 Health\n\nTorment\nDamaging Abilities burn enemies for 2% max Health magic damage per second for 3 seconds.\n\nSuffering\nFor each second in combat with enemy champions, deal 2% bonus damage, up to 6%.","modes":["aram"]},{"id":"6655","ko":"루덴의 메아리","en":"Luden's Echo","imageKey":"6655.png","gold":2750,"boots":false,"descKo":"주문력 100\n마나 600\n스킬 가속 10\n\n메아리\n스킬로 적에게 피해를 입히면 메아리를 6개 발사하여 대상과 주변 적에게 추가 마법 피해를 입힙니다. 남은 메아리는 주 대상에게 발사하여 20%의 피해를 입힙니다.","descEn":"100 Ability Power\n600 Mana\n10 Ability Haste\n\nEcho\nDamaging Abilities fire 6 Echoes that deal bonus magic damage to the target and nearby enemies. Remaining Echoes fire on the primary target, dealing 20% damage.","modes":["aram"]},{"id":"6657","ko":"영겁의 지팡이","en":"Rod of Ages","imageKey":"6657.png","gold":2600,"boots":false,"descKo":"주문력 45\n체력 350\n마나 500\n\n불멸의 시간\n60초마다 체력 10, 마나 30, 주문력 3씩 상승합니다. 최대 10회까지 중첩됩니다. 최대 중첩에 도달하면 레벨이 오릅니다.\n\n영원\n챔피언에게 피해를 입으면 피해량의 10%를 마나로 회복합니다.\n스킬 사용 시 사용한 마나의 25%만큼 체력을 회복합니다.","descEn":"45 Ability Power\n350 Health\n500 Mana\n\nTimeless\nThis item gains 10 Health, 30 Mana and 3 Ability Power every 60 seconds up to 10 times. Upon reaching max stacks, gain a level.\n\nEternity\nTaking damage from champions restores 10% of the damage as Mana.\nCasting an ability heals for 25% of Mana spent.","modes":["aram"]},{"id":"6662","ko":"얼어붙은 건틀릿","en":"Iceborn Gauntlet","imageKey":"6662.png","gold":2900,"boots":false,"descKo":"체력 300\n방어력 50\n스킬 가속 15\n\n주문 검\n스킬을 사용하고 나면 다음 기본 공격 시 추가 물리 피해(적중 시 )를 입힙니다. 또한 둔화시키는 서리 영역을 2초 동안 생성합니다.","descEn":"300 Health\n50 Armor\n15 Ability Haste\n\nSpellblade\nAfter using an Ability, your next Attack deals bonus physical damage On-Hit and creates a frost field for 2s that Slows.","modes":["aram"]},{"id":"6664","ko":"공허한 광휘","en":"Hollow Radiance","imageKey":"6664.png","gold":2800,"boots":false,"descKo":"체력 400\n마법 저항력 40\n스킬 가속 10\n기본 체력 재생 100%\n\n불사르기\n피해를 받거나 입히면 주변 적들에게 3초 동안 매초 마법 피해를 입힙니다.\n\n황폐\n적을 처치하면 주변에 마법 피해를 입힙니다.","descEn":"400 Health\n40 Magic Resist\n10 Ability Haste\n100% Base Health Regen\n\nImmolate\nAfter taking or dealing damage, deal magic damage per second to nearby enemies for 3 seconds.\n\nDesolate\nKilling an enemy deals magic damage around them.","modes":["aram"]},{"id":"6665","ko":"해신 작쇼","en":"Jak'Sho, The Protean","imageKey":"6665.png","gold":3200,"boots":false,"descKo":"체력 350\n방어력 45\n마법 저항력 45\n\n공허 태생의 저항력\n챔피언과 5초 이상 전투를 벌이면 전투가 끝날 때까지 추가 방어력 및 마법 저항력이 30% 증가합니다.","descEn":"350 Health\n45 Armor\n45 Magic Resist\n\nVoidborn Resilience\nAfter 5 seconds of champion combat, increase your bonus Armor and Magic Resist by 30% until end of combat.","modes":["aram"]},{"id":"6672","ko":"크라켄 학살자","en":"Kraken Slayer","imageKey":"6672.png","gold":3000,"boots":false,"descKo":"공격력 45\n공격 속도 40%\n이동 속도 4%\n\n벼락\n세 번째 기본 공격마다 추가 물리 피해(적중 시 )를 입힙니다. 잃은 체력에 따라 피해량이 증가합니다.","descEn":"45 Attack Damage\n40% Attack Speed\n4% Move Speed\n\nBring It Down\nEvery third Attack deals bonus physical damage On-Hit, increased based on their missing Health.","modes":["aram"]},{"id":"6673","ko":"불멸의 철갑궁","en":"Immortal Shieldbow","imageKey":"6673.png","gold":3000,"boots":false,"descKo":"공격력 55\n치명타 확률 25%\n\n생명선\n체력이 30% 밑으로 떨어질 만큼 피해를 입으면 3초 동안 보호막을 얻습니다.","descEn":"55 Attack Damage\n25% Critical Strike Chance\n\nLifeline\nTaking damage that would reduce your Health below 30% grants a Shield for 3 seconds.","modes":["aram"]},{"id":"6675","ko":"나보리 명멸검","en":"Navori Flickerblade","imageKey":"6675.png","gold":2650,"boots":false,"descKo":"공격 속도 40%\n치명타 확률 25%\n이동 속도 4%\n\n깨달음\n기본 공격 시 기본 스킬의 남은 재사용 대기시간이 15% 감소합니다.","descEn":"40% Attack Speed\n25% Critical Strike Chance\n4% Move Speed\n\nTranscendence\nAttacks reduce Basic Ability cooldowns by 15% of their remaining cooldown.","modes":["aram"]},{"id":"6676","ko":"징수의 총","en":"The Collector","imageKey":"6676.png","gold":3000,"boots":false,"descKo":"공격력 50\n물리 관통력 10\n치명타 확률 25%\n\n죽음\n체력이 5% 미만인 챔피언에게 피해를 입힐 경우 처형합니다.\n\n세금\n챔피언 처치 시 추가로 25골드를 획득합니다.","descEn":"50 Attack Damage\n10 Lethality\n25% Critical Strike Chance\n\nDeath\nYour damage executes champions that are below 5% Health.\n\nTaxes\nChampion kills grant 25 bonus gold.","modes":["aram"]},{"id":"6692","ko":"월식","en":"Eclipse","imageKey":"6692.png","gold":2900,"boots":false,"descKo":"공격력 60\n스킬 가속 15\n\n늘 떠오르는 달\n2초 내에 한 챔피언에게 별개의 기본 공격이나 스킬로 2회 공격하면 2초 동안 일정 피해를 흡수하는 보호막을 얻습니다.","descEn":"60 Attack Damage\n15 Ability Haste\n\nEver Rising Moon\nHitting a champion with 2 separate Attacks or Abilities within 2 seconds grants you a Shield for 2 seconds.","modes":["aram"]},{"id":"6694","ko":"세릴다의 원한","en":"Serylda's Grudge","imageKey":"6694.png","gold":3000,"boots":false,"descKo":"공격력 45\n방어구 관통력 35%\n스킬 가속 15\n\n매서운 추위\n스킬로 체력이 50% 아래인 적에게 피해를 입히면 1초 동안 30% 둔화시킵니다.","descEn":"45 Attack Damage\n35% Armor Penetration\n15 Ability Haste\n\nBitter Cold\nDamaging Abilities Slow enemies below 50% Health by 30% for 1 second.","modes":["aram"]},{"id":"6695","ko":"독사의 송곳니","en":"Serpent's Fang","imageKey":"6695.png","gold":2500,"boots":false,"descKo":"공격력 55\n물리 관통력 15\n\n보호막 파괴자\n적 챔피언에게 피해를 입히면 3초 동안 대상이 받는 보호막의 효과를 0% 감소시킵니다.\n보호막 파괴자에 영향을 받지 않은 대상에게 피해를 입히면 보호막의 효과를 0% 감소시킵니다.","descEn":"55 Attack Damage\n15 Lethality\n\nShield Reaver\nDamaging an enemy champion reduces Shields they gain by % for 3 seconds.\nIf they were not already affected by Shield Reaver, reduce Shields on them by %.","modes":["aram"]},{"id":"6696","ko":"원칙의 원형낫","en":"Axiom Arc","imageKey":"6696.png","gold":2750,"boots":false,"descKo":"공격력 55\n물리 관통력 18\n스킬 가속 20\n\n전이 표식\n자신이 피해를 입힌 챔피언이 3초 안에 죽으면 궁극기 총 재사용 대기시간의 일부를 돌려받습니다.","descEn":"55 Attack Damage\n18 Lethality\n20 Ability Haste\n\nFlux\nWhen a champion that you damaged within 3 seconds dies, refund some of your Ultimate Ability's total cooldown.","modes":["aram"]},{"id":"6697","ko":"오만","en":"Hubris","imageKey":"6697.png","gold":2800,"boots":false,"descKo":"공격력 55\n물리 관통력 18\n스킬 가속 10\n\n명성\n자신이 피해를 입힌 챔피언이 3초 안에 죽으면 90초 동안 12+처치한 챔피언 하나당 3의 공격력이 증가합니다.","descEn":"55 Attack Damage\n18 Lethality\n10 Ability Haste\n\nEminence\nWhen a champion that you damaged within 3 seconds dies, gain 12 Attack Damage plus 3 per champion killed for 90 seconds.","modes":["aram"]},{"id":"6698","ko":"불경한 히드라","en":"Profane Hydra","imageKey":"6698.png","gold":2850,"boots":false,"descKo":"공격력 55\n물리 관통력 18\n스킬 가속 10\n\n쪼개기\n기본 공격 시 주변 적들에게 물리 피해를 입힙니다.\n이단의 가르기\n주변에 물리 피해를 입힙니다.","descEn":"55 Attack Damage\n18 Lethality\n10 Ability Haste\n\nCleave\nAttacks deal physical damage to nearby enemies.\nHeretical Cleave\nDeal physical damage around you.","modes":["aram"]},{"id":"6699","ko":"벼락폭풍검","en":"Voltaic Cyclosword","imageKey":"6699.png","gold":3000,"boots":false,"descKo":"공격력 55\n물리 관통력 10\n스킬 가속 10\n\n전류 자극\n적 챔피언에게 스킬로 피해를 입히면 준비된 충전 상태가 발동합니다.\n\n창공\n충전 상태로 공격 시 대상 현재 체력에 비례하는 추가 물리 피해를 입히고 4초 동안 추가 물리 관통력을 획득합니다.","descEn":"55 Attack Damage\n10 Lethality\n10 Ability Haste\n\nGalvanize\nDamaging an Enemy Champions with an ability triggers Energized if it is ready.\n\nFirmament\nYour Energized Attack deals % target's Current Health as bonus physical damage and grants you bonus Lethality for 4 seconds.","modes":["aram"]},{"id":"8010","ko":"핏빛 저주","en":"Bloodletter's Curse","imageKey":"8010.png","gold":2900,"boots":false,"descKo":"주문력 65\n체력 400\n스킬 가속 15\n\n썩은 부식\n챔피언에게 스킬 또는 기본 지속 효과로 마법 피해를 입히면 6초 동안 대상의 마법 저항력이 7.5% 감소합니다. (4회 중첩)","descEn":"65 Ability Power\n400 Health\n15 Ability Haste\n\nVile Decay\nDealing magic damage with abilities or passives to champions reduces their Magic Resist by 7.5% for 6 seconds. (Stacks 4 times).","modes":["aram"]},{"id":"8020","ko":"심연의 가면","en":"Abyssal Mask","imageKey":"8020.png","gold":2650,"boots":false,"descKo":"체력 350\n마법 저항력 45\n스킬 가속 15\n\n파괴\n주변 적 챔피언이 입는 마법 피해가 12% 증가합니다.","descEn":"350 Health\n45 Magic Resist\n15 Ability Haste\n\nUnmake\nNearby enemy champions take 12% more magic damage.","modes":["aram"]}],

 6% per 100 AP). Additionally, your cooldown is reduced equivalent to 50 ability haste. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark. This augment is currently disabled.","appNums":["50"],"wikiNums":["2","50","6","100","50"]},{"id":"upgrade-infinity-edge","name":"Upgrade Infinity Edge","app":"With Infinity Edge, your crit chance grants random bonus crit damage on each attack. Gain 500 gold.","wiki":"Upgrades Infinity Edge, empowering it to gain. Additionally, gain. Excoriate: Gain a random amount of bonus critical strike damage that scales up to 50% of your critical strike chance, with the value of this amount changing every 0.25 seconds.","appNums":["500"],"wikiNums":["50","0.25"]},{"id":"upgrade-sheen","name":"Upgrade Sheen","app":"Upgrades all Spellblade items: the proc deals bonus max health damage and heals you. Gain 250 gold.","wiki":"Upgrades all Spellblade items, empowering the passive effect to deal additional bonus physical damage equal to 4% of the target's maximum health and heal you for 3.5% of the target's maximum health. Additionally, gain.","appNums":["250"],"wikiNums":["4","3.5"]},{"id":"vulnerability","name":"Vulnerability","app":"Your Item and damage over time effects can Critically Strike. Gain 25% Crit chance.","wiki":"Damage dealt by items and damage over time effects can now critically strike for (145% +) damage (5 second cooldown per cast instance). Additionally, gain 25% critical strike chance. If both Jeweled Gauntlet and Vulnerability are equipped, only rolls the critical strike chance of the augment that has the higher critical damage (or either if equal).","appNums":["25"],"wikiNums":["145","5","25"]},{"id":"biggest-snowball-ever","name":"Biggest Snowball Ever","app":"Mark becomes a giant snowball piercing minions, dealing damage, knocking up, and slowing. Mark gains 100 haste.","wiki":"Upgrades your Mark into a massive snowball, empowering it with an increased size radius and the ability k in Here With Me","app":"Your ultimate grows an aura. When it ends, enemies inside are taunted and you take less damage. Gain 30 ultimate haste.","wiki":"Casting your ultimate ability grants you an aura for 2 seconds, growing in size over the duration to up to 500 units. After the duration, you taunt all enemies within the aura for 2 seconds and gain 50% damage reduction for the same duration (30 second cooldown). Additionally, gain 30 ultimate haste. Aura is activated once the ultimate's effect starts or has elapsed.","appNums":["30"],"wikiNums":["2","500","2","50","30","30"]},{"id":"twin-fire","name":"Twin Fire","app":"Damaging a champion with an ability launches missiles, more at higher crit chance. Gain 25% crit chance.","wiki":"Damaging abilities against enemy champions launch 1 (+ 1 per 33.33% critical strike chance) missiles at the target that each deal 10 to 30 (+ 7% bonus AD) (+ 7% AP) magic damage (5 second cooldown). Additionally, gain 25% critical strike chance.","appNums":["25"],"wikiNums":["1","1","33.33","10","30","7","7","5","25"]},{"id":"hellbent","name":"Hellbent","app":"Hits build stacks. At max, lethal damage revives you empowered with bonus stats. (120s cooldown)","wiki":"Generate a stack of Revivemaxxing for each enemy champion you hit with basic attacks on-hit or abilities, lasting for 6 seconds, refreshing on subsequent hits, and stacking up to 10 times. At maximum stacks, you become Hellbent. Hellbent: Upon taking lethal damage, you enter resurrection for 4 seconds, during which you are invulnerable, untargetable, and unable to act. Afterwards, you revive with 35 to 75 of your maximum health (90 second cooldown). Additionally, you become empowered for the next 15 seconds, granting you 25*0.6 to 200*0.6 bonus Attack Damage or 25 to 200 Ability Power (Adaptive), 20 to 40 bonus movement speed while facing toward nearby enemy champions, and 15 to 30 omnivamp for the duration.","appNums":["120"],"wikiNums":["6","10","4","35","75","90","15","25", eath and lasting 10 seconds. You or allied champions can collect the coins by moving over them, granting for each coin collected.","appNums":["6","10","10","15"],"wikiNums":["6","10","500","10"]},{"id":"bolstered","name":"Bolstered","app":"Upgrades an ability with a shield, increasing its shield strength by 0-60.","wiki":"Upgrades one of your champion's abilities that has a shield effect, increasing the strength of the ability's shield by key=%.","appNums":["0","60"],"wikiNums":[]},{"id":"shark-bait","name":"Shark Bait","app":"Lethal damage zombifies you for 3.5s. Then a shark erupts, damaging and knocking up nearby enemies.","wiki":"Upon taking fatal damage, you become a Shark Bait, causing you to enter a zombie state for 3.5 seconds, during which your movement speed is set to a static 400, you gain ghosting, and enemies within 400 units of you are slowed by 40%. At the end of the duration, a massive shark emerges from beneath you that lets out a powerful chomp (400 radius), dealing 120 to 350 (+ 30% of target's missing health) magic damage to all enemies within the area and knocking them up for 1 second. While under the zombie state, you are able to move and become invulnerable, untargetable, and immune to crowd control, but you are also rendered unable to declare basic attacks, cast abilities, use summoner spells, and activate items.","appNums":["3.5"],"wikiNums":["3.5","400","400","40","400","120","350","30","1"]},{"id":"lil-extra-help","name":"Lil' Extra Help","app":"Upgrades an attack-empowering ability: while active, gain 150 (melee 100) attack range and 75% (melee 40%) attack speed.","wiki":"Upgrades one of your champion's abilities that has an effect which empowers your basic attacks for a duration, further enhancing the attacks by granting you bonus attack range and {{as| bonus attack speed}} while the effect is active.","appNums":["150","100","75","40"],"wikiNums":[]},{"id":"nature-is-healing","name":"Nature is Healing","app":"Heal yourself for 0.6 to 2.1 of your maximum health for each second that you are within brush.","wiki":"Upon entering a patch of brush, you are healed forover 1.5 seconds (20 second cooldown per brush patch).","appNums":["0.6","2.1"],"wikiNums":["1.5","20"]},{"id":"shark-tempest","name":"Shark Tempest","app":"Sharks circle your Mark, damaging and slowing enemies. On champion hit they circle that spot for 3s.","wiki":"Your Mark is empowered to circle sharks around it in a 300 radius, dealing 100 to 200 magic damage to enemies it passes through as it travels and slowing targets hit by 40% for 1 second. If the missile hits an enemy champion, the sharks circle around their location in a 425 radius instead for 3 seconds, dealingto enemies within the area and slowing them by 40% for 3 seconds. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","appNums":["3"],"wikiNums":["300","100","200","40","1","425","3","40","3"]},{"id":"snowblast","name":"Snowblast","app":"Mark's dash deals 100% more damage and on arrival knocks up the target and knocks back nearby enemies. Mark gains 100 haste.","wiki":"Empowers the Dash spell from Mark to deal 100% increased damage and upon arrival cause you to knock up the target for 0.5 seconds and knock back nearby enemies. Additionally, your cooldown is reduced equivalent to 100 ability haste. If Mark is not equipped, you will be prompted to replace one of your summoner spells with Mark.","appNums":["100","100"],"wikiNums":["100","0.5","100"]},{"id":"surge-field","name":"Surge Field","app":"Your ultimate spawns a zone granting ability haste and move speed. Inside, reflect 20% of your damage.","wiki":"Upon casting your ultimate ability, you spawn a surge zone beneath you that has a 300 radius. While you are within the zone, you gain 50 ability haste and 40% bonus movement speed, and your damage dealt to enemy champions fires missiles at them that deal 20% of the triggering damage instance pre-mitigation as bonus magic damage. The missile effect cannot trigger from itself. The zone lasts indefinitely as long as you stay within its radius. If you leave the zone's radius for the first time, it moves to your current location. Exiting the zone a second time causes it to disappear if you do not re-enter the area within 1.25 seconds.","appNums":["20"],"wikiNums":["300","50","40","20","1.25"]},{"id":"adaptive-ward","name":"Adaptive Ward","app":"Upgrades an ability: hitting a champion grants armor or MR for 6s, matching their adaptive type. Stacks.","wiki":"Upgrades one of your champion's abilities, empowering the ability to grant you 7 to 12 bonus armor or bonus magic resistance for 6 seconds when it hits an enemy champion (4 second cooldown). This effect can stack up to a number of times. The resistance type granted is based on the target's adaptive type: bonus armor for physical and bonus magic resistance for magic.","appNums":["6"],"wikiNums":["7","12","6","4"]},{"id":"pursuit-of-power","name":"Pursuit of Power","app":"Quest: hit an enemy champion with a chosen ability 10 times. Reward: that ability deals 30% more damage.","wiki":"Quest: Hit an enemy champion with a specific ability 10 times (counts up to 1 hit per champion per cast instance). Reward: Upon completing your Quest, increase the damage of the ability by 30%.","appNums":["10","30"],"wikiNums":["10","1","30"]},{"id":"upgrade-death-s-dance","name":"Upgrade Death's Dance","app":"Upgrades Death's Dance: damage taken is dealt over 3s, and takedowns instantly heal you. Gain 250 gold.","wiki":"Upgrades Death's Dance, empowering with an increased damage reduction of and with an increased heal AD ratio of 125% bonus AD. healing is also granted instantly upon the passive effect being triggered rather than over 2 seconds. Additionally, gain.","appNums":["3","250"],"wikiNums":["125","2"]},{"id":"upgrade-ravenous-hydra","name":"Upgrade Ravenous Hydra","app":"Abilities trigger Cleave and Ravenous Hydra gains 18% life steal. Gain 500 gold.","wiki":"Upgrades Ravenous Hydra, increasing its life steal stat to 20% and empowering to trigger its effect on ability hits against enemies (1 second cooldown per ability). Additionally, gain.","appNums":["18","500"],"wikiNums":["20","1"]},{"id":"upgrade-sundered-sky","name":"Upgrade Sundered Sky","app":"Sundered Sky's cooldown drops to 5s and it heals 9% of your missing health. Gain 500 gold.","wiki":"Upgrades Sundered Sky, empowering with an increased heal health ratio of 9% of your missing health and a reduced cooldown of 5 seconds. Additionally, gain.","appNums":["5","9","500"],"wikiNums":["9","5"]}];
const CLIP_LINES = 6;
const CDRAGON = 'https://raw.communitydragon.org/latest';
const DDRAGON = 'https://ddragon.leagueoflegends.com/cdn/16.16.1';
const strip = (p) => p.replace(/^\/lol-game-data\/assets/i, '').toLowerCase();
// 앱의 augmentImageUrl — large → base(컬러 원본) → small 3단 폴백
const augUrl = (p) => CDRAGON + '/game' + strip(p).replace(/_small(\.\w+)$/i, '_large$1');
const augUrlBase = (p) => CDRAGON + '/game' + strip(p).replace(/_small(\.\w+)$/i, '$1');
const augUrlSmall = (p) => CDRAGON + '/plugins/rcp-be-lol-game-data/global/default' + strip(p);
// 앱의 itemImageUrl
const itemUrl = (k) => DDRAGON + '/img/item/' + k;

const RNAME = { silver: '실버', gold: '골드', prismatic: '프리즘' };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let ds = 'aug', mode = 'all', rarity = 'all', query = '';
const flags = { clip: false, edited: false, shared: false, isNew: false, noCoef: false };

function pass(a) {
  if (rarity !== 'all' && a.rarity !== rarity) return false;
  if (mode !== 'all') {
    if (mode === 'none' && (a.modes ?? []).length) return false;
    else if (mode !== 'none' && !(a.modes ?? []).includes(mode)) return false;
  }
  if (flags.clip && !a.clip) return false;
  if (flags.edited && !a.edited) return false;
  if (flags.shared && !a.shared) return false;
  if (flags.isNew && !a.isNew) return false;
  if (flags.noCoef && !a.noCoef) return false;
  if (query) {
    const hay = (a.ko + ' ' + a.en + ' ' + a.id + ' ' + a.descKo + ' ' + a.descEn).toLowerCase();
    if (!hay.includes(query.toLowerCase())) return false;
  }
  return true;
}

function badges(a) {
  let b = '';
  if (a.rarity) b += '<span class="rb ' + a.rarity + '">' + RNAME[a.rarity] + '</span>';
  if (ds === 'aug') {
    if (a.modes.includes('aram')) b += '<span class="mb aram">칼바람</span>';
    if (!a.modes.length) b += '<span class="mb none">비공개</span>';
  }
  if (ds === 'item') b += '<span class="gb">' + a.gold + 'G</span>';
  if (a.lnKo > CLIP_LINES) b += '<span class="xb">잘림 ko ' + a.lnKo + '줄</span>';
  if (a.lnEn > CLIP_LINES) b += '<span class="xb">잘림 en ' + a.lnEn + '줄</span>';
  if (a.isNew) b += '<span class="nb">신규</span>';
  if (a.noCoef) b += '<span class="cb">수치 미확인</span>';
  if (a.disabled) b += '<span class="db">비활성</span>';
  if (a.edited) b += '<span class="tb">설명 수정됨</span>';
  if (a.shared) b += '<span class="sb">공유</span>';
  return b;
}

function card(a) {
  const el = document.createElement('div');
  el.className = 'card' + (a.shared ? ' shared' : '') + (a.isNew ? ' isnew' : '') +
    (a.lnKo > CLIP_LINES || a.lnEn > CLIP_LINES ? ' clip' : '');
  const img = document.createElement('img');
  img.className = 'icon';
  img.loading = 'lazy';
  img.alt = a.ko;
  img.src = ds === 'item' ? itemUrl(a.imageKey) : (a.localIcon || augUrl(a.iconPath));
  img.onerror = () => {
    if (ds !== 'item') {
      const st = img.dataset.step || '0';
      if (st === '0') { img.dataset.step = '1'; img.src = augUrlBase(a.iconPath); return; }
      if (st === '1') { img.dataset.step = '2'; img.src = augUrlSmall(a.iconPath); return; }
    }
    img.replaceWith(Object.assign(document.createElement('div'),
      { className: 'icon err', textContent: 'no img' }));
  };
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<div class="ko">' + esc(a.ko) + '</div>' +
    '<div class="en">' + esc(a.en) + '</div>' +
    '<div class="badges">' + badges(a) + '</div>' +
    '<div class="desc">' + esc(a.descKo) + '</div>' +
    '<div class="descEn">' + esc(a.descEn) + '</div>' +
    '<div class="iconpath">' + (a.localIcon ? '앱 내장 · ' : '') + esc(a.imageKey ?? a.iconPath.replace(/.*\//, '')) + '</div>';
  el.appendChild(img);
  el.appendChild(meta);
  return el;
}

// 데이터셋마다 묶는 축이 다르다 — 증강은 등급, 아이템은 신발 여부.
function groupsOf(list) {
  if (ds === 'aug') {
    const order = ['silver', 'gold', 'prismatic'];
    return order
      .map((r) => [RNAME[r] + ' 증강', list.filter((a) => a.rarity === r)])
      .filter(([, l]) => l.length);
  }
  return [['전설 아이템', list.filter((a) => !a.boots)], ['신발', list.filter((a) => a.boots)]]
    .filter(([, l]) => l.length);
}

function render() {
  const all = DATA[ds];
  const list = all.filter(pass).sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
  document.getElementById('count').innerHTML = '<b>' + list.length + '</b> / ' + all.length + '개';
  const out = document.getElementById('out');
  out.innerHTML = '';
  if (!list.length) { out.innerHTML = '<div class="empty">결과 없음</div>'; return; }
  for (const [title, group] of groupsOf(list)) {
    const h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = title + ' · ' + group.length + '개';
    out.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const a of group) grid.appendChild(card(a));
    out.appendChild(grid);
  }
}

// 고른 데이터셋에 해당 없는 칩은 비활성이 아니라 숨긴다 — 못 누르는 칩은 노이즈다.
// 남는 칩이 없으면 행 자체(라벨 포함)를 접는다.
function syncChips() {
  for (const c of document.querySelectorAll('.chip[data-for]')) {
    c.classList.toggle('hide', !c.dataset.for.split(' ').includes(ds));
  }
  for (const row of document.querySelectorAll('.frow[id]')) {
    row.classList.toggle('hide', !row.querySelector('.chip:not(.hide)'));
  }
}

function selectGroup(g, v) {
  for (const c of document.querySelectorAll('.chip[data-g="' + g + '"]')) {
    c.classList.toggle('active', c.dataset.v === v && !c.classList.contains('hide'));
  }
}

document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });

for (const c of document.querySelectorAll('.chip[data-g]')) {
  c.addEventListener('click', () => {
    const g = c.dataset.g;
    for (const x of document.querySelectorAll('.chip[data-g="' + g + '"]')) x.classList.remove('active');
    c.classList.add('active');
    if (g === 'ds') {
      // 데이터셋이 바뀌면 하위 필터는 의미가 달라진다 — 남겨두면 빈 화면이 뜬다.
      ds = c.dataset.v;
      mode = 'all'; rarity = 'all';
      for (const k of Object.keys(flags)) flags[k] = false;
      for (const x of document.querySelectorAll('.chip[data-t]')) x.classList.remove('active');
      syncChips();
      selectGroup('mode', 'all');
      selectGroup('rarity', 'all');
    } else if (g === 'mode') mode = c.dataset.v;
    else rarity = c.dataset.v;
    render();
  });
}

for (const c of document.querySelectorAll('.chip[data-t]')) {
  c.addEventListener('click', () => {
    flags[c.dataset.t] = !flags[c.dataset.t];
    c.classList.toggle('active', flags[c.dataset.t]);
    render();
  });
}

document.getElementById('reset').addEventListener('click', () => {
  mode = 'all'; rarity = 'all'; query = '';
  for (const k of Object.keys(flags)) flags[k] = false;
  document.getElementById('q').value = '';
  for (const x of document.querySelectorAll('.chip[data-t]')) x.classList.remove('active');
  selectGroup('mode', 'all');
  selectGroup('rarity', 'all');
  render();
});

// 앱 설명과 위키 수치가 엇갈리는 건들. 대개 서술 상세도 차이라 자동 반영하지 않고
// 여기 모아만 둔다 — 실제 패치 변경인지 눈으로 가려 다음 커밋에서 정리한다.
if (NUMBER_DIFFS.length) {
  const d = document.createElement('details');
  d.className = 'review';
  d.innerHTML = '<summary>앱 · 위키 수치가 다른 ' + NUMBER_DIFFS.length +
    '건 — 확인 필요 (자동 반영하지 않음)</summary><table>' +
    NUMBER_DIFFS.map((r) =>
      '<tr><td class="n">' + esc(r.name) + '</td>' +
      '<td class="a"><b>앱</b> ' + esc(r.app) + '<br><b>위키</b> <span class="w">' + esc(r.wiki) + '</span></td></tr>'
    ).join('') + '</table>';
  document.body.appendChild(d);
}

syncChips();
render();
</script>
</body>
</html>
